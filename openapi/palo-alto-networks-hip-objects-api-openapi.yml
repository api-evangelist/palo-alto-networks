  schemas:
    error_detail_cause_infos:
      type: array
      items:
        $ref: '#/components/schemas/error_detail_cause_info'
      x-examples: {}
    hip-objects:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: UUID of the resource
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          pattern: ^[ a-zA-Z\d.\-_]+$
          description: The name of the HIP object
          maxLength: 31
        description:
          type: string
          maxLength: 255
        host_info:
          type: object
          properties:
            criteria:
              type: object
              properties:
                domain:
                  type: object
                  oneOf:
                  - type: object
                    title: contains
                    properties:
                      contains:
                        type: string
                        maxLength: 255
                    required:
                    - contains
                  - type: object
                    title: is
                    properties:
                      is:
                        type: string
                        maxLength: 255
                    required:
                    - is
                  - type: object
                    title: is_not
                    properties:
                      is_not:
                        type: string
                        maxLength: 255
                    required:
                    - is_not
                os:
                  type: object
                  oneOf:
                  - type: object
                    title: contains
                    properties:
                      contains:
                        type: object
                        oneOf:
                        - type: object
                          title: Microsoft
                          properties:
                            Microsoft:
                              type: string
                              description: Microsoft vendor
                              maxLength: 255
                              default: All
                          required:
                          - Microsoft
                        - type: object
                          title: Apple
                          properties:
                            Apple:
                              type: string
                              description: Apple vendor
                              maxLength: 255
                              default: All
                          required:
                          - Apple
                        - type: object
                          title: Google
                          properties:
                            Google:
                              type: string
                              description: Google vendor
                              maxLength: 255
                              default: All
                          required:
                          - Google
                        - type: object
                          title: Linux
                          properties:
                            Linux:
                              type: string
                              description: Linux vendor
                              maxLength: 255
                              default: All
                          required:
                          - Linux
                        - type: object
                          title: Other
                          properties:
                            Other:
                              type: string
                              description: Other vendor
                              maxLength: 255
                          required:
                          - Other
                    required:
                    - contains
                client_version:
                  type: object
                  oneOf:
                  - type: object
                    title: contains
                    properties:
                      contains:
                        type: string
                        maxLength: 255
                    required:
                    - contains
                  - type: object
                    title: is
                    properties:
                      is:
                        type: string
                        maxLength: 255
                    required:
                    - is
                  - type: object
                    title: is_not
                    properties:
                      is_not:
                        type: string
                        maxLength: 255
                    required:
                    - is_not
                host_name:
                  type: object
                  oneOf:
                  - type: object
                    title: contains
                    properties:
                      contains:
                        type: string
                        maxLength: 255
                    required:
                    - contains
                  - type: object
                    title: is
                    properties:
                      is:
                        type: string
                        maxLength: 255
                    required:
                    - is
                  - type: object
                    title: is_not
                    properties:
                      is_not:
                        type: string
                        maxLength: 255
                    required:
                    - is_not
                host_id:
                  type: object
                  oneOf:
                  - type: object
                    title: contains
                    properties:
                      contains:
                        type: string
                        maxLength: 255
                    required:
                    - contains
                  - type: object
                    title: is
                    properties:
                      is:
                        type: string
                        maxLength: 255
                    required:
                    - is
                  - type: object
                    title: is_not
                    properties:
                      is_not:
                        type: string
                        maxLength: 255
                    required:
                    - is_not
                managed:
                  type: boolean
                  description: If device is managed
                serial_number:
                  type: object
                  oneOf:
                  - type: object
                    title: contains
                    properties:
                      contains:
                        type: string
                        maxLength: 255
                    required:
                    - contains
                  - type: object
                    title: is
                    properties:
                      is:
                        type: string
                        maxLength: 255
                    required:
                    - is
                  - type: object
                    title: is_not
                    properties:
                      is_not:
                        type: string
                        maxLength: 255
                    required:
                    - is_not
          required:
          - criteria
        network_info:
          type: object
          properties:
            criteria:
              type: object
              properties:
                network:
                  type: object
                  oneOf:
                  - type: object
                    title: is
                    properties:
                      is:
                        type: object
                        oneOf:
                        - type: object
                          title: wifi
                          properties:
                            wifi:
                              type: object
                              properties:
                                ssid:
                                  type: string
                                  description: SSID
                                  pattern: .*
                                  maxLength: 1023
                        - type: object
                          title: mobile
                          properties:
                            mobile:
                              type: object
                              properties:
                                carrier:
                                  type: string
                                  pattern: .*
                                  maxLength: 1023
                        - type: object
                          title: unknown
                          properties:
                            unknown:
                              type: object
                  - type: object
                    title: is_not
                    properties:
                      is_not:
                        type: object
                        oneOf:
                        - type: object
                          title: wifi
                          properties:
                            wifi:
                              type: object
                              properties:
                                ssid:
                                  type: string
                                  description: SSID
                                  pattern: .*
                                  maxLength: 1023
                        - type: object
                          title: mobile
                          properties:
                            mobile:
                              type: object
                              properties:
                                carrier:
                                  type: string
                                  pattern: .*
                                  maxLength: 1023
                        - type: object
                          title: ethernet
                          properties:
                            ethernet:
                              type: object
                        - type: object
                          title: unknown
                          properties:
                            unknown:
                              type: object
        patch_management:
          type: object
          properties:
            criteria:
              type: object
              properties:
                is_installed:
                  type: boolean
                  description: Is Installed
                  default: true
                is_enabled:
                  enum:
                  - 'no'
                  - 'yes'
                  - not-available
                  description: is enabled
                missing_patches:
                  type: object
                  properties:
                    severity:
                      type: object
                      oneOf:
