  description: 'Operations tagged Incidents by Severity across 3 of this provider''s published API definitions: palo-alto-networks-incidents-by-severity-api-openapi.yml, palo-alto-sase-5g-monitor-api-openapi-original.yml, palo-alto-sase-monitor-services-5g-sase-5g-monitor-openapi.yaml. Each path carries the servers of the definition it was published in.'
