components:
  schemas:
    CreateTenantGroupRequest:
      required:
      - groupName
      type: object
      properties:
        groupName:
          maxLength: 63
          minLength: 3
          type: string
          example: Staging Gateway 82
        tenantIds:
          type: array
          items:
            type: string
          example:
          - example-tenantIds_item
          - example-tenantIds_item
    UpdateTenantGroupRequest:
      required:
      - groupName
      type: object
      properties:
        groupName:
          maxLength: 63
          minLength: 3
          type: string
          example: Staging Firewall 76
        tenantIds:
          type: array
          items:
            type: string
          example:
          - example-tenantIds_item
    TenantIds:
      type: object
      properties:
        externalTenantId:
          type: string
          example: '755704'
        prismaId:
          type: string
          example: '454413'
    TenantGroupsResponse:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/TenantGroupResponse'
          example:
          - id: 7f4e6576-9ea5-4354-a200-3c1205d09a9e
            groupName: Branch Gateway 90
            tenants:
            - externalTenantId: '849955'
              prismaId: '788442'
            createdAt: 183
            createdBy: example-createdBy
        nextPageToken:
          type: string
          example: example-nextPageToken
    ErrorResponse:
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          example: example-code
        message:
          type: string
          example: Incident malware violation firewall endpoint investigation firewall network rule blocked activity rule.
        target:
          type: string
          example: example-target
        details:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          example:
          - code: example-code
            message: Incident malware violation firewall endpoint investigation firewall network rule blocked activity rule.
            target: example-target
            details:
            - code: example-code
              message: Incident malware violation firewall endpoint investigation firewall network rule blocked activity rule.
              target: example-target
              details:
              - {}
              - {}
            - code: example-code
              message: Incident malware violation firewall endpoint investigation firewall network rule blocked activity rule.
              target: example-target
              details:
