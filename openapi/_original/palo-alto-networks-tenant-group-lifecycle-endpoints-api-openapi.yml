      operationId: getTenantGroupsByMsspId
      parameters:
      - name: mssp-id
        in: path
        description: the mssp the managed tenants belong to
        required: true
        schema:
          type: string
        example: '424374'
      - name: next_page_token
        in: query
        description: pagination token to continue a previous queryif set
        required: false
        schema:
          type: string
        example: example-next_page_token
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/TenantGroupsResponse'
              examples:
                GetTenantGroupsByMsspId200Example:
                  summary: Default getTenantGroupsByMsspId 200 response
                  x-microcks-default: true
                  value:
                    value:
                    - id: 7f4e6576-9ea5-4354-a200-3c1205d09a9e
                      groupName: Branch Gateway 90
                      tenants:
                      - externalTenantId: '849955'
                        prismaId: '788442'
                      createdAt: 183
                      createdBy: example-createdBy
                    nextPageToken: example-nextPageToken
        '404':
          description: The MSSP does not exist
          content:
