    TenantGroupResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 7f4e6576-9ea5-4354-a200-3c1205d09a9e
        groupName:
          type: string
          example: Branch Gateway 90
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantIds'
          example:
          - externalTenantId: '849955'
            prismaId: '788442'
        createdAt:
          type: integer
          format: int64
          example: 183
        createdBy:
          type: string
          example: example-createdBy
  securitySchemes:
    oauth2Bearer:
