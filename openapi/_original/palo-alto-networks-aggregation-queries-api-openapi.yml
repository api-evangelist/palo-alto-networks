components:
  schemas:
    AggregationQuery:
      type: object
      required:
      - tsg_id
      properties:
        tsg_id:
          type: string
          description: Tenant Service Group ID to scope the query. Data from all descendant TSGs within this scope is included.
          example: '895182'
        filter:
          type: object
          description: Key-value filter conditions to apply to the query. Filter keys are data-type specific (e.g., severity, category, app_name).
          additionalProperties:
            type: string
          example: {}
        time_range:
          type: object
          description: Time range for the query.
          properties:
            start:
              type: string
              format: date-time
              description: Query start time (ISO 8601).
              example: '2026-07-01T15:56:30Z'
            end:
              type: string
              format: date-time
              description: Query end time (ISO 8601). Defaults to current time.
              example: '2025-05-05T00:21:55Z'
            last:
              type: string
              description: Relative time range shorthand (e.g., 1h, 24h, 7d, 30d). Mutually exclusive with start/end.
              example: example-last
          example:
            start: '2025-05-13T00:30:44Z'
            end: '2025-04-10T14:11:52Z'
            last: example-last
        count:
          type: integer
          description: Maximum number of result rows to return.
          default: 100
          maximum: 1000
          example: 100
        histogram:
          type: object
          description: Configuration for time-series histogram output. When specified, results are bucketed by time.
          properties:
            field:
              type: string
              description: Timestamp field to use for bucketing.
              example: example-field
            interval:
              type: string
              enum:
              - 1m
              - 5m
              - 15m
              - 1h
              - 6h
              - 1d
              description: Time bucket interval.
              example: 1d
          example:
            field: example-field
            interval: 1d
        group_by:
          type: array
          description: Dimension fields to group results by. Supported values are data-type specific.
          items:
            type: string
          example:
          - example-group_by_item
          - example-group_by_item
        sort:
          type: array
          description: Sort order for results.
          items:
            type: object
            properties:
              field:
                type: string
                description: Field name to sort by.
                example: example-field
              order:
                type: string
                enum:
                - asc
                - desc
                default: desc
                example: desc
          example:
          - field: example-field
            order: desc
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error code identifying the error type.
          example: example-error
        message:
          type: string
          description: Human-readable description of the error.
          example: Endpoint blocked traffic applied blocked on threat.
        request_id:
          type: string
          description: Request identifier for support correlation.
          example: 34be728a-625b-4e23-9e3a-12d7366cb00d
    AggregationResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total number of matching records before count limit.
          example: 137
        count:
          type: integer
          description: Number of records returned.
          example: 29
        time_range:
          type: object
          properties:
            start:
              type: string
              format: date-time
              example: '2024-10-13T22:10:28Z'
            end:
              type: string
              format: date-time
              example: '2026-11-26T17:22:41Z'
          example:
            start: '2024-05-26T23:18:49Z'
            end: '2024-01-19T02:12:28Z'
        data:
          type: array
          description: Array of result objects. Schema varies by query type and group_by dimensions.
          items:
            type: object
            additionalProperties: true
          example:
          - {}
          - {}
        histogram:
          type: array
          description: Time-series histogram buckets when histogram configuration was specified in the query.
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
                example: '2025-02-16T13:06:32Z'
              count:
                type: integer
                example: 432
              values:
                type: object
                additionalProperties: true
                example: {}
          example:
          - timestamp: '2025-05-11T15:41:12Z'
            count: 793
            values: {}
          - timestamp: '2024-09-14T11:54:08Z'
            count: 283
            values: {}
  securitySchemes:
    oauth2Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 Bearer token for SASE platform authentication. Obtain using the client_credentials grant with your SASE service account client ID and client secret.
