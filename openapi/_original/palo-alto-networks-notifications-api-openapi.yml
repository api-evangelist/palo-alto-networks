openapi: 3.2.0
info:
  title: Palo Alto Networks AIOps for NGFW BPA 5G Deregistered Trend Notifications API
  description: AIOps for NGFW Best Practice Assessment (BPA) API. Provides programmatic access to submit BPA requests for Palo Alto Networks next-generation firewalls, check request processing status, and retrieve completed assessment reports. BPA reports analyze firewall configurations against Palo Alto Networks best practices and security benchmarks, identifying gaps and providing remediation guidance to improve security posture. Part of the Strata Cloud Manager platform.
  version: '1.0'
  contact:
    name: Palo Alto Networks Developer Support
    url: https://pan.dev/
  license:
    name: Proprietary
    url: https://www.paloaltonetworks.com/legal
servers:
- url: https://api.stratacloud.paloaltonetworks.com/aiops/bpa/v1
  description: AIOps for NGFW BPA API production server.
security:
- oauth2Bearer: []
tags:
- name: Notifications
paths:
  /api/cloud/2.0/agg/notifications/list:
    post:
      tags:
      - Notifications
      summary: Palo Alto Networks List Notifications
      description: "### Overview\n\nList notifications for all child tenants for the current tenant.\n\nThe current tenant TSG ID is extracted from user JWT.\n\nThis is a per-user query.\n\n<u><b>API Body parameters:</b></u>\n\n- filters:\n    - readState - valid values are READ, UNREAD\n    - notifType - UPGRADES, ANNOUNCEMENTS\n    - By default, if no filters are provided then readState is READ and UNREAD and `notifType` is all the values\n- sortByList:\n    - field - valid values are createdTime or impactedTenantCount\n    - sortBy - value values are DESC or ASC"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifListApiReqBody'
            examples:
              All Notifications:
                value:
                  filters:
                  - field: readState
                    values:
                    - READ
                    - UNREAD
                  - field: notifType
                    values:
                    - UPGRADES
                    - ANNOUNCEMENTS
                  sortByList:
                  - field: createdTime
                    sortBy: DESC
              Unread Upgrades:
                value:
                  filters:
                  - field: readState
                    values:
                    - UNREAD
                  - field: notifType
                    values:
                    - UPGRADES
                  sortByList:
                  - field: createdTime
                    sortBy: DESC
              Unread Announcements:
                value:
                  filters:
                  - field: readState
                    values:
                    - UNREAD
                  - field: notifType
                    values:
                    - ANNOUNCEMENTS
                  sortByList:
                  - field: createdTime
                    sortBy: DESC
              Notifications list with Pagination:
                value:
                  filters:
                  - field: readState
                    values:
                    - UNREAD
                  - field: notifType
                    values:
                    - ANNOUNCEMENTS
                  sortByList:
                  - field: createdTime
                    sortBy: DESC
                  page:
                  - num: 0
                    size: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MtNotificationList'
              examples:
                example-0:
                  summary: All Notifications
                  value:
                    data:
                      notificationCounts:
                        readCount: 1
                        unreadCount: 0
                      notificationList:
                      - action: 'Action: Multi-Tenant UPGRADES Notification of Dataplane: Completed for 1091039496'
                        aggKey:
                          category: Dataplane
                          inAppFlag: true
                          notifType: UPGRADES
                          subCategory: Completed
                          tsgId: '1091039496'
                        body: 'Body: Multi-Tenant UPGRADES Notification of Dataplane: Completed for 1091039496'
                        id: e8ebd16c-66ab-4113-aa1e-ab274c46322a
                        name: 'Multi-Tenant UPGRADES Notification of Dataplane: Completed for 1091039496'
                        createdTime: 1698966600461
                        impactedTenantCount: 1
                        readState: READ
                      totalCount: 0
                    requestId: 635d3b26-913a-4451-a5de-0eda8da45040
                example-1:
                  summary: Unread Upgrades
                  value:
                    data:
                      notificationCounts:
                        readCount: 0
                        unreadCount: 0
                      notificationList: []
                      totalCount: 0
                    requestId: 8772a19b-fd60-4640-87b3-2b5e81645b58
                example-2:
                  summary: Unread Announcements
                  value:
                    data:
                      notificationCounts:
                        readCount: 0
                        unreadCount: 0
                      notificationList: []
                      totalCount: 0
                    requestId: 04099fe9-5f9a-4d53-a542-1388931c3a13
                example-3:
                  summary: Notification list with Pagination
                  value:
                    data:
                      notificationCounts:
                        readCount: 0
                        unreadCount: 10
                      notificationList:
                      - action: 'Action: Multi-Tenant UPGRADES Notification of Dataplane: Upcoming for 1091039496'
                        aggKey:
                          category: Dataplane
                          inAppFlag: true
                          notifType: UPGRADES
