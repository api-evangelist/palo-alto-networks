  /uve/api/v1/remediation/vuln-create-remediation:
    post:
      summary: Create Remediation Request
      tags:
      - Vulnerabilities Dashboard
      operationId: create-Remediation-Request
      description: "You create one of the following remediation action request for an asset or a set of assets:\n - Create a task or JIRA ticket \n - Create a merge request \n - Suppress the vulnerability \n\n Remediation action request can be created at the following levels:\n- **Asset level**- Perform remediation action on an asset by asset ID\n - **Group level**- Perform remediation action for all the assets of a particular asset type for a specified CVE ID \n - **Global level**- Perform remediation action on all assets of a specified CVE ID. \n\n>**Note:** You need 'vulnerabilityRemediation' feature with 'Create' permission to access this endpoint. Verify if your permission group includes this feature using the [Get Permission Group by ID](https://pan.dev/prisma-cloud/api/cspm/get-1/) endpoint. You can also check this in the Prisma Cloud console by ensuring that **Alerts > Remediate Vulnerabilities** is enabled."
      parameters:
      - name: template-id
        in: header
        description: JIRA ID. Required only for **createTask** remediation action.
        schema:
          type: string
      - name: assignee
        in: header
        description: JIRA assignee. Required only for **createTask** remediation action.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationItem'
            examples:
              assetLevel:
                value:
                  cveId: CVE-2022-0529
                  prismaId: '1115545679050296320'
                  source: COMPUTE
                  remediationAction: createPr
                  assetDetails:
                  - assetType: package
                    assetId: 31ad4d5160bec151ed7c6bf372442df7
                  - assetType: package
                    assetId: d5160bec151ed7c6bf372442df7
              groupLevel:
                value:
                  cveId: CVE-2022-0529
                  prismaId: '1115545679050296320'
                  source: BRIDGECREW
                  remediationAction: suppress
                  assetType: package
              globalLevel:
                value:
                  cveId: CVE-2022-0529
                  prismaId: '1115545679050296320'
                  remediationAction: createTask
      responses:
