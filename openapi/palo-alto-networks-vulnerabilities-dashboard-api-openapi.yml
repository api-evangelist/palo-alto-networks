                    description: Response message
                  details:
                    type: string
                    example: ''
                    description: Error details if applicable
                  timeStamp:
                    type: integer
                    example: 1701778720128
                    description: Timestamp of resppnse
                  request_id:
                    type: string
                    example: b17d66dd-2f8c-46f0-be1a-b3e21ba7990c
