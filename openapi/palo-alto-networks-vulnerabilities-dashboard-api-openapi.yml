- url: https://api.ind.prismacloud.io
- url: https://api.jp.prismacloud.io
- url: https://api.fr.prismacloud.io
tags:
- name: Vulnerabilities Dashboard
paths:
  /trace/api/v1/asset:
    post:
      tags:
      - Vulnerabilities Dashboard
      summary: Get C2C Trace Asset Graph
      description: 'Returns the relation between the assets from code to cloud stages

        >**Note:** You need `vulnerabilityDashboard` feature with `View` permission to access this endpoint. Verify if your permission group includes this feature using the [Get Permission Group by ID](https://pan.dev/prisma-cloud/api/cspm/get-1/) endpoint. You can also check this in the Prisma Cloud console by ensuring that **Dashboard > Vulnerability** is enabled.'
      operationId: c2c-trace-api
      parameters:
      - name: x-redlock-auth
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CBDRAssetTraceRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetTraceGraphView'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: User doesn't have required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - x-redlock-auth: []
      x-public: 'true'
  /uve/api/v1/dashboard/vulnerabilities/cve-overview:
    get:
      tags:
      - Vulnerabilities Dashboard
      summary: Get Cve Overview
      description: "Get the overview of the CVE with its CVSS score, the impacted stages, severity, risk factors, the package name, and the distributions affected by this CVE. \n:::info\n **Replacement Endpoint: [Get CVE Overview - POST](/prisma-cloud/api/cspm/cve-overview-v-3/)**\n:::\n\n"
      operationId: cve-overview
      parameters:
      - name: cve_id
        in: query
        description: CVE ID
        required: true
        example: CVE-2021-44288
        schema:
          type: string
      - name: asset_type
        in: query
        description: Asset Type
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - package
            - iac
            - deployedImage
            - vmImage
            - registryImage
            - host
            - serverlessFunction
      - name: life_cycle
        in: query
        description: Life Cycle
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - code
            - build
            - deploy
            - run
      - name: severities
        in: query
        description: Severities
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - critical
            - medium
            - high
            - low
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CveOverview'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: User doesn't have required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - x-redlock-auth: []
      deprecated: true
      x-public: 'true'
