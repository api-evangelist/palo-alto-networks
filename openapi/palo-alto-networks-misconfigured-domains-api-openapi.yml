              schema:
                $ref: '#/components/schemas/error'
          description: Error
      summary: Update a misconfigured domain
      tags:
      - Misconfigured Domains
components:
  schemas:
    error-detail:
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/error-code'
          description: Error code identifier
        details:
          description: Additional error details
          items:
            type: string
          type:
          - array
          - 'null'
        help:
          description: URL to error documentation
          type: string
        message:
          description: Human-readable error message
          type: string
      required:
      - code
      - message
      type: object
    misconfigured-domain:
      additionalProperties: false
      properties:
        created_at:
          description: Timestamp(UTC) when the domain was created
          examples:
          - '2023-01-15T10:30:00Z'
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        description:
          description: Description of misconfiguration
          examples:
          - DNS records not properly configured
          maxLength: 256
          type: string
        domain:
          description: Domain name
          examples:
          - example.com
          maxLength: 255
          type: string
        id:
          description: Unique identifier for the misconfigured domain
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
          type: string
        last_updated_at:
          description: Timestamp(UTC) when the domain was last updated
          examples:
          - '2023-01-20T14:45:00Z'
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
      required:
      - id
      - domain
      - created_at
      - last_updated_at
      type: object
    misconfigured-domain-input:
      additionalProperties: false
      properties:
        description:
          examples:
          - Description of the misconfigured domain
          maxLength: 256
          type: string
        domain:
          examples:
          - example.com
          maxLength: 255
          type: string
      required:
      - domain
      type: object
    misconfigured-domains:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: '#/components/schemas/misconfigured-domain'
          type:
          - array
          - 'null'
        limit:
          default: 200
          description: Maximum number of items returned
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        offset:
          default: 0
          description: Number of items skipped
          format: int32
          minimum: 0
          type: integer
        total:
          description: Total number of misconfigured domain resources
          format: int32
          minimum: 0
          type: integer
      required:
      - data
      - offset
      - total
      - limit
      type: object
    error:
      additionalProperties: false
      properties:
        _errors:
          description: Array of error objects
          items:
            $ref: '#/components/schemas/error-detail'
          type:
          - array
          - 'null'
        _request_id:
          description: Request identifier for tracking
          type: string
      required:
      - _errors
      type: object
    error-code:
      oneOf:
      - enum:
        - 1001
        title: 1001 - Forbidden
        type: integer
      - enum:
        - 1002
        title: 1002 - Invalid Input
        type: integer
      - enum:
        - 1004
        title: 1004 - Invalid Output
        type: integer
      - enum:
        - 1005
        title: 1005 - Internal Server Error
        type: integer
      - enum:
        - 1006
        title: 1006 - Precondition Failed
        type: integer
      - enum:
        - 1007
        title: 1007 - Method Not Allowed
        type: integer
      - enum:
        - 1008
        title: 1008 - Not Found
        type: integer
      - enum:
        - 1009
        title: 1009 - Service Unavailable
        type: integer
      - enum:
        - 1010
        title: 1010 - Duplicate Not Allowed
        type: integer
      - enum:
        - 1011
        title: 1011 - Expired License
        type: integer
      - enum:
        - 1012
        title: 1012 - Dependency Error
        type: integer
      - enum:
        - 1013
        title: 1013 - Subnet Already Verified
        type: integer
      - enum:
        - 1014
        title: 1014 - In Grace
        type: integer
      - enum:
        - 1015
        title: 1015 - Limit Exceeded
        type: integer
      - enum:
        - 1016
        title: 1016 - Duplicate Subnet Not Allowed
        type: integer
      - enum:
        - 1017
        title: 1017 - IP Limit Exceeded
        type: integer
      - enum:
        - 1018
        title: 1018 - FQDN Limit Exceeded
        type: integer
      - enum:
        - 1019
        title: 1019 - Private Subnet
        type: integer
      - enum:
        - 1020
        title: 1020 - Mapped IPv4
        type: integer
      - enum:
        - 1021
        title: 1021 - Invalid Subnet
        type: integer
      - enum:
        - 1022
        title: 1022 - Invalid Sinkhole
        type: integer
      - enum:
        - 1023
        title: 1023 - Allowed Subnet Required
        type: integer
      - enum:
        - 1024
        title: 1024 - Cross Tenant Subnet Conflict
        type: integer
      title: error-code
      type: integer
    misconfigured-domain-item:
      additionalProperties: false
      properties:
        item:
          $ref: '#/components/schemas/misconfigured-domain'
      required:
      - item
      type: object
  securitySchemes:
    scmToken:
      bearerFormat: JWT
      description: "Advanced DNS Security Resolver APIs authenticate client requests using the \nOAuth 2.0 Client Credentials flow.  Please use the `client_id`, \n`client_secret` values associated with an IAM service account along \nwith a scope value of `tsg_id:XXXXXXXXXX`, where `XXXXXXXXXX` is the \nTenant Service Group (TSG) ID.  The resulting JWT access token should \nbe attached to all API calls as a `Bearer` token in the `Authorization` \nheader (ex. `Authorization: Bearer tokenstring`).\n"
      scheme: bearer
      type: http
