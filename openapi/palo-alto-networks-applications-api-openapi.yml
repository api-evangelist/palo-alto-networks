components:
  schemas:
    BaseApplicationWithUrls:
      description: Base Application with URLs (for URL-based application types)
      allOf:
      - $ref: '#/components/schemas/BaseApplication'
      - type: object
        properties:
          urls:
            type: array
            description: URL patterns for the application
            items:
              type: string
        required:
        - urls
    metadata:
      type: object
      properties:
        createdTime:
          type: string
          format: date-time
          description: Creation time
        lastUpdatedTime:
          type: string
          format: date-time
          description: Last update time
        createdBy:
          type: string
          description: Created by user
        lastUpdatedBy:
          type: string
          description: Updated by user
        configurationVersion:
          $ref: '#/components/schemas/MetadataConfigurationVersion'
      required:
      - createdTime
      - lastUpdatedTime
    LocalDesktopTypeInput:
      type: string
      description: Discriminator field, must be 'localdesktopcustom'.
      enum:
      - localdesktopcustom
    AddRemoveUrls:
      type: object
      description: Add or remove URLs from an application. The total URL count after modification cannot exceed 100.
      properties:
        add:
          type: array
          items:
            $ref: '#/components/schemas/UrlInput'
          maxItems: 100
        remove:
          type: array
          items:
            $ref: '#/components/schemas/UrlInput'
    NonWebPatchApplicationInput:
      allOf:
      - $ref: '#/components/schemas/BasePatchApplicationInput'
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/NonwebTypeInput'
          address:
            type: string
            format: string
          protocol:
            type: string
            format: string
          port:
            type: string
          routeToPrisma:
            type: boolean
        required:
        - type
    PrivateApplicationInput:
      allOf:
      - $ref: '#/components/schemas/BaseApplicationInput'
      - type: object
        properties:
          urls:
            $ref: '#/components/schemas/UrlsInput'
          type:
            $ref: '#/components/schemas/PrivateTypeInput'
          primaryUrl:
            type: string
            format: string
          routeToPrisma:
            type: boolean
          category:
            type: string
            format: string
        required:
        - primaryUrl
        - routeToPrisma
        - type
    PrivateApplication:
      description: Private Application
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseApplicationWithUrls'
      - type: object
        properties:
          primaryUrl:
            type: string
            format: string
          routeToPrisma:
            type: boolean
          type:
            type: string
            description: Discriminator field, must be 'private'.
            enum:
            - private
    ApplicationTypeInput:
      type: string
      enum:
      - custom
      - private
      - non-web
      - localdesktopcustom
    ResponseMetadata:
      type: object
      description: Response-level metadata
      properties:
        configurationVersion:
          $ref: '#/components/schemas/MetadataConfigurationVersion'
    CustomApplication:
      description: Custom Application
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseApplicationWithUrls'
      - type: object
        properties:
          type:
            type: string
            description: Discriminator field, must be 'custom'.
            enum:
            - custom
    PageInfo:
      type: object
      properties:
        hasNextPage:
          type: boolean
          description: When paginating forwards, are there more items?
        cursor:
          type:
          - string
          - 'null'
          description: When paginating forwards, the cursor to continue.
      required:
      - hasNextPage
    BaseApplicationInput:
      type: object
      properties:
        name:
          type: string
          format: string
          description: Name of the application
        description:
          type: string
          format: string
          description: Description of the application
          maxLength: 2500
        type:
          $ref: '#/components/schemas/ApplicationTypeInput'
      required:
      - name
      - urls
      - type
    BulkCreatedItem:
      type: object
      properties:
