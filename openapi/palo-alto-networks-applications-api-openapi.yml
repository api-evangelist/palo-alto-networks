tags:
- name: Applications
paths:
  /seb-api/v1/applications:
    get:
      summary: List all applications
      description: Fetches all application objects, with support for filtering and pagination.
      operationId: GetSeb-apiV1Applications
      responses:
        '200':
          description: A list of all application objects
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationItem'
                  metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: Resource Not found
        '500':
          description: Internal server error
      parameters:
      - in: query
        name: type
        schema:
          type: string
          enum:
          - custom
          - private
          - non-web
          - catalog
          - localdesktopcustom
        required: false
      - in: query
        name: name
        schema:
          type: string
        description: Optional name to search in applications
        required: false
      - in: query
        name: url
        schema:
          type: string
        description: Optional URL to search in applications
        required: false
      - name: limit
        in: query
        description: Maximum number of applications to return
        required: false
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        description: An optional opaque string that defines from where to start listing
        required: false
        schema:
          type: string
      - in: query
        name: sort
        description: The field to sort by
        required: false
        schema:
          type: string
          enum:
          - application.id
          - application.name
          - application.create_time
          - application.update_time
      - name: order
        in: query
        description: The sort order
        required: false
        schema:
          $ref: '#/components/schemas/Order'
      - name: configurationVersion
        in: query
        description: Configuration version to retrieve (draft, active, or version number)
        required: false
        schema:
          type: string
          default: draft
          pattern: ^([dD]raft|[aA]ctive|[1-9][0-9]{0,9}|0CV[0-9A-Z]{26})$
      tags:
      - Applications
      security:
      - BearerAuth: []
  /seb-api/v1/applications/{id}:
    get:
      summary: Get an application by ID
      description: Fetches a specific application object identified by its unique ID.
      operationId: GetSeb-apiV1Applicationsbyid
      responses:
        '200':
          description: An Application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationItem'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: Resource Not found
        '500':
          description: Internal server error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^0AP[0-9A-HJKMNP-TV-Z]{26}$
        description: Application ID.
      - name: configurationVersion
        in: query
        description: Configuration version to retrieve (draft, active, or version number)
        required: false
        schema:
          type: string
          default: draft
          pattern: ^([dD]raft|[aA]ctive|[1-9][0-9]{0,9}|0CV[0-9A-Z]{26})$
      tags:
      - Applications
      security:
      - BearerAuth: []
    delete:
      summary: Delete an application by ID
      description: Permanently removes a specific application identified by its ID.
      operationId: DeleteSeb-apiV1Applicationsbyid
      responses:
        '204':
          description: Deleted successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: Resource Not found
        '500':
          description: Internal server error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^0AP[0-9A-HJKMNP-TV-Z]{26}$
        description: Application ID.
      tags:
      - Applications
      security:
      - BearerAuth: []
  /seb-api/v1/applications/type/{type}:
    get:
      summary: List applications by type
      description: Fetches application objects belonging to a specific type.
      operationId: GetSeb-apiV1ApplicationsTypebytype
      responses:
        '200':
          description: A list of all application objects
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationItem'
                  metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '500':
          description: Internal server error
      parameters:
      - in: path
        name: type
        required: true
        schema:
          type: string
          enum:
          - custom
          - private
          - non-web
          - catalog
          - localdesktopcustom
      - in: query
        name: name
        schema:
          type: string
        description: Optional name to search in applications
        required: false
      - in: query
        name: url
        schema:
          type: string
        description: Optional URL to search in applications
        required: false
      - name: configurationVersion
        in: query
        description: Configuration version to retrieve (draft, active, or version number)
        required: false
        schema:
          type: string
          default: draft
          pattern: ^([dD]raft|[aA]ctive|[1-9][0-9]{0,9}|0CV[0-9A-Z]{26})$
      - name: cursor
        in: query
        description: An optional opaque string that defines from where to start listing
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of applications to return
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: sort
        description: The field to sort by
        required: false
        schema:
          type: string
          enum:
          - application.id
          - application.name
          - application.create_time
          - application.update_time
      - name: order
        in: query
        description: The sort order
        required: false
        schema:
          $ref: '#/components/schemas/Order'
      tags:
      - Applications
      security:
      - BearerAuth: []
    post:
      summary: Create an application
      description: Adds a new application of the specified type to the management console. **Uniform Resource Locator Limit:** For custom, private, and non-web applications, there is a tenant-wide limit of 15,000 URLs combined. Exceeding this limit returns a 400 Bad Request error.
      operationId: PostSeb-apiV1ApplicationsTypebytype
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the newly created resource
                required:
                - id
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '409':
          description: Conflict - resource already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
      parameters:
      - in: path
        name: type
        required: true
        schema:
          type: string
          enum:
          - custom
          - private
          - non-web
          - catalog
          - localdesktopcustom
      tags:
      - Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrReplaceAppInput'
      security:
      - BearerAuth: []
  /seb-api/v1/applications/type/{type}/{id}:
    get:
      summary: Get an application by ID by type
      description: Fetches a specific application object belonging to the specified type.
      operationId: GetSeb-apiV1ApplicationsTypeBy_typebyid
