components:
  schemas:
    ReportRequest:
      type: object
      required:
      - tsg_id
      examples:
      - tsg_id: '1615680886'
      description: Request payload for report operations
      properties:
        tsg_id:
          type: string
          minLength: 1
          examples:
          - '1615680886'
          description: Tenant Service Group ID for which to retrieve report data
  securitySchemes:
    authKey: {}
