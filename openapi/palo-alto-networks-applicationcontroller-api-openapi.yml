          type: number
          description: sample start time (Unix timestamp)
        endTime:
          type: number
          description: sample end time (Unix timestamp)
        endpointType:
          type: string
          description: 'endpoint type : muAgent, muProbe, rnAgent, rnProbe'
        tenantServiceGroup:
          type: string
          description: array of tenant service groups
        pagination:
          $ref: '#/components/schemas/Pagination'
        rowCount:
          type: number
        id:
          type: string
        samplePeriod:
          type: number
          description: sample period in seconds
        series:
          type: array
          items:
            $ref: '#/components/schemas/Score'
        seriesEntityCount:
          type: array
          items:
            $ref: '#/components/schemas/SeriesEntityCounts'
      required:
      - id
      additionalProperties: false
    ScoreSummary:
      title: ScoreSummary
      type: object
      properties:
        startTime:
          type: number
          description: sample start time (Unix timestamp)
        endTime:
          type: number
          description: sample end time (Unix timestamp)
        endpointType:
          type: string
          description: 'endpoint type : muAgent, muProbe, rnAgent, rnProbe'
        tenantServiceGroup:
          type: string
          description: array of tenant service groups
        pagination:
          $ref: '#/components/schemas/Pagination'
        rowCount:
          type: number
        id:
          type: string
        average:
          $ref: '#/components/schemas/Score'
        entityCounts:
          $ref: '#/components/schemas/EntityCounts'
        agentProperties:
          $ref: '#/components/schemas/Agent'
      required:
      - id
      additionalProperties: false
    AgentGpGateway:
      title: AgentGpGateway
      type: object
      properties:
        startTime:
          type: number
          description: GP tunnel location change time
        value:
          type: string
          description: GP tunnel location change value e.g. US West
      additionalProperties: false
    Score:
      title: Score
      type: object
      properties:
        sample:
          type: number
        endpointScore:
          type: number
          description: endpoint device score (memory, cpu, disk), 0 - 100
        wlan:
          type: number
          description: wireless network score, 0 - 100
        lan:
          type: number
          description: local network score, 0 - 100
        vpnUnderlay:
          type: number
          description: underlay score (tunnel endpoint), 0 - 100
        vpnOverlay:
          type: number
          description: overlay score (tunnel), 0 - 100
        application:
          type: number
          description: application score, 0 - 100
        internet:
          type: number
          description: internet score, 0 - 100
      additionalProperties: false
    AgentGpTunnelStatus:
      title: AgentGpTunnelStatus
      type: object
      properties:
        startTime:
          type: number
          description: GP tunnel status change time
        value:
          type: string
          description: GP tunnel status change value e.g connected, disconnected
      additionalProperties: false
    ScoreSeriesCollection:
      title: ScoreSeriesCollection
      type: object
      properties:
        startTime:
          type: number
          description: sample start time (Unix timestamp)
        endTime:
          type: number
          description: sample end time (Unix timestamp)
        endpointType:
          type: string
          description: 'endpoint type : muAgent, muProbe, rnAgent, rnProbe'
        tenantServiceGroup:
          type: string
