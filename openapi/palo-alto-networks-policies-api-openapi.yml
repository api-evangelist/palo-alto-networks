      anyOf:
      - $ref: '#/components/schemas/AttributeQuery'
      - $ref: '#/components/schemas/ConnectionQuery'
      - $ref: '#/components/schemas/FilterQuery'
      - $ref: '#/components/schemas/ComplexQuery'
      - $ref: '#/components/schemas/SecretsQuery'
