openapi: 3.2.0
info:
  title: Palo Alto Networks Compliance Analytics API
  contact:
    email: support@paloaltonetworks.com
    name: Palo Alto Networks Technical Support
    url: https://support.paloaltonetworks.com
  license:
    name: MIT
    url: https://opensource.org/license/mit
  termsOfService: https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/legal/palo-alto-networks-end-user-license-agreement-eula.pdf
  version: '1.0'
  description: 'Operations tagged Compliance Analytics across 2 of this provider''s published API definitions: palo-alto-scm-config-posture-management-compliance-framework-compliance-center-recent-v1-openapi.yaml, palo-alto-scm-config-posture-management-posture-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.strata.paloaltonetworks.com/posture/compliance-frameworks/v1
  description: Current
- url: https://api.strata.paloaltonetworks.com/posture
  description: Current
security:
- BearerAuth: []
tags:
- name: Compliance Analytics
  description: Analytics and reporting for compliance frameworks including summaries, scores, and timelines.
paths:
  /summaries:
    get:
      tags:
      - Compliance Analytics
      summary: List Framework Summaries
      description: Retrieve summary view of compliance frameworks per current revision, grouped and filtered by product type
      operationId: getCFSummary
      security:
      - BearerAuth: []
      parameters:
      - name: product
        in: query
        required: false
        schema:
          type: string
          enum:
          - sase
          - ngfw
          - all
        description: 'Filter by product type. Available values: sase, ngfw, all'
        example: sase
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CFSummaryResponse'
        '400':
          description: Bad request - invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _errors:
                - code: API_CF_E00035
                  message: Invalid query parameter
                  details:
                  - Invalid value for query parameter 'product'
                  help: https://docs.paloaltonetworks.com/compliance-center/api/errors#API_CF_E00035
                _request_id: eb18eb0c-d5b7-43f3-9e38-38464ee11e2f
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api.strata.paloaltonetworks.com/posture/compliance-frameworks/v1
      description: Current
  /overall-compliance/{id}:
    get:
      tags:
      - Compliance Analytics
      summary: Get Framework Compliance Scores
      description: Retrieve overall compliance scores for a framework across different products and categories
      operationId: getOverallCompliance
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Compliance framework ID
        example: PCF-7f1ae852-f5a4-40ed-911a-88d54ebf8876
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: object
                    description: Product-specific compliance data
                    properties:
                      all:
                        type: object
                        description: Aggregated compliance across all products
                        properties:
                          name:
                            type: string
                            example: all
                          data_available:
                            type: boolean
                            description: Whether compliance data is available for this product
                          compliance:
                            type: object
                            properties:
                              overall_score:
                                type: integer
                                description: Overall compliance score (0-100, -1 if not available)
                              industry_score:
                                type: integer
                                description: Industry compliance score (0-100, -1 if not available)
                      ngfw:
                        type: object
                        description: Next-Generation Firewall compliance data
                        properties:
                          name:
                            type: string
                            example: ngfw
                          data_available:
                            type: boolean
                            description: Whether compliance data is available for this product
                          compliance:
                            type: object
                            properties:
                              overall_score:
                                type: integer
                              industry_score:
                                type: integer
                          categories:
                            type: array
                            description: Compliance scores by category
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  description: Category name
                                  enum:
                                  - network
                                  - infra
                                  - security
                                compliance:
                                  type: object
                                  properties:
                                    overall_score:
                                      type: integer
                                    industry_score:
                                      type: integer
                      sase:
                        type: object
                        description: SASE compliance data
                        properties:
                          name:
                            type: string
                            example: sase
                          data_available:
                            type: boolean
                            description: Whether compliance data is available for this product
                          compliance:
                            type: object
                            properties:
                              overall_score:
                                type: integer
                              industry_score:
                                type: integer
                          categories:
                            type: array
                            description: Compliance scores by category
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  enum:
                                  - network
                                  - infra
                                  - security
                                compliance:
                                  type: object
                                  properties:
                                    overall_score:
                                      type: integer
                                    industry_score:
                                      type: integer
                  category:
                    type: string
                    description: Framework category (PCF or CCF)
                    enum:
                    - PCF
                    - CCF
              example:
                products:
                  all:
                    name: all
                    data_available: true
                    compliance:
                      overall_score: 83
                      industry_score: 87
                  ngfw:
                    name: ngfw
                    data_available: true
                    compliance:
                      overall_score: 83
                      industry_score: 87
                    categories:
                    - name: network
                      compliance:
                        overall_score: 62
                        industry_score: 87
                    - name: infra
                      compliance:
                        overall_score: 66
                        industry_score: 87
                    - name: security
                      compliance:
                        overall_score: 87
                        industry_score: 87
                  sase:
                    name: sase
                    data_available: false
                    compliance:
                      overall_score: -1
                      industry_score: -1
                    categories:
                    - name: network
                      compliance:
                        overall_score: -1
                        industry_score: -1
                    - name: infra
                      compliance:
                        overall_score: -1
                        industry_score: -1
                    - name: security
                      compliance:
                        overall_score: -1
                        industry_score: -1
                category: PCF
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api.strata.paloaltonetworks.com/posture/compliance-frameworks/v1
      description: Current
