  /compliance-controls/{id}:
    get:
      tags:
      - Compliance Analytics
      summary: Get Compliance Controls
      description: Retrieve compliance controls for a framework
      operationId: getComplianceControls
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Compliance framework ID
      - name: product
        in: query
        required: false
        schema:
          type: string
          enum:
          - sase
          - ngfw
          - all
        description: Product filter
        example: sase
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  empty:
                    type: boolean
                    description: Whether the response is empty
                  compliance_framework_metadata:
                    type: object
                    description: Framework metadata
                    properties:
                      id:
                        type: string
                        description: Compliance framework ID
                      name:
                        type: string
                        description: Compliance framework name
                      assessment_date:
                        type: string
                        format: date
                        description: Assessment date (YYYY-MM-DD)
                      framework_version:
                        type: string
                        description: Framework version
                  compliance_framework_control_groups:
                    type: array
                    description: Array of compliance control groups with statistics
                    items:
                      type: object
                      properties:
                        control_name:
                          type: string
                          description: Control name and identifier
                        data_available:
                          type: boolean
                          description: Whether data is available for this control
                        all:
                          type: object
                          description: Aggregated statistics across all products
                          properties:
                            most_severe:
                              type: object
                              description: Most severe finding category
                              properties:
                                category:
                                  type: integer
                                  description: Severity category (1-5)
                                category_name:
                                  type: string
                                  description: Human-readable severity category name (1=Informational, 3=Warning, 5=Critical)
                                  enum:
                                  - Informational
                                  - Warning
                                  - Critical
                                count:
                                  type: integer
                                  description: Count of findings in this category
                            failed:
                              type: integer
                              description: Number of failed checks
                            passed:
                              type: integer
                              description: Number of passed checks
                            overall_score:
                              type: number
                              format: float
                              description: Compliance percentage (0-100, -1 if not available)
                        group_stats:
                          type: object
                          description: Group-specific statistics
                          additionalProperties: true
              example:
                empty: false
                compliance_framework_metadata:
                  id: PCF-820bfe1c-0817-44e8-bf4f-375edf31a7e0
                  name: NIST 800-53 r5
                  assessment_date: '2026-03-21'
                  framework_version: NIST 800-53 r5
                compliance_framework_control_groups:
                - control_name: 'AC-1 : Policy and Procedures'
                  data_available: true
                  all:
                    most_severe:
                      category: 1
                      category_name: Informational
                      count: 0
                    failed: 0
                    passed: 22
                    overall_score: 100.0
                  group_stats: {}
                - control_name: 'AC-2 : Account Management'
                  data_available: true
                  all:
                    most_severe:
                      category: 5
                      category_name: Critical
                      count: 6
                    failed: 9
                    passed: 40
                    overall_score: 81.0
                  group_stats: {}
                - control_name: 'AC-3 : Access Enforcement'
                  data_available: true
                  all:
                    most_severe:
                      category: 5
                      category_name: Critical
                      count: 7
                    failed: 10
                    passed: 15
                    overall_score: 60.0
                  group_stats: {}
                - control_name: 'AC-4 : Information Flow Enforcement'
                  data_available: true
                  all:
                    most_severe:
                      category: 3
                      category_name: Warning
                      count: 6
                    failed: 11
                    passed: 45
                    overall_score: 80.0
                  group_stats: {}
                - control_name: 'AC-7 : Unsuccessful Logon Attempts'
                  data_available: true
                  all:
                    most_severe:
                      category: 1
                      category_name: Informational
                      count: 1
                    failed: 1
                    passed: 0
                    overall_score: 0.0
                  group_stats: {}
                - control_name: 'IA : Identification and Authentication'
                  data_available: true
                  all:
                    most_severe:
                      category: 3
                      category_name: Warning
                      count: 3
                    failed: 4
                    passed: 0
                    overall_score: 0.0
                  group_stats: {}
                - control_name: 'IR : Incident Response'
                  data_available: true
                  all:
                    most_severe:
                      category: 1
                      category_name: Informational
                      count: 0
                    failed: 0
                    passed: 7
                    overall_score: 100.0
                  group_stats: {}
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
