  /services/get_services:
    post:
      operationId: getServices
      summary: Palo Alto Networks Get Exposed Services
      description: Returns a list of internet-exposed network services discovered by Xpanse. Services represent open ports and protocols observed on internet-facing assets. Supports filtering by service type, port, protocol, country, and associated asset.
      tags:
      - Services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_data:
                  type: object
                  properties:
                    filters:
                      type: array
                      items:
                        $ref: '#/components/schemas/Filter'
                    search_from:
                      type: integer
                      default: 0
                    search_to:
                      type: integer
                      default: 100
                    sort:
                      $ref: '#/components/schemas/SortOrder'
            examples:
              GetServicesRequestExample:
                summary: Default getServices request
                x-microcks-default: true
                value:
                  request_data:
                    filters:
                    - field: example-field
                      operator: contains
                      value: example-value
                    - field: example-field
                      operator: contains
                      value: example-value
                    search_from: 0
                    search_to: 100
                    sort:
                      field: example-field
                      keyword: asc
      responses:
        '200':
          description: Exposed services returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: object
                    properties:
                      total_count:
                        type: integer
                      result_count:
                        type: integer
                      services:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExposedService'
              examples:
                GetServices200Example:
                  summary: Default getServices 200 response
                  x-microcks-default: true
                  value:
                    reply:
                      total_count: 543
                      result_count: 703
                      services:
                      - service_id: '336506'
                        service_name: Corporate Agent 50
                        service_type: NETWORKING
                        ip_address:
                        - 10.239.5.194
                        domain:
                        - example-domain_item
                        - example-domain_item
                        port: 278
                        protocol: TCP
                        provider:
                        - example-provider_item
                        business_units:
                        - example-business_units_item
                        - example-business_units_item
                        created: 966
                        last_observed: 356
                        is_active: Unconfirmed
                        discovery_type: DirectlyDiscovered
                      - service_id: '336506'
                        service_name: Corporate Agent 50
                        service_type: NETWORKING
                        ip_address:
                        - 10.239.5.194
                        domain:
                        - example-domain_item
                        - example-domain_item
                        port: 278
                        protocol: TCP
                        provider:
                        - example-provider_item
                        business_units:
                        - example-business_units_item
                        - example-business_units_item
                        created: 966
                        last_observed: 356
                        is_active: Unconfirmed
                        discovery_type: DirectlyDiscovered
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - xpanseAuth: []
