openapi: 3.2.0
info:
  version: 2.0.0
  title: Configuration Setup Subscribed Tenants API
  description: These APIs are used to define how Strata Cloud Manager configurations are implemented.
  termsOfService: https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/legal/palo-alto-networks-end-user-license-agreement-eula.pdf
  contact:
    email: support@paloaltonetworks.com
    name: Palo Alto Networks Technical Support
    url: https://support.paloaltonetworks.com
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
- url: https://api.strata.paloaltonetworks.com/config/setup/v1
  description: Current
security:
- scmToken: []
tags:
- name: Subscribed Tenants
  description: Subscribed Tenants information
paths:
  /subscribed-tenants/{id}:
    get:
      summary: Get Subscribed Tenants
      description: 'Retrieve a list of subscribed tenants.

        '
      tags:
      - Subscribed Tenants
      operationId: ListSubscribedTenantsByID
      parameters:
      - $ref: '#/components/parameters/uuid'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/snippet_share_info'
          description: OK
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        default:
          $ref: '#/components/responses/default_errors'
  /subscribed-tenants:
    post:
      summary: Create Subscribed Tenant
      description: 'Create Subscribed Tenant.

        '
      tags:
      - Subscribed Tenants
      operationId: CreateSubscribedTenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/add_subscriber_request_payload'
        description: The `Subscribed Tenant` resource definition
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tenant_trust_info'
          description: OK
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
    put:
      summary: Update a subscribed tenant
      description: 'Update an existing subscribed tenant.

        '
      tags:
      - Subscribed Tenants
      operationId: UpdateSubscribedTenantBySnippetID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subscriber_property_payload'
        description: The `subscribed tenant` resource definition.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscriber_property_payload'
          description: OK
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
    delete:
      summary: Delete a subscribed tenant
      description: 'Delete an existing subscribed tenant.

        '
      tags:
      - Subscribed Tenants
      operationId: DeleteSubscribedTenantBySnippedID
      parameters:
      - $ref: '#/components/parameters/snippet-id'
      - $ref: '#/components/parameters/recipient-tsgs'
      responses:
        '200':
          $ref: '#/components/responses/http_ok'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
components:
  examples:
    json_401_panui_auth_key_expired:
      summary: Key Expired
      value:
        _errors:
        - code: E016
          message: Key Expired
          details: {}
        _request_id: abcd-1234
    json_501_panui_restapi_method_not_supported:
      summary: Method Not Supported
      value:
        _errors:
        - code: E012
          message: Method Not Supported
          details: {}
        _request_id: abcd-1234
    json_400_panui_restapi_input_format_mismatch:
      summary: Input Format Mismatch
      value:
        _errors:
        - code: E003
          message: 'Input Format Mismatch: input-format=json'
          details: {}
        _request_id: abcd-1234
    json_501_panui_restapi_version_not_supported:
      summary: Version Not Supported
      value:
        _errors:
        - code: E012
          message: Version Not Supported
          details: {}
        _request_id: abcd-1234
    json_409_panui_mgmt_name_not_unique:
      summary: Name Not Unique
      value:
        _errors:
        - code: E006
          message: Name Not Unique
          details: {}
        _request_id: abcd-1234
    json_409_panui_mgmt_object_not_unique:
      summary: Object Not Unique
      value:
