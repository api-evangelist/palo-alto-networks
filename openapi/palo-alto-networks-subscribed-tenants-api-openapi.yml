    json_400_panui_mgmt_bad_xpath:
      summary: Bad XPath
      value:
        _errors:
        - code: E013
          message: Bad XPath
          details: {}
        _request_id: abcd-1234
  parameters:
    snippet-id:
      name: snippet-id
      in: query
      required: true
      schema:
        type: string
      description: 'The ID of the snippet

        '
    uuid:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: The UUID of the resource
    recipient-tsgs:
      name: tsgs
      in: query
      required: true
      schema:
        type: string
      description: 'Comma-separated list of recipient TSG IDs

        '
  responses:
    http_ok:
      description: OK
    not_found:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_present:
              $ref: '#/components/examples/json_404_panui_mgmt_object_not_present'
    default_errors:
      description: General Errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            version_not_supported:
              $ref: '#/components/examples/json_501_panui_restapi_version_not_supported'
            method_not_allowed:
              $ref: '#/components/examples/json_501_panui_restapi_method_not_supported'
            action_not_supported:
              $ref: '#/components/examples/json_405_panui_restapi_action_not_supported'
            bad_xpath:
              $ref: '#/components/examples/json_400_panui_mgmt_bad_xpath'
            invalid_command:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_command'
            malformed_command:
              $ref: '#/components/examples/json_400_panui_mgmt_malformed_command'
            session_timeout:
              $ref: '#/components/examples/json_504_panui_mgmt_session_timeout'
    bad_request_errors_basic_with_body:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            output_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_output_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
            missing_body:
              $ref: '#/components/examples/json_400_panui_restapi_missing_body'
            invalid_object:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_object'
    bad_request_errors_basic:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            output_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_output_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
    auth_errors:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_not_authenticated:
              $ref: '#/components/examples/json_401_panui_auth_not_authenticated'
            invalid_credential:
              $ref: '#/components/examples/json_401_panui_auth_invalid_credential'
            key_too_long:
              $ref: '#/components/examples/json_401_panui_auth_key_too_long'
            key_expired:
              $ref: '#/components/examples/json_401_panui_auth_key_expired'
            need_password_change:
              $ref: '#/components/examples/json_401_panui_auth_need_password_change'
    conflict_errors:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_object_not_unique'
            name_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_name_not_unique'
            reference_not_zero:
              $ref: '#/components/examples/json_409_panui_mgmt_reference_not_zero'
    access_errors:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_unauthorized:
              $ref: '#/components/examples/json_403_panui_auth_unauthorized'
  schemas:
    generic_error:
      type: object
      properties:
        _errors:
          $ref: '#/components/schemas/error_detail_cause_infos'
        _request_id:
          type: string
    snippet_share_info:
      type: object
      properties:
        id:
          type: integer
          format: uint
          readOnly: true
        donor_tsg:
          type: string
          readOnly: true
        recipient_tsg:
          type: string
          readOnly: true
        recipient_paused_update:
          type: boolean
          readOnly: true
        recipient_validate_before_update:
          type: boolean
          readOnly: true
        snippet_uuid:
          type: string
          readOnly: true
        snippet_name:
          type: string
          readOnly: true
        donor_snippet_version:
          type: integer
          readOnly: true
        donor_snippet_file_id:
          type: integer
          readOnly: true
        donor_created:
          type: integer
          readOnly: true
        recipient_snippet_version:
          type: integer
          readOnly: true
        recipient_snippet_file_id:
          type: integer
          readOnly: true
        msg_uuid:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        error:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        last_updated:
          type: string
          format: date-time
          readOnly: true
        donor_tenant_id:
          type: string
          readOnly: true
        donor_tenant_name:
          type: string
          readOnly: true
        recipient_tenant_id:
          type: string
          readOnly: true
        recipient_tenant_name:
          type: string
          readOnly: true
        properties:
          type: array
          items:
            $ref: '#/components/schemas/snippet_share_property'
    error_detail_cause_info:
      title: Cause Info
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          oneOf:
          - type: string
          - type: object
        help:
          type: string
    subscriber_property_payload:
      type: object
      required:
      - tsg_id
      - snippet_id
      - snippet_name
      properties:
        tsg_id:
          type: string
        snippet_id:
          type: string
        snippet_name:
          type: string
        property:
          type: array
          items:
            $ref: '#/components/schemas/property_item'
    snippet_share_property:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        donor_tsg:
          type: string
          readOnly: true
        donor_tenant:
          type: string
          readOnly: true
        recipient_tsg:
          type: string
          readOnly: true
        recipient_tenant:
          type: string
          readOnly: true
        snippet_uuid:
          type: string
          readOnly: true
        snippet_name:
          type: string
          readOnly: true
        property_name:
          type: string
          readOnly: true
        property_value:
          type: string
          readOnly: true
        msg_uuid:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        error:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          readOnly: true
    error_detail_cause_infos:
      type: array
      items:
        $ref: '#/components/schemas/error_detail_cause_info'
    add_subscriber_request_payload:
      type: array
      items:
        type: object
        required:
        - tsg_id
        - snippet_id
        - snippet_name
        properties:
          tsg_id:
            type: string
          snippet_id:
            type: string
          snippet_name:
            type: string
    property_item:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        value:
          type: string
    tenant_trust_info:
      type: object
      properties:
        trust_id:
          type: integer
        donor_trust_info_id:
          type: integer
          readOnly: true
        donor_tsg:
          type: string
          readOnly: true
        donor_tenant_id:
          type: string
        donor_tenant_name:
          type: string
        donor_cluster:
          type: string
          readOnly: true
        donor_region:
          type: string
          readOnly: true
        donor_project:
          type: string
          readOnly: true
        recipient_trust_info_id:
          type: integer
          readOnly: true
        recipient_tsg:
          type: string
          readOnly: true
        recipient_tenant_id:
          type: string
          readOnly: true
        recipient_tenant_name:
          type: string
        recipient_cluster:
          type: string
          readOnly: true
        recipient_region:
          type: string
          readOnly: true
        recipient_project:
          type: string
          readOnly: true
        psk:
          type: string
        donor_msg_uuid:
          type: string
          readOnly: true
        recipient_msg_uuid:
          type: string
          readOnly: true
        current_status:
          type: string
          readOnly: true
        error_details:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
        last_updated:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          readOnly: true
  securitySchemes:
    scmOAuth:
      type: oauth2
      description: "Strata Cloud Manager APIs authenticate client requests using the \nOAuth 2.0 Client Credentials flow.  Please use the `client_id`, \n`client_secret` values associated with an IAM service account along \nwith a scope value of `tsg_id:XXXXXXXXXX`, where `XXXXXXXXXX` is the \nTenant Service Group (TSG) ID.  The resulting JWT access token should \nbe attached to all API calls as a `Bearer` token in the `Authorization` \nheader (ex. `Authorization: Bearer tokenstring`).\n"
      flows:
        clientCredentials:
          tokenUrl: https://auth.apps.paloaltonetworks.com/oauth2/access_token
          scopes: {}
    scmToken:
      type: http
      description: "Strata Cloud Manager APIs authenticate client requests using the \nOAuth 2.0 Client Credentials flow.  Please use the `client_id`, \n`client_secret` values associated with an IAM service account along \nwith a scope value of `tsg_id:XXXXXXXXXX`, where `XXXXXXXXXX` is the \nTenant Service Group (TSG) ID.  The resulting JWT access token should \nbe attached to all API calls as a `Bearer` token in the `Authorization` \nheader (ex. `Authorization: Bearer tokenstring`).\n"
      scheme: bearer
      bearerFormat: JWT
x-internal: false
