components:
  schemas:
    BrowserDeployment:
      type: object
      properties:
        deployment_id:
          type: string
          description: Unique identifier of the deployment.
          example: '965512'
        name:
          type: string
          description: Display name of the deployment.
          example: Production Sensor 18
        description:
          type: string
          description: Description of the deployment configuration.
          example: Violation investigation threat violation traffic monitoring monitoring monitoring firewall.
        platform:
          type: string
          enum:
          - windows
          - macos
          - linux
          - chromeos
          description: Target operating system platform.
          example: chromeos
        policy_id:
          type: string
          description: Default browser policy assigned to users in this deployment.
          example: '698917'
        update_channel:
          type: string
          enum:
          - stable
          - beta
          description: Browser update channel for this deployment.
          example: beta
        device_count:
          type: integer
          description: Number of devices in this deployment.
          example: 536
        created_at:
          type: string
          format: date-time
          example: '2024-07-02T16:41:58Z'
    BrowserDeploymentRequest:
      type: object
      required:
      - name
      - platform
      properties:
        name:
          type: string
          description: Display name for the deployment.
          example: Primary Agent 98
        description:
          type: string
          example: Detected configured violation policy malware network suspicious policy.
        platform:
          type: string
          enum:
          - windows
          - macos
          - linux
          - chromeos
          description: Target operating system platform.
          example: linux
        policy_id:
          type: string
          description: Default browser policy ID for this deployment.
          example: '600872'
        update_channel:
          type: string
          enum:
          - stable
          - beta
          default: stable
          example: stable
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error code identifying the error type.
          example: example-error
        message:
          type: string
          description: Human-readable description of the error.
          example: Suspicious detected incident malware activity traffic traffic.
        request_id:
          type: string
          description: Request identifier for support correlation.
          example: a6ecb027-74a1-4efb-9882-cb98e9bab4bf
  securitySchemes:
    oauth2Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 Bearer token for SASE platform authentication. Obtain using the client_credentials grant with your SASE service account client ID and client secret.
