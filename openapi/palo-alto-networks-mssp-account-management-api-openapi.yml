              licensePoolId: '997200'
              allocatedCredits: 456
              startDate: 589
              endDate: 255
          - licensePoolId: '791432'
            poolName: Branch Firewall 14
            serialNumber: example-serialNumber
            msspId: '652019'
            totalCredits: 749
