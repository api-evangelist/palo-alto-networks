components:
  schemas:
    ContactInfo:
      required:
      - email
      - firstName
      - lastName
      type: object
      properties:
        firstName:
          maxLength: 63
          minLength: 1
          type: string
          example: Branch Sensor 70
        lastName:
          maxLength: 63
          minLength: 1
          type: string
          example: Staging Policy 31
        email:
          maxLength: 128
          minLength: 1
          type: string
          example: analyst1@example.com
    MsspLicensePoolResponse:
      type: object
      properties:
        licensePoolId:
          type: string
          example: '791432'
        poolName:
          type: string
          example: Branch Firewall 14
        serialNumber:
          type: string
          example: example-serialNumber
        msspId:
          type: string
          example: '652019'
        totalCredits:
          type: integer
          format: int32
          example: 749
        unallocatedCredits:
          type: integer
          format: int32
          example: 827
        startDate:
          type: integer
          format: int64
          example: 649
        endDate:
          type: integer
          format: int64
          example: 939
        tenantLicenses:
          type: array
          items:
            $ref: '#/components/schemas/ManagedTenantLicenseResponse'
          example:
          - tenantLicenseId: '109663'
            serialNumber: example-serialNumber
            licensePoolId: '997200'
            allocatedCredits: 456
            startDate: 589
            endDate: 255
    TenantChangeResponse:
      type: object
      properties:
        tenantChangeId:
          type: string
          format: uuid
          example: 21506922-dae2-4e8a-879f-b738126b7a2d
        externalTenantId:
          type: string
          example: '833084'
        tenantPrismaId:
          type: string
          example: '169016'
        status:
          type: string
          enum:
          - IN_PROGRESS
          - SUCCESS
          - FAILURE
          example: SUCCESS
        updatedAt:
          type: integer
          format: int64
          example: 131
    ManagedTenantLicenseResponse:
      type: object
      properties:
        tenantLicenseId:
          type: string
          example: '109663'
        serialNumber:
          type: string
          example: example-serialNumber
        licensePoolId:
          type: string
          example: '997200'
        allocatedCredits:
          type: integer
          format: int32
          example: 456
        startDate:
          type: integer
          format: int64
          example: 589
        endDate:
          type: integer
          format: int64
          example: 255
    Error:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          example: example-code
        message:
          type: string
          example: Incident malware violation firewall endpoint investigation firewall network rule blocked activity rule.
        target:
          type: string
          example: example-target
        details:
          type: array
          items:
