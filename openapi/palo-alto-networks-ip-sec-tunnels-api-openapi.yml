  schemas:
    error_detail_cause_infos:
      type: array
      items:
        $ref: '#/components/schemas/error_detail_cause_info'
      x-examples: {}
    generic_error:
      type: object
      properties:
        _errors:
          $ref: '#/components/schemas/error_detail_cause_infos'
        _request_id:
          type: string
      x-examples: {}
    ipsec-tunnels:
      type: object
      properties:
        id:
          type: string
          description: UUID of the resource
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          description: 'Alphanumeric string begin with letter: [0-9a-zA-Z._-]'
          maxLength: 63
        tunnel_interface:
          type: string
          description: Tunnel interface variable or hardcoded tunnel. Default will be tunnels.
          default: tunnel
        auto_key:
          type: object
          properties:
            ike_gateway:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
            ipsec_crypto_profile:
              type: string
            proxy_id:
              type: array
              description: IPv4 type of proxy_id values
              items:
                type: object
                description: IPv4 type of proxy_id values for TCP protocol
                properties:
                  name:
                    type: string
                  local:
                    type: string
                  remote:
                    type: string
                  protocol:
                    type: object
                    description: IPv4 type of proxy_id protocol values for TCP protocol
                    oneOf:
                    - type: object
                      title: number
                      properties:
                        number:
                          type: integer
                          description: IP protocol number
                          minimum: 1
                          maximum: 254
                    - type: object
                      title: tcp
                      properties:
                        tcp:
                          type: object
                          description: IPv4 type of proxy_id protocol values for TCP protocol
                          properties:
                            local_port:
                              type: integer
                              minimum: 0
                              maximum: 65535
                              default: 0
                            remote_port:
                              type: integer
                              minimum: 0
                              maximum: 65535
                              default: 0
                    - type: object
                      title: udp
                      properties:
                        udp:
                          type: object
                          description: IPv6 type of proxy_id protocol values for UDP protocol
                          properties:
                            local_port:
                              type: integer
                              minimum: 0
                              maximum: 65535
                              default: 0
                            remote_port:
                              type: integer
                              minimum: 0
                              maximum: 65535
                              default: 0
                required:
                - name
            proxy_id_v6:
              type: array
              description: IPv6 type of proxy_id values
              items:
                type: object
                description: IPv6 type of proxy_id values for TCP protocol
                properties:
                  name:
                    type: string
                  local:
                    type: string
                  remote:
                    type: string
                  protocol:
                    type: object
                    description: IPv6 type of proxy_id protocol values for protocol
                    oneOf:
                    - type: object
                      title: number
                      properties:
                        number:
                          type: integer
                          description: IP protocol number
                          minimum: 1
                          maximum: 254
                    - type: object
                      title: tcp
                      properties:
                        tcp:
                          type: object
                          description: IPv6 type of proxy_id protocol values for TCP protocol
                          properties:
                            local_port:
                              type: integer
                              minimum: 0
                              maximum: 65535
                              default: 0
                            remote_port:
                              type: integer
                              minimum: 0
                              maximum: 65535
                              default: 0
                    - type: object
                      title: udp
                      properties:
                        udp:
                          type: object
                          description: IPv6 type of proxy_id protocol values for UDP protocol
                          properties:
                            local_port:
                              type: integer
                              minimum: 0
                              maximum: 65535
                              default: 0
                            remote_port:
                              type: integer
                              minimum: 0
                              maximum: 65535
                              default: 0
                required:
                - name
          required:
          - ike_gateway
          - ipsec_crypto_profile
        anti_replay:
          type: boolean
          description: Enable Anti-Replay check on this tunnel
        copy_tos:
          type: boolean
          description: Copy IP TOS bits from inner packet to IPSec packet (not recommended)
          default: false
        enable_gre_encapsulation:
          type: boolean
          description: allow GRE over IPSec
          default: false
        tunnel_monitor:
          type: object
          properties:
            enable:
              type: boolean
              description: Enable tunnel monitoring on this tunnel
              default: false
            destination_ip:
              type: string
              description: Destination IP to send ICMP probe
            proxy_id:
              type: string
              description: Which proxy-id (or proxy-id-v6) the monitoring traffic will use
          required:
          - destination_ip
      required:
      - name
      - auto_key
      oneOf:
      - type: object
        title: folder
        properties:
          folder:
            type: string
            pattern: ^[a-zA-Z\d\-_\. ]+$
            maxLength: 64
            description: The folder in which the resource is defined
            example: My Folder
        required:
        - folder
      - type: object
        title: snippet
        properties:
          snippet:
            type: string
            pattern: ^[a-zA-Z\d\-_\. ]+$
            maxLength: 64
            description: The snippet in which the resource is defined
            example: My Snippet
        required:
        - snippet
      - type: object
        title: device
        properties:
          device:
            type: string
            pattern: ^[a-zA-Z\d\-_\. ]+$
            maxLength: 64
            description: The device in which the resource is defined
            example: My Device
        required:
        - device
    error_detail_cause_info:
      type: object
      title: Cause Info
      properties:
        code:
          type: string
        message:
          type: string
        details:
          oneOf:
          - type: string
          - type: object
        help:
          type: string
    IPSecTunnel:
      type: object
      required:
      - name
      - auto_key
      properties:
        id:
          type: string
          description: Unique identifier for the IPSec tunnel.
          readOnly: true
          example: example-id
        name:
          type: string
          description: Name of the IPSec tunnel.
          example: Staging Firewall 42
        auto_key:
          type: object
          description: Auto-key IKE configuration for the tunnel.
          properties:
            ike_gateway:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Name of the IKE gateway to use.
                    example: Production Agent 99
              example:
              - name: Branch Agent 66
              - name: Primary Agent 16
            ipsec_crypto_profile:
              type: string
              description: IPSec crypto profile name.
              example: IP Camera
          example:
            ike_gateway:
            - name: Corporate Firewall 77
            ipsec_crypto_profile: HVAC Controller
        tunnel_monitor:
          type: object
          properties:
            enable:
              type: boolean
              example: false
            destination_ip:
              type: string
              format: ipv4
              example: 10.93.88.181
            proxy_id:
              type: string
              example: '109061'
          example:
            enable: false
            destination_ip: 10.26.144.251
            proxy_id: '408309'
        anti_replay:
          type: boolean
          default: true
          description: Whether anti-replay protection is enabled.
          example: true
        folder:
          type: string
          readOnly: true
          example: example-folder
    ErrorResponse:
      type: object
      properties:
        _errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: example-code
              message:
                type: string
                example: Alert malware configured threat rule network malware configured on.
              details:
                type: object
                example: {}
          example:
          - code: example-code
            message: Threat configured alert firewall violation monitoring traffic activity.
            details: {}
          - code: example-code
            message: Blocked threat Security traffic firewall monitoring malware endpoint suspicious network.
            details: {}
        _request_id:
          type: string
          example: '980164'
