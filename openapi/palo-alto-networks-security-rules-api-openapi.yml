  schemas:
    error_detail_cause_infos:
      type: array
      items:
        $ref: '#/components/schemas/error_detail_cause_info'
      x-examples: {}
    SecurityRuleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/security-rules'
        limit:
          type: integer
          default: 200
        offset:
          type: integer
          default: 0
        total:
          type: integer
    internet-rule-type:
      type: object
      description: A simplified security rule for controlling internet access.
      allOf:
      - $ref: '#/components/schemas/base-rule-properties'
      - type: object
        properties:
          negate_user:
            type: boolean
            default: false
          devices:
            type: array
            items:
              type: string
            default:
            - any
          action:
            enum:
            - allow
            - deny
            default: allow
          log_settings:
            type: object
            properties:
              log_sessions:
                type: boolean
                default: true
          security_settings:
            type: object
            properties:
              anti_spyware:
                type: string
                enum:
                - true
                - false
                default: true
              vulnerability:
                type: string
                enum:
                - true
                - false
                default: true
              virus_and_wildfire_analysis:
                type: string
                enum:
                - true
                - false
                default: true
          block_web_application:
            type: array
            items:
              type: string
          block_url_category:
            type: array
            items:
              type: string
          allow_web_application:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                file_control:
                  type: object
                  properties:
                    upload:
                      type: string
                      enum:
                      - allow-all-file-types
                      - best-practice
                      - block-all-file-types
                    download:
                      type: string
                      enum:
                      - allow-all-file-types
                      - best-practice
                      - block-all-file-types
                saas_enterprise_control:
                  type: object
                  properties:
                    consumer_access:
                      type: object
                      properties:
                        enable:
                          type: string
                          enum:
                          - true
                          - false
                    enterprise_access:
                      type: object
                      properties:
                        enable:
                          type: string
                          enum:
                          - true
                          - false
                        tenant_restrictions:
                          type: array
                          items:
                            type: string
                application_function:
                  type: array
                  items:
                    type: string
                dlp:
                  type: string
                saas_tenant_list:
                  type: array
                  items:
                    type: string
                saas_user_list:
                  type: array
                  items:
                    type: string
                tenant_control:
                  type: object
                  properties:
                    tenants:
                      type: array
                      items:
                        type: string
                    allowed_activities:
                      type: array
                      items:
                        type: string
                    blocked_activities:
                      type: array
                      items:
                        type: string
                    parent_application:
                      type: string
          allow_url_category:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                decryption:
                  type: string
                  enum:
                  - enabled
                  - disabled
                  default: enabled
                credential_enforcement:
                  type: string
                  enum:
                  - enabled
                  - disabled
                  default: enabled
                additional_action:
                  type: string
                  enum:
                  - none
                  - continue
                  - redirect
                  - isolate
                  default: none
                isolation_profiles:
                  type: string
                  default: none
                file_control:
                  type: object
                  properties:
                    upload:
                      type: string
                      enum:
                      - allow-all-file-types
                      - best-practice
                      - block-all-file-types
                    download:
                      type: string
                      enum:
                      - allow-all-file-types
                      - best-practice
                      - block-all-file-types
                dlp:
                  type: string
          default_profile_settings:
            type: object
            properties:
              file_control:
                type: object
                properties:
                  upload:
                    type: string
                    enum:
                    - allow-all-file-types
                    - best-practice
                    - block-all-file-types
                  download:
                    type: string
                    enum:
                    - allow-all-file-types
                    - best-practice
                    - block-all-file-types
              dlp:
                type: string
    rule-based-move:
      type: object
      title: rule-based-move
      properties:
        destination:
          enum:
          - top
          - bottom
          - before
          - after
          description: A destination of the rule. Valid destination values are top, bottom, before and after.
        rulebase:
          enum:
          - pre
          - post
          description: A base of a rule. Valid rulebase values are pre and post.
        destination_rule:
          type: string
          description: A destination_rule attribute is required only if the destination value is before or after. Valid destination_rule values are existing rule UUIDs within the same container.
      required:
      - destination
      - rulebase
    generic_error:
      type: object
      properties:
        _errors:
          $ref: '#/components/schemas/error_detail_cause_infos'
        _request_id:
          type: string
      x-examples: {}
    security-rule-type:
      type: object
      required:
      - from
      - to
      - source
      - source_user
      - destination
      - service
      - action
      description: A standard security rule for controlling traffic between zones.
      allOf:
      - $ref: '#/components/schemas/base-rule-properties'
      - type: object
        required:
        - category
        - application
        properties:
          negate_destination:
            type: boolean
            description: Negate the destination addresses(es)?
            default: false
          source_hip:
            type: array
            description: The source Host Integrity Profile(s)
            items:
              type: string
              default: any
          destination_hip:
            type: array
            description: The destination Host Integrity Profile(s)
            uniqueItems: true
            items:
              type: string
              default: any
          application:
            type: array
            description: The application(s) being accessed
            uniqueItems: true
            items:
              type: string
              default: any
          category:
            type: array
            description: The URL categories being accessed
            uniqueItems: true
            items:
              type: string
              default: any
          action:
            enum:
            - allow
            - deny
            - drop
            - reset-client
            - reset-server
            - reset-both
            description: The action to be taken when the rule is matched
          profile_setting:
            type: object
            description: The security profile object
            properties:
              group:
                type: array
                description: The security profile group
                items:
                  type: string
                  default: best-practice
          log_setting:
            type: string
            description: The external log forwarding profile
          log_start:
            type: boolean
            description: Log at session start?
          log_end:
            type: boolean
            description: Log at session end?
          tenant_restrictions:
            type: array
            items:
              type: string
              default: any
    error_detail_cause_info:
      type: object
      title: Cause Info
      properties:
        code:
          type: string
        message:
          type: string
        details:
          oneOf:
          - type: string
          - type: object
        help:
          type: string
    security-rules:
      type: object
      description: 'Represents a Security or Internet security rule.

        A rule must be one of the policy types AND exist in one scope (folder, snippet, or device).'
      allOf:
      - oneOf:
        - $ref: '#/components/schemas/security-rule-type'
        - $ref: '#/components/schemas/internet-rule-type'
        discriminator:
          propertyName: policy_type
          mapping:
            Security: '#/components/schemas/security-rule-type'
            Internet: '#/components/schemas/internet-rule-type'
      - oneOf:
        - type: object
          title: folder
          required:
          - folder
          properties:
            folder:
              type: string
              pattern: ^[a-zA-Z\d\-_\. ]+$
              maxLength: 64
              description: The folder in which the resource is defined
        - type: object
          title: snippet
          required:
          - snippet
          properties:
            snippet:
              type: string
              pattern: ^[a-zA-Z\d\-_\. ]+$
              maxLength: 64
              description: The snippet in which the resource is defined
        - type: object
          title: device
          required:
          - device
          properties:
            device:
              type: string
              pattern: ^[a-zA-Z\d\-_\. ]+$
              maxLength: 64
              description: The device in which the resource is defined
    base-rule-properties:
      type: object
      required:
      - name
      properties:
        id:
          type: string
          description: The UUID of the security rule
          format: uuid
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          description: The name of the security rule
        policy_type:
          type: string
          default: Security
        disabled:
          type: boolean
          description: Is the security rule disabled?
          default: false
        description:
          type: string
          description: The description of the security rule
        tag:
          type: array
          description: The tags associated with the security rule
          uniqueItems: true
          items:
            type: string
        from:
          type: array
          description: The source security zone(s)
          uniqueItems: true
          items:
            type: string
            default: any
        to:
          type: array
          description: The destination security zone(s)
          uniqueItems: true
          items:
            type: string
            default: any
        source:
          type: array
          description: The source addresses(es)
          uniqueItems: true
          items:
            type: string
            default: any
        negate_source:
          type: boolean
          description: Negate the source address(es)?
          default: false
        source_user:
          type: array
          description: List of source users and/or groups.  Reserved words include `any`, `pre-login`, `known-user`, and `unknown`.
          uniqueItems: true
          items:
            type: string
            default: any
        destination:
          type: array
          description: The destination address(es)
          uniqueItems: true
          items:
            type: string
            default: any
        service:
          type: array
          description: The service(s) being accessed
          uniqueItems: true
          items:
            type: string
            default: any
        schedule:
          type: string
          description: Schedule in which this rule will be applied
        action:
          enum:
          - allow
          - deny
          - drop
          - reset-client
          - reset-server
          - reset-both
          description: The action to be taken when the rule is matched
    SecurityRuleRequest:
      type: object
      required:
      - Priority
      - RuleEntry
      properties:
        Priority:
          type: integer
          minimum: 1
          maximum: 65535
          example: 48316
        RuleEntry:
          type: object
          required:
          - RuleName
          - Action
          properties:
            RuleName:
              type: string
              example: Primary Sensor 76
            Description:
              type: string
              example: Threat alert rule policy investigation on activity rule threat activity traffic.
            Enabled:
              type: boolean
              default: true
              example: true
            Source:
              $ref: '#/components/schemas/RuleSource'
            Destination:
              $ref: '#/components/schemas/RuleDestination'
            Applications:
              type: array
              items:
                type: string
              example:
              - ssl
              - web-browsing
            Protocol:
              type: string
              enum:
              - APPLICATION-DEFAULT
              - ANY
              example: APPLICATION-DEFAULT
            Action:
              type: string
              enum:
              - Allow
              - DenyResetBoth
              - DenyResetServer
              - DenySilent
              example: DenyResetServer
          example:
            RuleName: Primary Gateway 01
            Description: Activity Security blocked suspicious threat alert activity firewall.
            Enabled: true
            Source:
              Cidrs:
              - example-Cidrs_item
              Countries:
              - example-Countries_item
              Feeds:
              - example-Feeds_item
              - example-Feeds_item
              PrefixLists:
              - example-PrefixLists_item
              - example-PrefixLists_item
            Destination:
              Cidrs:
              - example-Cidrs_item
              - example-Cidrs_item
              Countries:
              - example-Countries_item
              - example-Countries_item
              Feeds:
              - example-Feeds_item
              FqdnLists:
              - example-FqdnLists_item
              - example-FqdnLists_item
              PrefixLists:
              - example-PrefixLists_item
            Applications:
            - ssh
            Protocol: APPLICATION-DEFAULT
            Action: DenySilent
    RuleSource:
      type: object
      description: Traffic source matching criteria for a security rule.
      properties:
        Cidrs:
          type: array
          items:
            type: string
          description: Source CIDR blocks (e.g., 10.0.0.0/8).
          example:
          - example-Cidrs_item
          - example-Cidrs_item
        Countries:
          type: array
          items:
            type: string
          description: Source country codes (ISO 3166-1 alpha-2).
          example:
          - example-Countries_item
        Feeds:
          type: array
          items:
            type: string
          description: Threat intelligence feed names.
          example:
          - example-Feeds_item
          - example-Feeds_item
        PrefixLists:
          type: array
          items:
            type: string
          description: Names of prefix lists defined in the rule stack.
          example:
          - example-PrefixLists_item
          - example-PrefixLists_item
    SecurityRule:
      type: object
      description: A security rule within a Cloud NGFW rule stack.
      properties:
        Priority:
          type: integer
          description: Rule evaluation priority (lower numbers evaluated first).
          example: 707
        RuleEntry:
          type: object
          properties:
            RuleName:
              type: string
              example: Staging Policy 40
            Description:
              type: string
              example: Threat network configured alert configured violation rule malware alert monitoring threat.
            Enabled:
              type: boolean
              default: true
              example: true
            Source:
              $ref: '#/components/schemas/RuleSource'
            NegateSource:
              type: boolean
              default: false
              example: false
            Destination:
              $ref: '#/components/schemas/RuleDestination'
            NegateDestination:
              type: boolean
              default: false
              example: false
            Applications:
              type: array
              items:
                type: string
              description: Application names to match (use any for all applications).
              example:
              - ssl
              - ssh
            Category:
              type: object
              properties:
                URLCategoryNames:
                  type: array
                  items:
                    type: string
                  example:
                  - Staging Firewall 58
                  - Primary Firewall 83
                Feeds:
                  type: array
                  items:
                    type: string
                  example:
                  - example-Feeds_item
                  - example-Feeds_item
              example:
                URLCategoryNames:
                - Production Firewall 26
                - Primary Policy 38
                Feeds:
                - example-Feeds_item
            Protocol:
              type: string
              enum:
              - APPLICATION-DEFAULT
              - TCP
              - UDP
              - ICMP
              - ANY
              example: ICMP
            Action:
              type: string
              enum:
              - Allow
              - DenyResetBoth
              - DenyResetServer
              - DenySilent
              example: Allow
            DecryptionRuleType:
