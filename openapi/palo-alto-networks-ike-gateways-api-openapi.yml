    json_401_panui_auth_need_password_change:
      summary: Need Password Change
      value:
        _errors:
        - code: E016
          message: The password needs to be changed.
          details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_501_panui_restapi_method_not_supported:
      summary: Method Not Supported
      value:
        _errors:
        - code: E012
          message: Method Not Supported
          details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_400_panui_mgmt_malformed_command:
      summary: Malformed Command
      value:
        _errors:
        - code: E003
          message: Malformed Command
          details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_409_panui_mgmt_reference_not_zero:
      summary: Reference Not Zero
      value:
        _errors:
        - code: E009
          message: Reference Not Zero
          details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_400_panui_restapi_invalid_query_parameter:
      summary: Invalid Query Parameter
      value:
        _errors:
        - code: E003
          message: 'Invalid Query Parameter: location=invalid'
          details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_501_panui_restapi_version_not_supported:
      summary: Version Not Supported
      value:
        _errors:
        - code: E012
          message: Version Not Supported
          details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_400_panui_restapi_missing_query_parameter:
      summary: Missing Query Parameter
      value:
        _errors:
        - code: E003
          message: 'Missing Query Parameter: name'
          details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_400_panui_restapi_output_format_mismatch:
      summary: Output Format Mismatch
      value:
        _errors:
        - code: E003
          message: 'Output Format Mismatch: output-format=json Accept=xml'
          details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_404_panui_mgmt_object_not_present:
      summary: Object Not Present
      value:
        _errors:
        - code: E005
          message: Object Not Present
          details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
  responses:
    access_errors:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_unauthorized:
              $ref: '#/components/examples/json_403_panui_auth_unauthorized'
    not_found:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_present:
              $ref: '#/components/examples/json_404_panui_mgmt_object_not_present'
    conflict_errors:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_object_not_unique'
            name_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_name_not_unique'
            reference_not_zero:
              $ref: '#/components/examples/json_409_panui_mgmt_reference_not_zero'
    bad_request_errors_basic:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            output_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_output_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
    default_errors:
      description: General Errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            version_not_supported:
              $ref: '#/components/examples/json_501_panui_restapi_version_not_supported'
            method_not_allowed:
              $ref: '#/components/examples/json_501_panui_restapi_method_not_supported'
            action_not_supported:
              $ref: '#/components/examples/json_405_panui_restapi_action_not_supported'
            bad_xpath:
              $ref: '#/components/examples/json_400_panui_mgmt_bad_xpath'
            invalid_command:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_command'
            malformed_command:
              $ref: '#/components/examples/json_400_panui_mgmt_malformed_command'
            session_timeout:
              $ref: '#/components/examples/json_504_panui_mgmt_session_timeout'
    auth_errors:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_not_authenticated:
              $ref: '#/components/examples/json_401_panui_auth_not_authenticated'
            invalid_credential:
              $ref: '#/components/examples/json_401_panui_auth_invalid_credential'
            key_too_long:
              $ref: '#/components/examples/json_401_panui_auth_key_too_long'
            key_expired:
              $ref: '#/components/examples/json_401_panui_auth_key_expired'
            need_password_change:
              $ref: '#/components/examples/json_401_panui_auth_need_password_change'
    bad_request_errors_basic_with_body:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            output_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_output_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
            missing_body:
              $ref: '#/components/examples/json_400_panui_restapi_missing_body'
            invalid_object:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_object'
    http_ok:
      description: OK
  schemas:
    generic_error:
      type: object
      properties:
        _errors:
          $ref: '#/components/schemas/error_detail_cause_infos'
        _request_id:
          type: string
      x-examples: {}
    error_detail_cause_infos:
      type: array
      items:
        $ref: '#/components/schemas/error_detail_cause_info'
      x-examples: {}
    error_detail_cause_info:
      type: object
      title: Cause Info
      properties:
        code:
          type: string
        message:
          type: string
        details:
          oneOf:
          - type: string
          - type: object
        help:
          type: string
    ike-gateways:
      type: object
      properties:
        id:
          type: string
          description: UUID of the resource
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          description: 'Alphanumeric string begin with letter: [0-9a-zA-Z._-]'
          maxLength: 63
        local_address:
          type: object
          x-computed-field: true
          properties:
            interface:
              type: string
              description: Interface variable or hardcoded vlan/loopback. vlan will be passed as default value
              default: vlan
            ip:
              type: string
              description: IP Prefix of the assigned interface
        authentication:
          type: object
          oneOf:
          - type: object
            title: pre_shared_key
            properties:
              pre_shared_key:
                type: object
                properties:
                  key:
                    type: string
                    format: password
          - type: object
            title: certificate
            properties:
              certificate:
                type: object
                properties:
                  allow_id_payload_mismatch:
                    type: boolean
                  certificate_profile:
                    type: string
                  local_certificate:
                    type: object
                    properties:
                      local_certificate_name:
                        type: string
                  strict_validation_revocation:
                    type: boolean
                  use_management_as_source:
                    type: boolean
        peer_id:
          type: object
          properties:
            type:
              enum:
              - ipaddr
              - keyid
              - fqdn
              - ufqdn
            id:
              type: string
              description: Peer ID string
              pattern: ^(.+\@[\*a-zA-Z0-9.-]+)$|^([\*$a-zA-Z0-9_:.-]+)$|^(([[:xdigit:]][[:xdigit:]])+)$|^([a-zA-Z0-9.]+=(\\,|[^,])+[, ]+)*([a-zA-Z0-9.]+=(\\,|[^,])+)$
              minLength: 1
              maxLength: 1024
        local_id:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
              description: Local ID string
              pattern: ^(.+\@[a-zA-Z0-9.-]+)$|^([$a-zA-Z0-9_:.-]+)$|^(([[:xdigit:]][[:xdigit:]])+)$|^([a-zA-Z0-9.]+=(\\,|[^,])+[, ]+)*([a-zA-Z0-9.]+=(\\,|[^,])+)$
              minLength: 1
              maxLength: 1024
        protocol:
          type: object
          properties:
            ikev1:
              type: object
              properties:
                ike_crypto_profile:
                  type: string
                dpd:
                  type: object
                  properties:
                    enable:
                      type: boolean
            ikev2:
              type: object
              properties:
                ike_crypto_profile:
                  type: string
                dpd:
                  type: object
                  properties:
                    enable:
                      type: boolean
                pq_ppk:
                  type: object
                  description: RFC 8784 Post-Quantum Pre-Shared Key (PPK) configuration
                  properties:
                    enabled:
                      type: boolean
                      description: Enable PPK for this IKE gateway
                    negotiation_mode:
                      type: string
                      enum:
                      - preferred
                      - mandatory
                      description: 'PPK negotiation mode:

                        - preferred: Fall back to normal IKEv2 if peer doesn''t support PPK

                        - mandatory: Abort negotiation if peer doesn''t support PPK

                        '
                    keys:
                      type: array
                      description: List of PPK keys
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            maxLength: 31
                            description: PPK key identifier
                          key:
                            type: string
                            maxLength: 128
                            description: PPK secret value (hex-encoded)
                          enabled:
                            type: boolean
                            description: Enable this PPK key
                pq_kem:
                  type: object
                  description: RFC 9370 Post-Quantum Key Encapsulation Mechanism configuration
                  properties:
                    enable:
                      type: boolean
                      description: Enable PQ-KEM for this IKE gateway
                    block_vulnerable_cipher:
                      type: boolean
                      description: Block connections that don't support PQ-KEM
            version:
              enum:
              - ikev2-preferred
              - ikev1
              - ikev2
              default: ikev2-preferred
        protocol_common:
          type: object
          x-computed-field: true
          properties:
            nat_traversal:
              type: object
              x-computed-field: true
              description: Enables NAT traversal for the IKE gateway.
              properties:
                enable:
                  type: boolean
                  default: true
            passive_mode:
              type: boolean
              default: false
            fragmentation:
              type: object
              x-computed-field: true
              properties:
                enable:
                  type: boolean
                  default: false
        peer_address:
          type: object
          oneOf:
          - type: object
            title: ip
            properties:
              ip:
                type: string
                description: peer gateway has static IP address
          - type: object
            title: fqdn
            properties:
              fqdn:
                type: string
                description: peer gateway FQDN name
                maxLength: 255
          - type: object
            title: dynamic
            properties:
              dynamic:
                type: object
                default: {}
      required:
      - name
      - authentication
      - protocol
      - peer_address
      oneOf:
      - type: object
        title: folder
        properties:
          folder:
            type: string
            pattern: ^[a-zA-Z\d\-_\. ]+$
            maxLength: 64
            description: The folder in which the resource is defined
            example: My Folder
        required:
        - folder
      - type: object
        title: snippet
        properties:
          snippet:
            type: string
            pattern: ^[a-zA-Z\d\-_\. ]+$
            maxLength: 64
            description: The snippet in which the resource is defined
            example: My Snippet
        required:
        - snippet
      - type: object
        title: device
        properties:
          device:
            type: string
            pattern: ^[a-zA-Z\d\-_\. ]+$
            maxLength: 64
            description: The device in which the resource is defined
