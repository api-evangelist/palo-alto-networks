                items:
                  type: string
                type: array
          description: OK
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsApiError'
          description: default response
      security:
      - x-redlock-auth: []
      summary: Get Supported Integration Types
      tags:
      - Integrations
