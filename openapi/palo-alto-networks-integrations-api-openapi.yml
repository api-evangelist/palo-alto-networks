          description: default response
      security:
      - x-redlock-auth: []
      summary: Add Integration
      tags:
      - Integrations
    servers:
    - url: https://api.prismacloud.io
    - url: https://api2.prismacloud.io
    - url: https://api3.prismacloud.io
    - url: https://api4.prismacloud.io
