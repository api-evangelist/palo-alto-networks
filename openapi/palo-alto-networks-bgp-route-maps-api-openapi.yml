  parameters:
    uuid:
      name: id
      in: path
      description: The UUID of the configuration resource
      required: true
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426655440000
    name:
      name: name
      in: query
      description: The name of the configuration resource
      required: false
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: The maximum number of results per page
      required: false
      schema:
        type: integer
        default: 200
    folder:
      name: folder
      in: query
      description: 'The folder in which the resource is defined

        '
      required: false
      schema:
        type: string
    snippet:
      name: snippet
      in: query
      description: 'The snippet in which the resource is defined

        '
      required: false
      schema:
        type: string
    offset:
      name: offset
      in: query
      description: The offset into the list of results returned
      required: false
      schema:
        type: integer
        default: 0
    device:
      name: device
      in: query
      description: 'The device in which the resource is defined

        '
      required: false
      schema:
        type: string
  responses:
    http_ok:
      description: OK
    not_found:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_present:
              $ref: '#/components/examples/json_404_panui_mgmt_object_not_present'
    default_errors:
      description: General Errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            version_not_supported:
              $ref: '#/components/examples/json_501_panui_restapi_version_not_supported'
            method_not_allowed:
              $ref: '#/components/examples/json_501_panui_restapi_method_not_supported'
            action_not_supported:
              $ref: '#/components/examples/json_405_panui_restapi_action_not_supported'
            bad_xpath:
              $ref: '#/components/examples/json_400_panui_mgmt_bad_xpath'
            invalid_command:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_command'
            malformed_command:
              $ref: '#/components/examples/json_400_panui_mgmt_malformed_command'
            session_timeout:
              $ref: '#/components/examples/json_504_panui_mgmt_session_timeout'
    bad_request_errors_basic_with_body:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            output_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_output_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
            missing_body:
              $ref: '#/components/examples/json_400_panui_restapi_missing_body'
            invalid_object:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_object'
    bad_request_errors_basic:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            output_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_output_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
    auth_errors:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_not_authenticated:
              $ref: '#/components/examples/json_401_panui_auth_not_authenticated'
            invalid_credential:
              $ref: '#/components/examples/json_401_panui_auth_invalid_credential'
            key_too_long:
              $ref: '#/components/examples/json_401_panui_auth_key_too_long'
            key_expired:
              $ref: '#/components/examples/json_401_panui_auth_key_expired'
            need_password_change:
              $ref: '#/components/examples/json_401_panui_auth_need_password_change'
    conflict_errors:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_object_not_unique'
            name_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_name_not_unique'
            reference_not_zero:
              $ref: '#/components/examples/json_409_panui_mgmt_reference_not_zero'
    access_errors:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_unauthorized:
              $ref: '#/components/examples/json_403_panui_auth_unauthorized'
  schemas:
    generic_error:
      type: object
      properties:
        _errors:
          $ref: '#/components/schemas/error_detail_cause_infos'
        _request_id:
          type: string
      x-examples: {}
    error_detail_cause_info:
      type: object
      title: Cause Info
      properties:
        code:
          type: string
        message:
          type: string
        details:
          oneOf:
          - type: string
          - type: object
        help:
          type: string
    bgp-route-maps:
      type: object
      required:
      - name
      properties:
        id:
          type: string
          description: UUID of the resource
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
        description:
          type: string
        route_map:
          type: array
          items:
            type: object
            properties:
              name:
                description: Sequence number
                type: integer
                minimum: 1
                maximum: 65535
              description:
                description: Description
                type: string
              action:
                description: Action
                type: string
                enum:
                - permit
                - deny
              match:
                type: object
                properties:
                  as_path_access_list:
                    description: AS path access list
                    type: string
                  interface:
                    description: Interface
                    type: string
                  regular_community:
                    description: Regular community
                    type: string
                  origin:
                    description: Origin
                    type: string
                  large_community:
                    description: Large community
                    type: string
                  tag:
                    description: Tag
                    type: integer
                    minimum: 1
                    maximum: 4294967295
                  extended_community:
                    description: Extended community
                    type: string
                  local_preference:
                    type: integer
                    minimum: 0
                    maximum: 4294967295
                  metric:
                    description: Metric
                    type: integer
                    minimum: 0
                    maximum: 4294967295
                  peer:
                    description: Peer
                    type: string
                    enum:
                    - local
                    - none
                  ipv4:
                    type: object
                    description: bgp-route-maps ipv4 object
                    properties:
                      address:
                        type: object
                        properties:
                          access_list:
                            description: Access list
                            type: string
                          prefix_list:
                            description: Prefix list
                            type: string
                      next_hop:
                        type: object
                        properties:
                          access_list:
                            description: Access list
                            type: string
                          prefix_list:
                            description: Prefix list
                            type: string
                      route_source:
                        type: object
                        properties:
                          access_list:
                            description: Access list
                            type: string
                          prefix_list:
                            description: Prefix list
                            type: string
              set:
                type: object
                properties:
                  atomic_aggregate:
                    description: Enable BGP atomic aggregate?
                    type: boolean
                  local_preference:
                    description: Local preference
                    type: integer
                    minimum: 0
                    maximum: 4294967295
                  tag:
                    description: Tag
                    type: integer
                    minimum: 0
                    maximum: 4294967295
                  metric:
                    type: object
                    properties:
                      action:
                        description: Metric action
                        type: string
                        enum:
                        - set
                        - add
                        - substract
                      value:
                        description: Metric value
                        type: integer
                        minimum: 0
                        maximum: 4294967295
                  weight:
                    description: Weight
                    type: integer
                    minimum: 0
                    maximum: 4294967295
                  origin:
                    description: Origin
                    type: string
                    enum:
                    - none
                    - egp
                    - igp
                    - incomplete
                  remove_regular_community:
                    description: Remove regular community name
                    type: string
                  remove_large_community:
                    description: Remove large community name
                    type: string
                  originator_id:
                    description: Originator ID
                    type: string
                  aggregator:
                    type: object
                    description: bgp-route-maps aggregator
                    properties:
                      as:
                        description: Aggregator AS
                        type: integer
                        minimum: 1
                        maximum: 4294967295
                      router_id:
                        description: Router ID
                        type: string
                  ipv4:
                    type: object
                    properties:
                      source_address:
                        description: Source address
                        type: string
                      next_hop:
                        description: Next hop
                        type: string
                  aspath_exclude:
                    type: array
                    items:
                      description: AS number
                      type: integer
                  aspath_prepend:
                    type: array
                    items:
                      description: AS number
                      type: integer
                  regular_community:
                    type: array
                    items:
                      description: Regular community
                      type: string
                      enum:
                      - none
                      - blackhole
                      - no-peer
                      - graceful-shutdown
                      - accept-own
                      - local-as
                      - route-filter-v4
                      - route-filter-v6
                      - no-advertise
                      - no-export
                      - internet
                  overwrite_regular_community:
                    description: Overwrite regular community?
                    type: boolean
                  large_community:
                    type: array
                    items:
                      description: Large community
                      type: string
                  overwrite_large_community:
                    description: Overwrite large community?
                    type: boolean
      oneOf:
      - type: object
        title: folder
        properties:
          folder:
            type: string
            pattern: ^[a-zA-Z\d\-_\. ]+$
            maxLength: 64
            description: The folder in which the resource is defined
            example: My Folder
        required:
        - folder
      - type: object
        title: snippet
        properties:
          snippet:
            type: string
            pattern: ^[a-zA-Z\d\-_\. ]+$
            maxLength: 64
            description: The snippet in which the resource is defined
            example: My Snippet
        required:
        - snippet
      - type: object
        title: device
        properties:
          device:
            type: string
            pattern: ^[a-zA-Z\d\-_\. ]+$
            maxLength: 64
            description: The device in which the resource is defined
            example: My Device
        required:
        - device
    error_detail_cause_infos:
      type: array
      items:
        $ref: '#/components/schemas/error_detail_cause_info'
      x-examples: {}
  securitySchemes:
    scmOAuth:
      type: oauth2
      description: "Strata Cloud Manager APIs authenticate client requests using the \nOAuth 2.0 Client Credentials flow.  Please use the `client_id`, \n`client_secret` values associated with an IAM service account along \nwith a scope value of `tsg_id:XXXXXXXXXX`, where `XXXXXXXXXX` is the \nTenant Service Group (TSG) ID.  The resulting JWT access token should \nbe attached to all API calls as a `Bearer` token in the `Authorization` \nheader (ex. `Authorization: Bearer tokenstring`).\n"
      flows:
        clientCredentials:
          tokenUrl: https://auth.apps.paloaltonetworks.com/oauth2/access_token
          scopes:
            tsg_id: Your tenant service group in the form `tsg_id:XXXXXXXXXX`
    scmToken:
      type: http
      description: "Strata Cloud Manager APIs authenticate client requests using the \nOAuth 2.0 Client Credentials flow.  Please use the `client_id`, \n`client_secret` values associated with an IAM service account along \nwith a scope value of `tsg_id:XXXXXXXXXX`, where `XXXXXXXXXX` is the \nTenant Service Group (TSG) ID.  The resulting JWT access token should \nbe attached to all API calls as a `Bearer` token in the `Authorization` \nheader (ex. `Authorization: Bearer tokenstring`).\n"
      scheme: bearer
      bearerFormat: JWT
x-internal: false
