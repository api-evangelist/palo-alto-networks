          description: Unique identifier
        name:
          type: string
          description: Name
        lastUpdated:
          type: string
          format: date-time
          description: Last updated
        createdAt:
          type: string
          format: date-time
          description: Created at
        provider:
          type: string
          enum:
          - sso
          - local
          description: Provider
      required:
      - id
      - name
    UserResumeResponse:
      type: object
      properties:
        message:
          type: string
          example: Users resumed successfully
    Order:
      type: string
      description: The sort order
      enum:
