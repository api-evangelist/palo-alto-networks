        missingUserIds:
          type: array
          items:
            type: string
          description: List of user IDs that were not found (only present for user not found errors)
    UserStatus:
      type: string
      description: User status
      enum:
      - active
      - suspended
    PageInfo:
      type: object
      properties:
        hasNextPage:
          type: boolean
          description: When paginating forwards, are there more items?
        cursor:
          type:
          - string
          - 'null'
          description: When paginating forwards, the cursor to continue.
      required:
      - hasNextPage
    UserSuspendResponse:
      type: object
      properties:
        message:
          type: string
          example: Users suspended successfully
    UserForceReauthResponse:
      type: object
      properties:
        message:
          type: string
          example: Force re-authentication initiated for 2 users
    User:
      type: object
      properties:
        id:
          type: string
          format: string
          description: Unique identifier
        externalId:
          type: string
          format: string
          description: External identifier
        email:
          type: string
          description: Email
        lastSeen:
          type: string
          format: date-time
          description: Last seen time
        firstSeen:
          type: string
          format: date-time
          description: First seen time
        name:
          type: string
          description: Name
        profilePictureURL:
