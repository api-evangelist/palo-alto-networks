  /v2/api/incidents:
    description: Get Bulk Incidents
    servers:
    - url: https://api.dlp.paloaltonetworks.com
      description: ''
    get:
      tags:
      - DLP API
      parameters:
      - name: ascending
        description: get the list of incident in ascending order or not(default false)
        schema:
          type: boolean
        in: query
        required: false
      - name: channel
        description: ngfw or prisma-access
        schema:
          enum:
          - ngfw
          - prisma-access
          type: string
        in: query
        required: false
      - name: end_time
        description: query incident until
        schema:
          format: date-time
          type: string
