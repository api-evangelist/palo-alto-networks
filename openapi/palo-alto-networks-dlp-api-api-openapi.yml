components:
  schemas:
    IncidentResponse:
      title: PagedDataResponse<IncidentDTO>
      required:
      - page
      type: object
      properties:
        page:
          $ref: '#/components/schemas/PageData'
          description: ''
        resources:
          type: array
          items:
            $ref: '#/components/schemas/IncidentDTO'
    MatchInfo:
      title: MatchInfo
      type: object
      properties:
        detection_technique:
          enum:
          - document_fingerprint
          - edm
          - file_property
          - ml
          - ml_document
          - regex
          - titus_tag
          - trainable_classifier
          - weighted_regex
          type: string
        edm_columns:
          uniqueItems: true
          type: array
          items:
            type: string
        hcf:
          format: int32
          description: high confidence frequency
          type: integer
        lcf:
          format: int32
          description: low confidence frequency
          type: integer
        mcf:
          format: int32
          description: medium confidence frequency
          type: integer
        name:
          description: pattern name
          type: string
        uhcf:
          format: int32
          description: unique high confidence frequency
          type: integer
        ulcf:
          format: int32
          description: unique low confidence frequency
          type: integer
        umcf:
          format: int32
          description: unique medium confidence frequency
          type: integer
        version:
          format: int32
          description: data pattern version
          type: integer
    PageData:
      title: PageData
      type: object
      properties:
        number:
          format: int32
          type: integer
        size:
          format: int32
          type: integer
        total_elements:
          format: int32
          type: integer
        total_pages:
          format: int32
          type: integer
    ScanContentResponse:
      title: ScanContentResponse
      type: object
      properties:
        data_pattern_rule_1_verdict:
          enum:
          - MATCHED
          - NOT_EVALUATED
          - NOT_MATCHED
          type: string
        data_pattern_rule_2_verdict:
          enum:
          - MATCHED
          - NOT_EVALUATED
          - NOT_MATCHED
          type: string
        data_profile_name:
          description: Profile of the detection rules
          type: string
        file_name:
          description: Name of the scanned file
          type: string
        report_id:
          description: ID of the retrieved report
          type: string
        scanContentRawReport:
          description: List of report data
          type: string
        tenant_id:
          description: DLP tenant ID
          type: string
    IncidentDTO:
      title: IncidentDTO
      type: object
      properties:
        action:
          enum:
          - alert
          - block
          - none
          type: string
        app_id:
          type: string
        app_name:
          type: string
        channel:
          enum:
          - ngfw
          - prisma-access
          type: string
        data_profile_id:
          format: int64
          type: integer
        data_profile_name:
          type: string
        file_name:
          type: string
        file_sha:
          type: string
        file_type:
          type: string
        incident_creation_time:
          type: string
          example: yyyy-MMM-dd HH:mm:ss z
        incident_id:
          format: uuid
          type: string
        report_id:
          type: string
        source:
          type: string
        tenant_id:
          type: string
        user:
          type: string
    IncidentResponseDTO:
      title: IncidentResponseDTO
      type: object
      properties:
        action:
          description: Action taken on the incident.
          enum:
          - alert
          - block
          type: string
        app_id:
          description: Palo Alto Networks assigned Application ID.
          type: string
        app_name:
          description: The name of the application.
          type: string
        channel:
          description: The Palo Alto Networks channel that identified the incident.
          enum:
          - ngfw
          - prisma-access
          type: string
        data_profile_id:
          format: int64
          description: The UUID profile descriptor used to characterize the incident.
          type: integer
        data_profile_name:
          description: The data profile descriptor used to characterize the incident.
          type: string
        file_name:
          description: The analyzed file name.
          type: string
        file_sha:
          description: The analyzed file SHA hash.
          type: string
        file_type:
          description: The analyzed file type.
          type: string
        incident_creation_time:
          description: The time the incident first occurred.
          type: string
          example: yyyy-MMM-dd HH:mm:ss z
        incident_id:
          format: uuid
          description: The Palo Alto Networks automatically assigned incident ID.
          type: string
        report_id:
          description: The Palo Alto Networks automatically assigned report ID that you can use to retrieve reports.
          type: string
        source:
          description: The Palo Alto Networks source that identified the incident.
          type: string
        tenant_id:
          description: The TSG enabled tenant used to identify the Incident.
          type: string
        user:
          description: The user assosciated with te incident.
          type: string
        incident_feedback_status:
          description: Current status of the feedback assosicated with the incident.
          type: string
        incident_notes:
          description: User defined notes for the incident.
          type: string
        resolution_status:
          description: Resolution status from Enterprise DLP status.
          type: string
        assignee_id:
          description: Automatically assigned ID of the assignee.
          type: string
        session_key:
          type: string
          description: Specifies a session key assosciated with the incident.
        snippets:
          description: A JSON structure containing snippet data, if snippets are not enabled, the field returns as null.
          type: string
