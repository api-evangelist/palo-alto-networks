  /v1/api/incidents/{incidentID}/assignee:
    description: Assign Incidents
    servers:
    - url: https://api.dlp.paloaltonetworks.com
      description: ''
    put:
      requestBody:
        description: UUID of assignee
        content:
          application/json:
            schema:
              type: string
            examples:
              UUID of assignee:
                value: 00d53ebf-c386-4b95-ad05-6819517c3450
        required: true
      tags:
      - DLP API
      parameters:
      - name: region
        description: region the incident are belongs to (default to us)
        schema:
          enum:
          - us
          - eu
          - uk
          - jp
          - in
          - ap
          - ca
          - au
          - par
          type: string
        in: query
        required: false
      - name: incidentID
        description: ID of the Incident to be updated
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal server error
      security:
      - JWTAuth: []
      summary: Assign Incidents
      operationId: updateIncidentAssignee
  /v1/api/incidents/{incidentID}/notes:
    description: Update incident with notes
    servers:
    - url: https://api.dlp.paloaltonetworks.com
      description: ''
    put:
      operationId: updateIncidentNotes
      requestBody:
        content:
          application/json:
            schema:
              type: string
            examples:
              sample notes:
                value: This is a note for incident
        required: true
      tags:
      - DLP API
      parameters:
      - name: incidentID
        description: ID of the Incident to be updated
        schema:
          type: string
        in: path
        required: true
      - name: region
        description: region the incident belongs to (default to us)
        schema:
          enum:
          - us
          - eu
          - uk
          - jp
          - in
          - ap
          - ca
          - au
          - par
          type: string
        in: query
        required: false
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal server error
      security:
      - JWTAuth: []
      summary: Update Inicident Note
    delete:
      operationId: deleteIncidentNotes
      tags:
      - DLP API
      parameters:
      - name: incidentID
        description: ID of the Incident
        schema:
          type: string
        in: path
        required: true
      - name: region
        description: region the incident belongs to (default to us)
        schema:
          enum:
          - us
          - eu
          - uk
          - jp
          - in
          - ap
          - ca
          - au
          - par
          type: string
        in: query
        required: false
      responses:
        '200':
          description: notes are deleted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal server error
      summary: Remove Incident Notes
