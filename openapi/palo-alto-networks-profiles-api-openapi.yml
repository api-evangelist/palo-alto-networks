      format: int64
      type: integer
    runtime.ProfileProcesses:
      description: ProfileProcesses represents the process data that is learned for a specific image
      properties:
        behavioral:
          description: 'Behavioral are process details learned from behavioral analysis.

            '
          items:
            $ref: '#/components/schemas/runtime.ProfileProcess'
          type: array
        static:
          description: 'Static are process details learned from static analysis.

            '
          items:
            $ref: '#/components/schemas/runtime.ProfileProcess'
          type: array
      type: object
