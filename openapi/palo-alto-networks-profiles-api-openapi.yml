components:
  schemas:
    runtime.ContainerCapabilities:
      description: ContainerCapabilities are a set of static capabilities for a given container
      properties:
        ci:
          description: 'CI indicates the container allowed to write binaries to disk and run them.

            '
          type: boolean
        cloudMetadata:
          description: 'CloudMetadata indicates the given container can query cloud metadata api.

            '
          type: boolean
        dnsCache:
          description: 'DNSCache are DNS services that are used by all the pods in the cluster.

            '
          type: boolean
        dynamicDNSQuery:
          description: 'DynamicDNSQuery indicates capped behavioral dns queries.

            '
          type: boolean
        dynamicFileCreation:
          description: 'DynamicFileCreation indicates capped behavioral filesystem paths.

            '
          type: boolean
        dynamicProcessCreation:
          description: 'DynamicProcessCreation indicates capped behavioral processes.

            '
          type: boolean
        k8s:
          description: 'Kubernetes indicates the given container can perform k8s networking tasks (e.g., contact to api server).

            '
          type: boolean
        proxy:
          description: 'Proxy indicates the container can listen on any port and perform multiple outbound connection.

            '
          type: boolean
        pullImage:
          description: 'PullImage indicates that the container is allowed pull images (might include files with high entropy).

            '
          type: boolean
        sshd:
          description: 'Sshd indicates whether the container can run sshd process.

            '
          type: boolean
        unpacker:
          description: 'Unpacker indicates the container is allowed to write shared libraries to disk.

            '
          type: boolean
      type: object
    shared.ContainerRuntimeProfile:
      description: ContainerRuntimeProfile represents the image runtime profile
      properties:
        _id:
          description: 'ID is the profile ID.

            '
          type: string
        accountIDs:
          description: 'AccountIDs are the cloud account IDs associated with the container runtime profile.

            '
          items:
            $ref: '#/components/schemas/string'
          type: array
        archived:
          description: 'Archive indicates whether this profile is archived.

            '
          type: boolean
        capabilities:
          $ref: '#/components/schemas/runtime.ContainerCapabilities'
        cluster:
          description: 'Cluster is the provided cluster name.

            '
          type: string
        collections:
          description: 'Collections are collections to which this profile applies.

            '
          items:
            $ref: '#/components/schemas/string'
          type: array
        created:
          description: 'Created is the profile creation time.

            '
          format: date-time
          type: string
        entrypoint:
          description: 'Entrypoint is the image entrypoint.

            '
          type: string
        events:
          description: 'Events are the last historical interactive process events for this profile, they are updated in a designated flow.

            '
          items:
            $ref: '#/components/schemas/shared.ContainerHistoryEvent'
          type: array
        filesystem:
          $ref: '#/components/schemas/runtime.ProfileFilesystem'
        hash:
          $ref: '#/components/schemas/common.ProfileHash'
        hostNetwork:
          description: 'HostNetwork whether the instance share the network namespace with the host.

            '
          type: boolean
        hostPid:
          description: 'HostPid indicates whether the instance share the pid namespace with the host.

            '
          type: boolean
        image:
          description: 'Image is the image name that represents the image.

            '
          type: string
        imageID:
          description: 'ImageID is the profile''s image ID.

            '
          type: string
        infra:
          description: 'InfraContainer indicates this is an infrastructure container.

            '
          type: boolean
        istio:
          description: 'Istio states whether it is an istio-monitored profile.

            '
          type: boolean
        k8s:
          $ref: '#/components/schemas/shared.ProfileKubernetesData'
        label:
          description: 'Label is the profile''s label.

            '
          type: string
        lastUpdate:
          description: 'Modified is the last time when this profile was modified.

            '
          format: date-time
          type: string
        learnedStartup:
          description: 'LearnedStartup indicates that startup events were learned.

            '
          type: boolean
        namespace:
          description: 'Namespace is the k8s deployment namespace.

            '
          type: string
        network:
          $ref: '#/components/schemas/runtime.ProfileNetwork'
        os:
          description: 'OS is the profile image OS.

            '
          type: string
        processes:
          $ref: '#/components/schemas/runtime.ProfileProcesses'
        relearningCause:
          description: 'RelearningCause is a string that describes the reasoning for a profile to enter the learning mode after

            being activated.

            '
          type: string
        remainingLearningDurationSec:
          description: 'RemainingLearningDurationSec represents the total time left that the system need to finish learning this image.

            '
          format: double
          type: number
        state:
          $ref: '#/components/schemas/shared.RuntimeProfileState'
      type: object
    common.ProfilePort:
      description: ProfilePort represents a networking profile port
      properties:
        port:
          description: 'Port is the port number.

            '
          type: integer
        time:
          description: 'Time is the learning timestamp of this port.

            '
          format: date-time
          type: string
      type: object
    common.ExternalLabelSourceType:
      description: ExternalLabelSourceType indicates the source of the labels
      enum:
      - - namespace
        - deployment
        - pod
        - aws
        - azure
        - gcp
        - oci
      type: string
    -_runtime.HostProfile:
      items:
        $ref: '#/components/schemas/runtime.HostProfile'
      type: array
    shared.ContainerHistoryEvent:
      description: ContainerHistoryEvent is a container process event created by interactive user
      properties:
        _id:
          description: 'ID is the history event entity.

            '
          type: string
        command:
          description: 'Command is the process that was executed.

            '
          type: string
        hostname:
          description: 'Hostname is the hostname on which the command was invoked.

            '
          type: string
        time:
          description: 'Time is the time of the event.

            '
          format: date-time
          type: string
      type: object
    shared.KubeRole:
      description: 'KubeRole is a compact version of Kubernetes Role

        See https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.25/#role-v1-rbac-authorization-k8s-io'
      properties:
        labels:
          description: 'Labels are the labels associated with the role.

            '
          items:
            $ref: '#/components/schemas/shared.KubeLabel'
          type: array
        name:
          description: 'Name is the role name.

            '
          type: string
        namespace:
          description: 'Namespace is the namespace associated with the role.

            '
          type: string
        roleBinding:
          description: 'RoleBinding is the name of the role binding used for display.

            '
          type: string
        rules:
          description: 'Rules are the list of rules associated with the cluster role.

            '
          items:
            $ref: '#/components/schemas/shared.KubePolicyRule'
          type: array
        version:
          description: 'Version is the resource version of the role object maintained by Kubernetes.

            '
          type: string
      type: object
    runtime.ProfileNetworkStatic:
      description: ProfileNetworkStatic represent the static section of the networking profile
      properties:
        listeningPorts:
          description: 'Listening are the listening ports learned by static analysis.

            '
          items:
            $ref: '#/components/schemas/runtime.AppListeningPorts'
          type: array
      type: object
    runtime.AppListeningPorts:
      description: AppListeningPorts is an association of an app and list of listening ports
      properties:
        app:
          description: 'App is the name of the app.

            '
          type: string
        portsData:
          $ref: '#/components/schemas/common.ProfilePortData'
      type: object
    runtime.ProfileNetwork:
      description: ProfileNetwork represents networking data that is learned
      properties:
        behavioral:
          $ref: '#/components/schemas/runtime.ProfileNetworkBehavioral'
        geoip:
          $ref: '#/components/schemas/runtime.ProfileNetworkGeoIP'
        static:
          $ref: '#/components/schemas/runtime.ProfileNetworkStatic'
      type: object
