openapi: 3.1.0
info:
  title: Palo Alto Networks AIOps for NGFW BPA 5G Deregistered Trend Mssp License Endpoints API
  description: AIOps for NGFW Best Practice Assessment (BPA) API. Provides programmatic access to submit BPA requests for Palo Alto Networks next-generation firewalls, check request processing status, and retrieve completed assessment reports. BPA reports analyze firewall configurations against Palo Alto Networks best practices and security benchmarks, identifying gaps and providing remediation guidance to improve security posture. Part of the Strata Cloud Manager platform.
  version: '1.0'
  contact:
    name: Palo Alto Networks Developer Support
    url: https://pan.dev/
  license:
    name: Proprietary
    url: https://www.paloaltonetworks.com/legal
servers:
- url: https://api.stratacloud.paloaltonetworks.com/aiops/bpa/v1
  description: AIOps for NGFW BPA API production server.
security:
- oauth2Bearer: []
tags:
- name: Mssp License Endpoints
paths:
  /api/v1/license/usage:
    post:
      tags:
      - Mssp License Endpoints
      summary: Palo Alto Networks Get the License Usage for MSSP
      description: Get the license Usage for a MSSP
      operationId: getMsspLicenseUsageV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MsspLicenseUsageRequestObject'
            examples:
              GetMsspLicenseUsageV1RequestExample:
                summary: Default getMsspLicenseUsageV1 request
                x-microcks-default: true
                value:
                  tenantGroupId: '609286'
                  licensePoolId: '720133'
                  timeRange: example-timeRange
                  nextPageToken: example-nextPageToken
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/MsspLicenseUsageResponse'
              examples:
                GetMsspLicenseUsageV1200Example:
                  summary: Default getMsspLicenseUsageV1 200 response
                  x-microcks-default: true
                  value:
                    value:
                    - tenantName: Production Agent 53
                      prismaId: '999338'
                      createdOn: 201
                      expiringOn: 627
                      status: DELETING
                      creditsAllocated: 752
                      avgConsumption: 781
                      lastUpdated: 896
                      externalTenantId: '986311'
                    - tenantName: Staging Sensor 16
                      prismaId: '842673'
                      createdOn: 662
                      expiringOn: 182
                      status: ACTIVE
                      creditsAllocated: 585
                      avgConsumption: 766
                      lastUpdated: 138
                      externalTenantId: '479192'
                    nextPageToken: example-nextPageToken
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                GetMsspLicenseUsageV1401Example:
                  summary: Default getMsspLicenseUsageV1 401 response
                  x-microcks-default: true
                  value:
                    error:
                      code: example-code
                      message: Incident malware violation firewall endpoint investigation firewall network rule blocked activity rule.
                      target: example-target
                      details:
                      - code: example-code
                        message: Incident malware violation firewall endpoint investigation firewall network rule blocked activity rule.
                        target: example-target
                        details:
                        - code: example-code
                          message: Incident malware violation firewall endpoint investigation firewall network rule blocked activity rule.
                          target: example-target
                          details:
                          - {}
                          - {}
                        - code: example-code
                          message: Incident malware violation firewall endpoint investigation firewall network rule blocked activity rule.
                          target: example-target
                          details:
                          - {}
                          - {}
        '403':
          description: Authorization failed, user doesn't have access to the resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                GetMsspLicenseUsageV1403Example:
                  summary: Default getMsspLicenseUsageV1 403 response
                  x-microcks-default: true
                  value:
                    error:
                      code: example-code
                      message: Incident malware violation firewall endpoint investigation firewall network rule blocked activity rule.
                      target: example-target
                      details:
                      - code: example-code
                        message: Incident malware violation firewall endpoint investigation firewall network rule blocked activity rule.
                        target: example-target
                        details:
                        - code: example-code
                          message: Incident malware violation firewall endpoint investigation firewall network rule blocked activity rule.
                          target: example-target
                          details:
                          - {}
                          - {}
                        - code: example-code
                          message: Incident malware violation firewall endpoint investigation firewall network rule blocked activity rule.
                          target: example-target
                          details:
                          - {}
                          - {}
      security:
      - UserJwt: []
      x-public: 'true'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /api/v1/license/info:
    get:
      tags:
      - Mssp License Endpoints
      summary: Palo Alto Networks Get the License Info for MSSP
      description: Get the license info for a MSSP
      operationId: getMsspLicenseInfoV1
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/MsspLicenseInfoResponse'
              examples:
                GetMsspLicenseInfoV1200Example:
                  summary: Default getMsspLicenseInfoV1 200 response
                  x-microcks-default: true
                  value:
                    creditsPurchased: 658
                    creditsAllocated: 596
                    balanceCredit: 157
                    numOfTenant: 306
                    startTime: 1729330017973
                    endTime: 1721793895841
                    msspLicensePoolInfos:
                    - licensePoolName: Branch Sensor 15
                      licensePoolId: '776589'
                      serialNumber: example-serialNumber
                      startTime: 1701182573535
                      endTime: 1712115339005
                      numOfTenant: 265
                      creditsAllocated: 145
                      creditsPurchased: 707
                      tenantGroupLicenseInfos:
                      - tenantGroupName: Branch Agent 68
                        tenantGroupId: '843820'
                        numOfTenant: 622
                        creditsAllocated: 925
                      - tenantGroupName: Production Gateway 45
                        tenantGroupId: '718815'
                        numOfTenant: 2
                        creditsAllocated: 426
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                GetMsspLicenseInfoV1401Example:
