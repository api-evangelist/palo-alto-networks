      required: false
      schema:
        type: string
    name:
      name: name
      in: query
      description: The name of the configuration resource
      required: false
      schema:
        type: string
    folder:
      name: folder
      in: query
      description: 'The folder in which the resource is defined

        '
      required: false
      schema:
        type: string
    uuid:
      name: id
      in: path
      description: The UUID of the configuration resource
      required: true
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426655440000
    device_2:
      name: device
      in: query
      description: Device name for device-scoped configuration.
      schema:
        type: string
    snippet_2:
      name: snippet
      in: query
      description: Configuration snippet name.
      schema:
        type: string
    folder_2:
      name: folder
