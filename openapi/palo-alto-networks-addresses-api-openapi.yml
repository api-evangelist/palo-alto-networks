  schemas:
    error_detail_cause_infos:
      type: array
      items:
        $ref: '#/components/schemas/error_detail_cause_info'
      x-examples: {}
    generic_error:
      type: object
      properties:
        _errors:
          $ref: '#/components/schemas/error_detail_cause_infos'
        _request_id:
          type: string
      x-examples: {}
    addresses:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: The UUID of the address object
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          description: The name of the address object
          maxLength: 63
        description:
          type: string
          maxLength: 1023
          description: The description of the address object
        tag:
          type: array
          description: Tags assocaited with the address object
          maxItems: 64
          items:
            type: string
            maxLength: 127
      anyOf:
      - title: address_type
        description: The address object type
        oneOf:
        - type: object
          title: ip_netmask
          properties:
            ip_netmask:
              type: string
              description: IP address with or without CIDR notation
              example: 192.168.80.0/24
          required:
          - ip_netmask
        - type: object
          title: ip_range
          properties:
            ip_range:
              type: string
              example: 10.0.0.1-10.0.0.4
          required:
          - ip_range
        - type: object
          title: ip_wildcard
          properties:
            ip_wildcard:
              type: string
              description: IP wildcard mask
              example: 10.20.1.0/0.0.248.255
          required:
          - ip_wildcard
        - type: object
          title: fqdn
          properties:
            fqdn:
              type: string
              pattern: ^[a-zA-Z0-9_]([a-zA-Z0-9._-])+[a-zA-Z0-9]$
              minLength: 1
              maxLength: 255
              description: Fully qualified domain name
              example: some.example.com
          required:
          - fqdn
      - title: container_type
        description: The type of configuration container in which the address object is defined
        oneOf:
        - type: object
          title: folder
          properties:
            folder:
              type: string
