openapi: 3.2.0
info:
  contact: {}
  description: 'Access Keys are a secure way to enable programmatic access to the Prisma Cloud API. By default, only

    the System Admin has API access and can enable API access for other administrators. If you have API access,

    you can create up to two access keys. Create an access key for a limited time period and regenerate your API

    keys periodically to minimize exposure and follow security best practices.'
  title: Prisma Cloud Access Keys API Overview Cloud Accounts API
  version: Latest
servers:
- url: https://api.prismacloud.io
- url: https://api2.prismacloud.io
- url: https://api3.prismacloud.io
- url: https://api4.prismacloud.io
tags:
- description: 'To begin monitoring the resources on your cloud infrastructure, you must first connect your public cloud

    accounts to Prisma™ Cloud. When you add your cloud account to Prisma Cloud, the API integration between

    your cloud infrastructure provider and Prisma Cloud is established and you can begin monitoring the resources

    and identify potential security risks in your infrastructure.'
  name: Cloud Accounts
paths:
  /cloud:
    get:
      description: Lists all cloud accounts onboarded onto the Prisma Cloud platform.
      operationId: get-cloud-accounts
      parameters:
      - description: true = Exclude account group details. Default is false.
        in: query
        name: excludeAccountGroupDetails
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                items:
                  $ref: '#/components/schemas/CloudAccountViewModel'
                type: array
          description: successful operation
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: List Cloud Accounts
      tags:
      - Cloud Accounts
  /cloud/name:
    get:
      description: Returns a list of cloud account IDs and names.
      operationId: get-cloud-account-names
      parameters:
      - description: Returns IDs and names of active accounts only. Default is false.
        in: query
        name: onlyActive
        required: false
        schema:
          type: boolean
      - description: Returns IDs and names of accounts that belong to the specified account group IDs
        explode: true
        in: query
        name: accountGroupIds
        required: false
        schema:
          items:
            type: string
          type: array
      - description: Returns IDs and names of accounts that belong to the specified cloudType and accountGroup
        in: query
        name: cloudType
        required: false
        schema:
          type: string
      - description: Returns none cloudAccount and none cloudAccountId in response if includeOthers is true
        in: query
        name: includeOthers
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                items:
                  $ref: '#/components/schemas/CloudAccountIdentity'
                type: array
          description: successful operation
      security:
      - x-redlock-auth: []
      summary: List Cloud Account Names - GET
      tags:
      - Cloud Accounts
    post:
      description: Returns a list of cloud account IDs and names.
      operationId: get-cloud-account-names-by-post
      parameters:
      - description: Returns IDs and names of active accounts only. Default is false.
        in: query
        name: onlyActive
        required: false
        schema:
          type: boolean
      - description: Returns IDs and names of accounts that belong to the specified cloudType and accountGroup
        in: query
        name: cloudType
        required: false
        schema:
          type: string
      - description: Returns none cloudAccount and none cloudAccountId in response if includeOthers is true
        in: query
        name: includeOthers
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountListRequestModel'
        description: Cloud Account Groups
        required: true
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                items:
                  $ref: '#/components/schemas/CloudAccountIdentity'
                type: array
          description: successful operation
      security:
      - x-redlock-auth: []
      summary: List Cloud Account Names - POST
      tags:
      - Cloud Accounts
  /cloud/{cloud_type}/{id}/project:
    get:
      description: Lists all cloud accounts onboarded onto the Prisma Cloud platform as children of an organization.
      operationId: get-cloud-org-accounts
      parameters:
      - description: Cloud Type
        in: path
        name: cloud_type
        required: true
        schema:
          enum:
          - aws
          - azure
          - gcp
          - alibaba_cloud
          - oci
          type: string
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          pattern: .+
          type: string
      - description: true = Exclude account group details. Default is false.
        in: query
        name: excludeAccountGroupDetails
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                items:
                  $ref: '#/components/schemas/CloudAccountViewModel'
                type: array
          description: successful operation
        '400':
          description: not_found / not_an_org
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: List Cloud Org Accounts
      tags:
      - Cloud Accounts
  /cloud/type:
    get:
      description: Returns all the cloud types.
      operationId: get-cloud-types
      parameters:
      - description: '**true** = return only cloud types to which the user has access and for which he has onboarded cloud accounts. Default is **false**.'
        in: query
        name: onlyAccessible
        required: false
        schema:
          type: boolean
      - description: returns other cloudType in response if includeOthers is true
        in: query
        name: includeOthers
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                items:
                  type: string
                type: array
          description: successful operation
      security:
      - x-redlock-auth: []
      summary: List Cloud Types
      tags:
      - Cloud Accounts
  /cloud/{id}/owners:
    get:
      description: Returns the email addresses of all owners for the specified cloud account ID.
      operationId: get-cloud-account-owners
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          pattern: .+
          type: string
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                items:
                  type: string
                type: array
          description: successful operation
        '400':
          description: invalid_account_id_format
        '404':
          description: invalid_account_id_format
      security:
      - x-redlock-auth: []
      summary: List Cloud Account Owners
      tags:
      - Cloud Accounts
  /cloud/{cloud_type}:
    post:
      description: Onboard a new cloud account onto the Prisma Cloud platform.
      operationId: add-cloud-account
      parameters:
      - description: Cloud Type
        in: path
        name: cloud_type
        required: true
        schema:
          enum:
          - aws
          - azure
          - gcp
          - alibaba_cloud
          - oci
          type: string
      - description: true = Skip account status checks to improve response time
        in: query
        name: skipStatusChecks
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                type: object
              type: object
        description: Cloud Account
        required: true
      responses:
        '200':
          description: successful operation
        '400':
          description: duplicate_cloud_account_name / duplicate_cloud_account / invalid_account_id_format / duplicate_cloud_account_needs_upgrade / cannot_select_zero_account_groups / invalid_account_group_ids
        '404':
          description: invalid_account_type
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: Add Cloud Account
      tags:
      - Cloud Accounts
  /cloud/oci/terraform:
    post:
      description: Generates a zipped Terraform template to help you onboard your Oracle Cloud Infrastructure account to Prisma Cloud. You can use this template in the OCI Tenant Console to get a User OCID. Note that the generated keys will be valid for 24 hours.
      operationId: generateterraformscript
      requestBody:
        content:
          application/json; charset=UTF-8:
            schema:
              $ref: '#/components/schemas/TerraformProvisionerRequest'
      responses:
        '200':
          description: successful operation
        '400':
          description: invalid_parameter_value
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: Generate Zipped Terraform Script (OCI)
      tags:
      - Cloud Accounts
  /cloud/{cloud_type}/{id}:
    get:
      description: Returns top level information about the cloud account.
      operationId: get-cloud-account
      parameters:
      - description: Cloud Type
        in: path
        name: cloud_type
        required: true
        schema:
          enum:
          - aws
          - azure
          - gcp
          - alibaba_cloud
          - oci
          type: string
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          pattern: .+
          type: string
      - description: true = Include account group info. Default is false.
        in: query
        name: includeGroupInfo
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/CloudAccountModel'
          description: successful operation
      security:
      - x-redlock-auth: []
      summary: Cloud Account Info
      tags:
      - Cloud Accounts
    put:
      description: Update information related to a cloud account.
      operationId: update-cloud-account
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          pattern: .+
          type: string
      - description: Cloud Type
        in: path
        name: cloud_type
        required: true
        schema:
          enum:
          - aws
          - azure
          - gcp
          - alibaba_cloud
          - oci
          type: string
      - description: true = Skip account status checks to improve response time
        in: query
        name: skipStatusChecks
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                type: object
              type: object
        description: Cloud Account
        required: true
      responses:
        '200':
          description: successful operation
        '400':
          description: invalid_account_id_format / duplicate_cloud_account_name / duplicate_cloud_account / cannot_select_zero_account_groups / invalid_account_group_ids
        '404':
          description: invalid_account_type
        '500':
          description: not_found / internal_error
      security:
      - x-redlock-auth: []
      summary: Update Cloud Account
      tags:
      - Cloud Accounts
    delete:
      description: Deletes the onboarded cloud account that has the specified cloud account ID.
      operationId: delete-cloud-account
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          pattern: .+
          type: string
      - description: Cloud Type
        in: path
        name: cloud_type
        required: true
        schema:
          enum:
          - aws
          - azure
          - gcp
          - alibaba_cloud
          - oci
          type: string
      responses:
        '200':
          description: successful operation
        '400':
          description: invalid_cloud_type / bad_request
        '403':
          description: cannot_delete_org_child
        '404':
          description: invalid_cloud_type / invalid_account_id_format
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: Delete Cloud Account
      tags:
      - Cloud Accounts
    patch:
      description: Enable / disable cloud account (and children) OR Update the Account Groups it belongs to
      operationId: patch-cloud-account
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          pattern: .+
          type: string
      - description: Cloud Type
        in: path
        name: cloud_type
        required: true
        schema:
          enum:
          - aws
          - azure
          - gcp
          - alibaba_cloud
          - oci
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudAccountPatchModel'
        description: Cloud Account Patch
        required: true
      responses:
        '200':
          description: successful operation
        '400':
          description: invalid_account_id_format / invalid_account_patch
        '404':
          description: invalid_cloud_type / invalid_account_id_format
        '405':
          description: cloud_account_already_enabled / cloud_account_already_disabled
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: Patch Cloud Account
      tags:
      - Cloud Accounts
  /account/{accountId}/config/status:
    get:
      description: Returns a list of Prisma Cloud services whose status indicates a warning or error for the given cloud account ID. Includes status details for each listed service.
      operationId: list-cloud-account-status-details
      parameters:
      - description: Cloud account ID
        in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                items:
                  $ref: '#/components/schemas/CloudAccountConfigStatusView'
                type: array
          description: successful operation
        '400':
          description: bad_request
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: List Account Status Details
      tags:
      - Cloud Accounts
  /cloud/status/{cloud_type}:
    post:
      description: 'Lists status messages of the specified cloud account.


        This request performs a cloud account on-boarding trial run. You can use this request to validate your parameters before

        you use Add Cloud Account.'
      operationId: get-cloud-account-status
      parameters:
      - description: Cloud Type
        in: path
        name: cloud_type
        required: true
        schema:
          enum:
          - aws
          - azure
          - gcp
          - alibaba_cloud
          - oci
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                type: object
              type: object
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                items:
                  $ref: '#/components/schemas/CloudAccountStatus'
                type: array
          description: successful operation
        '400':
          description: bad_request
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: Get Cloud Account Status
      tags:
      - Cloud Accounts
  /cloud/{id}/status/{enabled}:
    patch:
      description: Enable or disable cloud account.
      operationId: update-cloud-account-status
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        schema:
          pattern: .+
          type: string
      - description: Status To Set
        in: path
        name: enabled
        required: true
        schema:
          type: boolean
      - description: Allows for updating status of children cloud accounts if any. Default is false.
        in: query
        name: updateChildren
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: successful operation
        '400':
          description: invalid_account_id_format / invalid_account_patch
        '404':
          description: invalid_account_id_format
      security:
      - x-redlock-auth: []
      summary: Update Cloud Account Status
      tags:
      - Cloud Accounts
  /cloud/{cloud_type}/accounts/{account_id}/hierarchy:
    get:
      description: For GCP only. Get the previously saved resource hierarchy for the specified cloud account ID.
      operationId: get-previously-saved-resource-hierarchy
      parameters:
      - description: Cloud type
        in: path
        name: cloud_type
        required: true
        schema:
          enum:
          - gcp
          type: string
      - description: GCP account ID
        in: path
        name: account_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/HierarchySelection'
          description: success
        '400':
          description: bad_request / unauthorized_access
        '404':
          description: invalid_account_id_format
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: Get Saved Resource Hierarchy (GCP)
      tags:
      - Cloud Accounts
  /cloud/gcp/parent/{parent_id}/children:
    post:
      description: 'For GCP only. List all the children, both folder resources and project resources, of the given parent. A parent can be an organization resource or a folder resource.


        The request body parameter is the content of the Service Account Key (JSON) file, which is required.'
      operationId: get-list-of-children-under-parent
      parameters:
      - description: GCP parent resource ID
        in: path
        name: parent_id
        required: true
        schema:
          type: string
      - description: Token to request next page of projects
        in: query
        name: projectNextPageToken
        required: false
        schema:
          type: string
      - description: Page size for paging projects. Valid range is 1-300 inclusive. A page size of 0 returns a nextPageToken but no projects.
        in: query
        name: projectPageSize
        required: false
        schema:
          format: int32
          type: integer
      - description: Token to request next page of folders
        in: query
        name: folderNextPageToken
        required: false
        schema:
          type: string
      - description: Page size for paging folders. Valid range is 1-300 inclusive. A page size of 0 returns a nextPageToken but no folders.
        in: query
        name: folderPageSize
        required: false
        schema:
          format: int32
          type: integer
      - description: Parent type
        in: query
        name: parentType
        required: true
        schema:
          enum:
          - folders
          - organizations
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GcpResourceControllerRequestModel'
        description: The content of the credentials object is the Service Account Key for your Google Cloud service account
        required: true
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ListChildrenApiResponseModel'
          description: success
        '400':
          description: bad_request / unauthorized_access
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: List Children of Parent (GCP)
      tags:
      - Cloud Accounts
  /cloud/{cloud_type}/parent/{parent_id}/folders:
    post:
      description: 'For GCP only. List all the child folders of the given parent. A parent can be an organization resource or a folder resource.


        The request body parameter is the content of the Service Account Key (JSON) file, which is required.'
      operationId: get-list-of-folders-under-parent
      parameters:
      - description: Cloud type
        in: path
        name: cloud_type
        required: true
        schema:
          enum:
          - gcp
          type: string
      - description: GCP parent ID
        in: path
        name: parent_id
        required: true
        schema:
          type: string
      - description: Token to request next page of folders
        in: query
        name: nextPageToken
        required: false
        schema:
          type: string
      - description: Page size. Valid range is 1-300 inclusive. A page size of 0 returns a nextPageToken but no folders.
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
      - description: Parent type
        in: query
        name: parentType
        required: true
        schema:
          enum:
          - folders
          - organizations
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GcpResourceControllerRequestModel'
        description: The content of the credentials object is the Service Account Key for your Google Cloud service account
        required: true
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/GcpNodeModel'
          description: success
        '400':
          description: bad_request
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: List Folders of Parent (GCP)
      tags:
      - Cloud Accounts
  /cloud/{cloud_type}/parent/{parent_id}/projects:
    post:
      description: 'For GCP only. List all the child projects of the given parent. A parent can be an organization resource or a folder resource.


        The request body parameter is the content of the Service Account Key (JSON) file, which is required.'
      operationId: get-list-of-projects-under-parent
      parameters:
      - description: Cloud type
        in: path
        name: cloud_type
        required: true
        schema:
          enum:
          - gcp
          type: string
      - description: GCP parent ID
        in: path
        name: parent_id
        required: true
        schema:
          type: string
      - description: Token to request next page of projects
        in: query
        name: nextPageToken
        required: false
        schema:
          type: string
      - description: Page size. Valid range is 1-300 inclusive. A page size of 0 returns a nextPageToken but no projects.
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
      - description: Parent type
        in: query
        name: parentType
        required: true
        schema:
          enum:
          - folders
          - organizations
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                type: object
              type: object
        description: Service Account Key (JSON) file content
        required: true
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/GcpNodeModel'
          description: success
        '400':
          description: bad_request / unauthorized_access
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: List Projects of Parent (GCP)
      tags:
      - Cloud Accounts
  /cloud/{cloud_type}/accounts/{account_id}/ancestors:
    post:
      description: 'For GCP only. Lists the ancestors of the given projects and folders for the specified cloud account ID. A successful response returns an array of projects and/or folders each of which is mapped to an array of ancestor resource IDs.


        The body parameters resourceIds are required.'
      operationId: get-ancestors-for-given-projects-folders
      parameters:
      - description: Cloud Type
        in: path
        name: cloud_type
        required: true
        schema:
          enum:
          - gcp
          type: string
      - description: Account ID
        in: path
        name: account_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resources'
        description: Cloud service provider resource IDs
        required: true
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                items:
                  $ref: '#/components/schemas/GcpNodeModel'
                type: array
                uniqueItems: true
          description: success
        '400':
          description: bad_request / unauthorized_access
        '404':
          description: invalid_account_id_format
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: List Ancestors (GCP)
      tags:
      - Cloud Accounts
  /cloud-accounts-manager/v1/cloudAccounts/azureAccounts/{parent_id}/children:
    post:
      description: 'For Azure only. Lists all the children, both management groups and subscriptions, under the given parent. A parent can be either an Azure tenant or a management group.


        ### Request Body

        The table below lists the required request body parameters.


        Parameter | Type | Description | Default Value or Required

        -----------| ---- | ----------- | -------------

        cloudAccount.accountId | string | Azure account ID | Required

        cloudAccount.accountType | string | Valid value: **tenant** | Required

        clientId | string | Application ID registered with Active Directory | Required

        tenantId | string | Active Directory ID associated with Azure | Required

        servicePrincipalId | string | Unique ID of the service principal object associated with the Prisma Cloud application | Required

        key | string | Application ID key | Required

        monitorFlowLogs | boolean | Automatically ingest flow logs. Must be **true**. | Required

        environmentType | string | Existing environment type. Valid values:

        **azure** (Commercial),

        **azure_gov** (Government),

        **azure_china** (China) | Required

        rootSyncEnabled | boolean | **true** = Azure tenant has children. Must be **true**. | Required


        #### Request Body Example

        ```json

        {

        "clientId":"",

        "cloudAccount": {

        "accountId":"",

        "accountType":"tenant"

        },

        "environmentType":"azure",

        "key":"",

        "monitorFlowLogs":true,

        "rootSyncEnabled":true,

        "servicePrincipalId":"",

        "tenantId":""

        }

        ```'
      operationId: list-children-under-parent
      parameters:
      - description: Parent Resource ID
        in: path
        name: parent_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                type: object
              type: object
        description: Azure cloud account parameters
        required: true
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                items:
                  $ref: '#/components/schemas/AzureHierarchyNodeModel'
                type: array
          description: success
        '400':
          description: bad_request / unauthorized_access
        '500':
          description: internal_error
      security:
      - x-redlock-auth: []
      summary: List Children of Parent (Azure)
      tags:
      - Cloud Accounts
  /cloud-accounts-manager/v1/cloudAccounts/azureAccounts/{account_id}/ancestors:
    post:
