  parameters:
    uuid:
      name: id
      in: path
      description: The UUID of the configuration resource
      required: true
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426655440000
    pagination-optional:
      name: pagination
      in: query
      required: false
      schema:
        type: boolean
      description: The parameter to mention if the response should be paginated. By default, its set to false
    name:
      name: name
      in: query
      description: The name of the configuration resource
      required: false
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: The maximum number of results per page
      required: false
      schema:
        type: integer
        default: 200
    folder:
      name: folder
      in: query
      description: 'The folder in which the resource is defined

        '
      required: false
      schema:
        type: string
    snippet:
      name: snippet
      in: query
      description: 'The snippet in which the resource is defined

        '
      required: false
      schema:
        type: string
    offset:
      name: offset
      in: query
      description: The offset into the list of results returned
      required: false
      schema:
        type: integer
        default: 0
    device:
      name: device
      in: query
      description: 'The device in which the resource is defined

        '
      required: false
      schema:
        type: string
  responses:
    http_ok:
      description: OK
    not_found:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_present:
              $ref: '#/components/examples/json_404_panui_mgmt_object_not_present'
    default_errors:
      description: General Errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            version_not_supported:
              $ref: '#/components/examples/json_501_panui_restapi_version_not_supported'
            method_not_allowed:
              $ref: '#/components/examples/json_501_panui_restapi_method_not_supported'
            action_not_supported:
              $ref: '#/components/examples/json_405_panui_restapi_action_not_supported'
            bad_xpath:
              $ref: '#/components/examples/json_400_panui_mgmt_bad_xpath'
            invalid_command:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_command'
            malformed_command:
              $ref: '#/components/examples/json_400_panui_mgmt_malformed_command'
            session_timeout:
              $ref: '#/components/examples/json_504_panui_mgmt_session_timeout'
    bad_request_errors_basic_with_body:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            output_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_output_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
            missing_body:
              $ref: '#/components/examples/json_400_panui_restapi_missing_body'
            invalid_object:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_object'
    bad_request_errors_basic:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            output_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_output_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
    auth_errors:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_not_authenticated:
              $ref: '#/components/examples/json_401_panui_auth_not_authenticated'
            invalid_credential:
              $ref: '#/components/examples/json_401_panui_auth_invalid_credential'
            key_too_long:
              $ref: '#/components/examples/json_401_panui_auth_key_too_long'
            key_expired:
              $ref: '#/components/examples/json_401_panui_auth_key_expired'
            need_password_change:
              $ref: '#/components/examples/json_401_panui_auth_need_password_change'
    conflict_errors:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_object_not_unique'
            name_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_name_not_unique'
            reference_not_zero:
              $ref: '#/components/examples/json_409_panui_mgmt_reference_not_zero'
    access_errors:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_unauthorized:
              $ref: '#/components/examples/json_403_panui_auth_unauthorized'
  schemas:
    generic_error:
      type: object
      properties:
        _errors:
          $ref: '#/components/schemas/error_detail_cause_infos'
        _request_id:
          type: string
      x-examples: {}
    error_detail_cause_info:
      type: object
      title: Cause Info
      properties:
        code:
          type: string
        message:
          type: string
        details:
          oneOf:
          - type: string
          - type: object
        help:
          type: string
    error_detail_cause_infos:
      type: array
      items:
        $ref: '#/components/schemas/error_detail_cause_info'
      x-examples: {}
    logical-routers:
      type: object
      required:
      - name
      properties:
        id:
          type: string
          description: UUID of the resource
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
        routing_stack:
          type: string
          enum:
          - legacy
          - advanced
        vrf:
          type: array
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
              interface:
                type: array
                items:
                  type: string
              global_vrid:
                type: integer
              zone_name:
                type: string
              admin_dists:
                type: object
                properties:
                  static:
                    type: integer
                  static_ipv6:
                    type: integer
                  ospf_inter:
                    type: integer
                  ospf_intra:
                    type: integer
                  ospf_ext:
                    type: integer
                  ospfv3_inter:
                    type: integer
                  ospfv3_intra:
                    type: integer
                  ospfv3_ext:
                    type: integer
                  bgp_internal:
                    type: integer
                  bgp_external:
                    type: integer
                  bgp_local:
                    type: integer
                  rip:
                    type: integer
              vr_admin_dists:
                type: object
                properties:
                  static:
                    type: integer
                  static_ipv6:
                    type: integer
                  ospf_int:
                    type: integer
                  ospf_ext:
                    type: integer
                  ospfv3_int:
                    type: integer
                  ospfv3_ext:
                    type: integer
                  ibgp:
                    type: integer
                  ebgp:
                    type: integer
                  rip:
                    type: integer
              sdwan_type:
                type: string
              rib_filter:
                type: object
                properties:
                  ipv4:
                    type: object
                    properties:
                      static:
                        type: object
                        properties:
                          route_map:
                            type: string
                      bgp:
                        type: object
                        properties:
                          route_map:
                            type: string
                      ospf:
                        type: object
                        properties:
                          route_map:
                            type: string
                      rip:
                        type: object
                        properties:
                          route_map:
                            type: string
                  ipv6:
                    type: object
                    properties:
                      static:
                        type: object
                        properties:
                          route_map:
                            type: string
                      bgp:
                        type: object
                        properties:
                          route_map:
                            type: string
                      ospfv3:
                        type: object
                        properties:
                          route_map:
                            type: string
              routing_table:
                type: object
                properties:
                  ip:
                    type: object
                    properties:
                      static_route:
                        type: array
                        items:
                          type: object
                          required:
                          - name
                          properties:
                            name:
                              type: string
                            destination:
                              type: string
                            interface:
                              type: string
                            nexthop:
                              type: object
                              oneOf:
                              - title: receive
                                required:
                                - receive
                                properties:
                                  receive:
                                    type: object
                                    properties: {}
                              - title: discard
                                required:
                                - discard
                                properties:
                                  discard:
                                    type: object
                                    properties: {}
                              - title: ip_address
                                required:
                                - ip_address
                                properties:
                                  ip_address:
                                    type: string
                              - title: ipv6_address
                                required:
                                - ipv6_address
                                properties:
                                  ipv6_address:
                                    type: string
                              - title: fqdn
                                required:
                                - fqdn
                                properties:
                                  fqdn:
                                    type: string
                              - title: next_lr
                                required:
                                - next_lr
                                properties:
                                  next_lr:
                                    type: string
                              - title: next_vr
                                required:
                                - next_vr
                                properties:
                                  next_vr:
                                    type: string
                              - title: tunnel
                                required:
                                - tunnel
                                properties:
                                  tunnel:
                                    type: string
                            route_table:
                              type: object
                              oneOf:
                              - title: unicast
                                required:
                                - unicast
                                properties:
                                  unicast:
                                    type: object
                                    properties: {}
                              - title: multicast
                                required:
                                - multicast
                                properties:
                                  multicast:
                                    type: object
                                    properties: {}
                              - title: both
                                required:
                                - both
                                properties:
                                  both:
                                    type: object
                                    properties: {}
                              - title: no_install
                                required:
                                - no_install
                                properties:
                                  no_install:
                                    type: object
                                    properties: {}
                            admin_dist:
                              type: integer
                            metric:
                              type: integer
                            bfd:
                              type: object
                              properties:
                                profile:
                                  type: string
                            path_monitor:
                              type: object
                              properties:
                                enable:
                                  type: boolean
                                failure_condition:
                                  type: string
                                  enum:
                                  - any
                                  - all
                                hold_time:
                                  type: integer
                                monitor_destinations:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                    - name
                                    properties:
                                      name:
                                        type: string
                                      enable:
                                        type: boolean
                                      source:
                                        type: string
                                      destination:
                                        type: string
                                      destination_fqdn:
                                        type: string
                                      interval:
                                        type: integer
                                      count:
                                        type: integer
                  ipv6:
                    type: object
                    properties:
                      static_route:
                        type: array
                        items:
                          type: object
                          required:
                          - name
                          properties:
                            name:
                              type: string
                            destination:
                              type: string
                            interface:
                              type: string
                            nexthop:
                              type: object
                              oneOf:
                              - title: receive
                                required:
                                - receive
                                properties:
                                  receive:
                                    type: object
                                    properties: {}
                              - title: discard
                                required:
                                - discard
                                properties:
                                  discard:
                                    type: object
                                    properties: {}
                              - title: ipv6_address
                                required:
                                - ipv6_address
                                properties:
                                  ipv6_address:
                                    type: string
                              - title: fqdn
                                required:
                                - fqdn
                                properties:
                                  fqdn:
                                    type: string
                              - title: next_lr
                                required:
                                - next_lr
                                properties:
                                  next_lr:
                                    type: string
                              - title: next_vr
                                required:
                                - next_vr
                                properties:
