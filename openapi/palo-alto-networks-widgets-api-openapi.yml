tags:
- name: Widgets
  x-public: 'true'
  x-ga: 24.1.2
paths:
  /commandcenter/api/v1/metrics/alert-count-by-resolution-reason:
    post:
      tags:
      - Widgets
      summary: Get Alerts Count By Resolution Reason
      description: "The API returns number of resolved alerts grouped by the resolution reason. \nYou must have **Alert_READ** permission to access this endpoint."
      operationId: value-widgets-alert-metrics-resolution-reason
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetApiRequestResolutionReasonFilterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolutionReasonResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: Too Many Requests
      x-public: 'true'
      x-ga: 24.1.2
      security:
      - x-redlock-auth: []
    servers:
    - url: https://api.prismacloud.io
    - url: https://api2.prismacloud.io
    - url: https://api3.prismacloud.io
    - url: https://api4.prismacloud.io
    - url: https://api.anz.prismacloud.io
    - url: https://api.eu.prismacloud.io
    - url: https://api2.eu.prismacloud.io
    - url: https://api.gov.prismacloud.io
    - url: https://api.prismacloud.cn
    - url: https://api.ca.prismacloud.io
    - url: https://api.sg.prismacloud.io
    - url: https://api.uk.prismacloud.io
    - url: https://api.ind.prismacloud.io
    - url: https://api.jp.prismacloud.io
    - url: https://api.fr.prismacloud.io
  /commandcenter/api/v1/metrics/alert-mean-resolution-time:
    post:
      tags:
      - Widgets
      summary: Get Mean Resolution Time
      description: "The API returns the mean resolution time of the alert in days per severity based on the filters.\n You must have **Alert_READ** permission to access this endpoint."
      operationId: value-widgets-alert-metrics
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetApiRequestMeanResolutionTimeFilterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeanResolutionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: Too Many Requests
      x-public: 'true'
      x-ga: 24.1.2
      security:
      - x-redlock-auth: []
    servers:
    - url: https://api.prismacloud.io
    - url: https://api2.prismacloud.io
    - url: https://api3.prismacloud.io
    - url: https://api4.prismacloud.io
    - url: https://api.anz.prismacloud.io
    - url: https://api.eu.prismacloud.io
    - url: https://api2.eu.prismacloud.io
    - url: https://api.gov.prismacloud.io
    - url: https://api.prismacloud.cn
    - url: https://api.ca.prismacloud.io
    - url: https://api.sg.prismacloud.io
    - url: https://api.uk.prismacloud.io
    - url: https://api.ind.prismacloud.io
    - url: https://api.jp.prismacloud.io
    - url: https://api.fr.prismacloud.io
  /adoptionadvisor/api/v2/compute/vulnerabilities/trend:
    post:
      description: Get vulnerabilities discovered and resolved over time across images, hosts, functions, and containers for the impacted resources.
      operationId: value-widgets-get-vulnerabilities-trend
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CWPWidgetRequestModel'
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/VulnerabilitiesTrendResponse'
          description: successful operation
        '400':
          description: bad_request
        '401':
          description: unauthorized_access
      security:
      - x-redlock-auth: []
      summary: Get Vulnerabilities Trend
      tags:
      - Widgets
      x-ga: 24.1.1
      x-public: 'true'
    servers:
    - url: https://api.prismacloud.io
    - url: https://api2.prismacloud.io
    - url: https://api3.prismacloud.io
    - url: https://api4.prismacloud.io
    - url: https://api.anz.prismacloud.io
    - url: https://api.eu.prismacloud.io
    - url: https://api2.eu.prismacloud.io
    - url: https://api.gov.prismacloud.io
    - url: https://api.prismacloud.cn
    - url: https://api.ca.prismacloud.io
    - url: https://api.sg.prismacloud.io
    - url: https://api.uk.prismacloud.io
    - url: https://api.ind.prismacloud.io
    - url: https://api.jp.prismacloud.io
    - url: https://api.fr.prismacloud.io
  /adoptionadvisor/api/v2/cspm/riskyasset/trend:
    post:
      description: Get the list of assets generating alerts.
      operationId: value-widgets-get-assets-with-alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetsWithAlertsRequestModel'
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AssetsWithUrgentAlerts'
          description: successful operation
        '400':
          description: bad_request
        '401':
          description: unauthorized_access
      security:
      - x-redlock-auth: []
      summary: Get Assets with Alerts
      tags:
      - Widgets
      x-ga: 24.1.1
      x-public: 'true'
    servers:
    - url: https://api.prismacloud.io
    - url: https://api2.prismacloud.io
    - url: https://api3.prismacloud.io
    - url: https://api4.prismacloud.io
    - url: https://api.anz.prismacloud.io
    - url: https://api.eu.prismacloud.io
    - url: https://api2.eu.prismacloud.io
    - url: https://api.gov.prismacloud.io
    - url: https://api.prismacloud.cn
    - url: https://api.ca.prismacloud.io
    - url: https://api.sg.prismacloud.io
    - url: https://api.uk.prismacloud.io
    - url: https://api.ind.prismacloud.io
    - url: https://api.jp.prismacloud.io
    - url: https://api.fr.prismacloud.io
  /adoptionadvisor/api/v2/compute/discovered-secured/trend:
    post:
      description: Get resources detected by Cloud Discovery as well as the resources secured by deployed defenders.
      operationId: value-widgets-get-discovered-vs-secured
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CWPWidgetRequestModel'
      responses:
        '200':
          content:
            application/json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/DiscoverVsSecuredResponse'
          description: successful operation
        '400':
          description: bad_request
        '401':
          description: unauthorized_access
      security:
      - x-redlock-auth: []
      summary: Get Discovered and Secured Resources
      tags:
      - Widgets
      x-ga: 24.1.1
      x-public: 'true'
    servers:
    - url: https://api.prismacloud.io
