      - Benchmark Monitoring
      summary: Download Benchmark Data
      description: Download benchmark monitoring data in specified format (CSV, etc.)
      operationId: getBenchmarkMonitoringDownload
      security:
      - BearerAuth: []
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 0
          minimum: 0
        description: Number of records to skip for pagination
        example: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 0
          minimum: 0
        description: Maximum number of records to return (0 for no limit)
        example: 100
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: csv
          enum:
          - csv
          - json
        description: Export format
        example: csv
      - name: compression
        in: query
        required: false
        schema:
          type: string
          default: 'no'
          enum:
          - 'no'
          - gzip
          - zip
        description: Compression type
        example: 'no'
      requestBody:
        required: true
        content:
