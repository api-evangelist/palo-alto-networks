openapi: 3.2.0
info:
  version: 2.0.0
  title: GlobalProtect Regional and Custom Proxies API
  description: These APIs are used for defining and managing Prisma Access GlobalProtect services within Strata Cloud Manager.
  termsOfService: https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/legal/palo-alto-networks-end-user-license-agreement-eula.pdf
  contact:
    email: support@paloaltonetworks.com
    name: Palo Alto Networks Technical Support
    url: https://support.paloaltonetworks.com
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
- url: https://api.strata.paloaltonetworks.com/config/mobile-agent/v1
  description: Current
- url: https://api.sase.paloaltonetworks.com/sse/config/v1/mobile-agent
  description: Legacy
security:
- scmToken: []
tags:
- name: Regional and Custom Proxies
  description: Regional and Custom Proxies
paths:
  /forwarding-profile-regional-and-custom-proxies:
    get:
      tags:
      - Regional and Custom Proxies
      summary: List GlobalProtect regional and custom proxies
      description: 'Retrieve a list of GlobalProtect regional and custom proxies

        '
      operationId: ListGlobalProtectRegionalAndCustomProxies
      parameters:
      - $ref: '#/components/parameters/name'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/folder-mobileusers-required'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/regional-and-custom-proxy'
                  limit:
                    type: integer
                    default: 200
                  offset:
                    type: integer
                    default: 0
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        default:
          $ref: '#/components/responses/default_errors'
    post:
      tags:
      - Regional and Custom Proxies
      summary: Create a GlobalProtect regional and custom proxy
      description: 'Create a new GlobalProtect regional and custom proxy

        '
      operationId: CreateGlobalProtectRegionalAndCustomProxies
      parameters:
      - $ref: '#/components/parameters/folder-mobileusers-required'
      requestBody:
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/regional-and-custom-proxy'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/regional-and-custom-proxy'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
  /forwarding-profile-regional-and-custom-proxies/{id}:
    get:
      tags:
      - Regional and Custom Proxies
      summary: Get a GlobalProtect regional and custom proxy
      description: 'Retrieve an existing GlobalProtect regional and custom proxy

        '
      operationId: GetGlobalProtectRegionalAndCustomProxyByID
      parameters:
      - $ref: '#/components/parameters/uuid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/regional-and-custom-proxy'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        default:
          $ref: '#/components/responses/default_errors'
    put:
      tags:
      - Regional and Custom Proxies
      summary: Update a GlobalProtect regional and custom proxy
      description: 'Update an existing GlobalProtect regional and custom proxy

        '
      operationId: UpdateGlobalProtectRegionalAndCustomProxyByID
      parameters:
      - $ref: '#/components/parameters/uuid'
      requestBody:
        description: The regional and custom proxy resource definition
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/regional-and-custom-proxy'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/regional-and-custom-proxy'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
    delete:
      tags:
      - Regional and Custom Proxies
      summary: Delete a GlobalProtect regional and custom proxy
      description: 'Delete a GlobalProtect regional and custom proxy

        '
      operationId: DeleteGlobalProtectRegionalAndCustomProxies
      parameters:
      - $ref: '#/components/parameters/uuid'
      responses:
        '200':
          $ref: '#/components/responses/http_ok'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
