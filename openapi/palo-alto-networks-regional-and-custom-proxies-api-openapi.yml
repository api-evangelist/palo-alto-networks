            missing_body:
              $ref: '#/components/examples/json_400_panui_restapi_missing_body'
            invalid_object:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_object'
    http_ok:
      description: OK
  schemas:
    regional-and-custom-proxy:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The UUID of the regional and custom proxy
        name:
          type: string
          maxLength: 64
          pattern: ^[0-9a-zA-Z._-]+$
          description: alphanumeric string [ 0-9a-zA-Z._-]
        type:
          type: string
          enum:
          - gp-and-pac
          - ztna-agent
          default: gp-and-pac
        description:
          type: string
          maxLength: 1023
        proxy_1:
          type: object
          properties:
            fqdn:
              type: string
              pattern: ^([\*a-zA-Z0-9._-])+$
              maxLength: 255
            port:
              type: integer
              minimum: 1
              maximum: 65535
            location:
              type: string
        proxy_2:
          type: object
          properties:
            fqdn:
              type: string
              pattern: ^([\*a-zA-Z0-9._-])+$
              maxLength: 255
            port:
              type: integer
              minimum: 1
              maximum: 65535
            location:
              type: string
        connectivity_preference:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                enum:
                - tunnel
                - proxy
                - adns
                - masque
              enabled:
                type: boolean
                default: false
            required:
            - name
        fallback_option:
          type: string
          enum:
          - fail-open
          - fail-safe
        location_preference:
          type: string
          enum:
          - best-available-pa-location
          - specific-pa-location
        prisma_access_locations:
          type: array
          description: Select Prisma Access location Americas, Europe and Asia-Pacific.
          items:
            type: object
            properties:
              name:
                type: string
                pattern: ^[a-zA-Z]+$
                description: One of the region from 'americas', 'europe', 'apac'
              locations:
                type: array
                description: Add list of locations separated by space, in that region
                items:
                  type: string
                  maxLength: 63
                  pattern: ^[a-zA-Z0-9-]+$
                  description: Name of the Location to spawn GP Gateway
            required:
            - name
      required:
      - name
    generic_error:
      type: object
      properties:
        _errors:
          $ref: '#/components/schemas/error_detail_cause_infos'
        _request_id:
          type: string
      x-examples: {}
    error_detail_cause_infos:
      type: array
      items:
        $ref: '#/components/schemas/error_detail_cause_info'
      x-examples: {}
    error_detail_cause_info:
      type: object
      title: Cause Info
      properties:
        code:
          type: string
        message:
          type: string
        details:
          oneOf:
          - type: string
          - type: object
        help:
          type: string
  parameters:
    name:
      name: name
      in: query
      description: The name of the configuration resource
      required: false
      schema:
        type: string
    uuid:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: The UUID of the resource
    offset:
      name: offset
      in: query
      description: The offset into the list of results returned
      required: false
      schema:
        type: integer
        default: 0
    limit:
      name: limit
      in: query
      description: The maximum number of results per page
      required: false
      schema:
        type: integer
        default: 200
    folder-mobileusers-required:
      name: folder
      in: query
      description: 'The folder in which the resource is defined

        '
      schema:
        enum:
        - Mobile Users
  securitySchemes:
    scmOAuth:
      type: oauth2
      description: "Strata Cloud Manager APIs authenticate client requests using the \nOAuth 2.0 Client Credentials flow.  Please use the `client_id`, \n`client_secret` values associated with an IAM service account along \nwith a scope value of `tsg_id:XXXXXXXXXX`, where `XXXXXXXXXX` is the \nTenant Service Group (TSG) ID.  The resulting JWT access token should \nbe attached to all API calls as a `Bearer` token in the `Authorization` \nheader (ex. `Authorization: Bearer tokenstring`).\n"
      flows:
        clientCredentials:
          tokenUrl: https://auth.apps.paloaltonetworks.com/oauth2/access_token
          scopes: {}
    scmToken:
      type: http
      description: "Strata Cloud Manager APIs authenticate client requests using the \nOAuth 2.0 Client Credentials flow.  Please use the `client_id`, \n`client_secret` values associated with an IAM service account along \nwith a scope value of `tsg_id:XXXXXXXXXX`, where `XXXXXXXXXX` is the \nTenant Service Group (TSG) ID.  The resulting JWT access token should \nbe attached to all API calls as a `Bearer` token in the `Authorization` \nheader (ex. `Authorization: Bearer tokenstring`).\n"
      scheme: bearer
      bearerFormat: JWT
x-internal: false
