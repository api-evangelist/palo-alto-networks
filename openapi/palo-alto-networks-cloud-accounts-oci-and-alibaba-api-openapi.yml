    - url: https://api.jp.prismacloud.io
    - url: https://api.fr.prismacloud.io
  /cloud/{cloud_type}/{id}:
    put:
      tags:
      - Cloud Accounts (OCI and Alibaba)
      summary: Update Cloud Account (OCI and Alibaba)
      description: "Update information related to a cloud account. \n\nThe request body parameters differ depending on the cloud type of the account you want to add.\n\n\n### Request Body to Update an Alibaba Account\nThe table below lists the request body parameters.\n\nParameter  | Type | Description |  Required?\n-----------| ---- | ----------- | -------------\naccountId |string | AWS account ID | Required\n groupIds | array of strings  | List of account group IDs for this account  | Required\n name | string  | Name to be used for the account on the Prisma Cloud platform (must be unique)  | Required\n roleArn | string | Unique identifier for an Alibaba RAM role resource | Required\n enabled | boolean | Whether or not the account is enabled | Required\n deploymentType | string | Deployment type. <br/> Valid values: **ali-int**, **ali-cn**, **ali-fn** <br/> **ali-int:** Alibaba International <br/> **ali-cn:** Alibaba China. Allows you to monitor all the resources in the Alibaba China region, but does not monitor resources in the Alibaba Finance region. <br/> **ali-fn:** Alibaba Finance. Applicable only for the Alibaba China region. Allows you to monitor resources located only in the Alibaba Finance regions.| Optional\n\n#### Request Body Example\n```json\n{\n  \"accountId\": \"\",\n  \"groupIds\": [],\n  \"name\": \"\",\n  \"enabled\": true,\n  \"ramArn\": \"\"\n}\n```\n### Request Body to Update an OCI Account\nThe table below lists the request body parameters to add an OCI account.\n\nParameter  | Type | Description | Required?\n-----------| ---- | ----------- | -------------\n accountType | string | OCI Account type. Current valid value is **tenant**. | Required\n defaultAccountGroupId | string | Account group ID for this account. Used for alert rules. |  Required\n enabled | boolean | Whether or not to enable the account |  Required\n name | string  | Name of the OCI tenant you want Prisma Cloud to monitor | Required\n groupName | string | OCI identity group name that you define. Can be an existing group |  Required\n homeRegion | string  | OCI tenancy home region |  Required\n policyName | string  | OCI identity policy name that you define. Can be an existing policy that has the right policy statements. |  Required\n accountId | string  | OCID of your OCI tenancy | Required\n userName | string  | OCI identity user name that you define. Can be an existing user that has the right privileges. |  Required\n userOcid | string  | User OCID from your OCI Tenant Console after you apply the zip file from [Generate Zipped Terraform Script (OCI)](/prisma-cloud/api/cspm/generateterraformscript) in the console |  Required\n\n#### Request Body Example\n```json\n{\n  \"accountType\":\"tenant\",\n  \"defaultAccountGroupId\":\"\",\n  \"enabled\":true,\n  \"name\":\"\",\n  \"groupName\":\"\",\n  \"homeRegion\":\"\",\n  \"policyName\":\"\",\n  \"accountId\":\"\",\n  \"userName\":\"\",\n  \"userOcid\":\"\"\n}\n```      \n"
      operationId: update-cloud-account
      parameters:
      - name: id
        in: path
        description: Account ID
        required: true
        schema:
          type: string
      - name: cloud_type
        in: path
        description: Cloud Type
        required: true
        schema:
          type: string
          enum:
          - alibaba_cloud
          - oci
      - name: skipStatusChecks
        in: query
        description: true = Skip account status checks to improve response time
        required: false
        schema:
          type: boolean
      requestBody:
        $ref: '#/components/requestBodies/add-cloud-accountBody'
      responses:
        '200':
          description: successful operation
        '400':
          description: invalid_account_id_format / duplicate_cloud_account_name / duplicate_cloud_account / cannot_select_zero_account_groups / invalid_account_group_ids
        '404':
          description: invalid_account_type
      security:
      - x-redlock-auth: []
      x-public: 'true'
    servers:
