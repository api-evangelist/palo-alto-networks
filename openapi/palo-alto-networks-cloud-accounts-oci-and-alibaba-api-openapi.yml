info:
  title: Palo Alto Networks Cloud Accounts (OCI and Alibaba) API
  version: '1.0'
  description: 'Operations tagged Cloud Accounts (OCI and Alibaba) across 2 of this provider''s published API definitions: palo-alto-cspm-cloudaccountonboardingmicroservices-openapi.json, palo-alto-cspm-cloudaccountsmicroservice-openapi.json. Each path carries the servers of the definition it was published in.'
