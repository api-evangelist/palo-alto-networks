          description: Service Unavailable
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error
      summary: Get an EDL definition
      tags:
      - EDL Definitions
    put:
      description: Update an existing EDL definition.
      operationId: UpdateEDLDefinitionByID
      parameters:
      - description: EDL definition ID
        in: path
        name: edl-id
        required: true
        schema:
          description: EDL definition ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/edl-definition-input'
              description: EDL definition to be modified
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/edl-item'
          description: OK
          headers:
            Location:
              schema:
                description: URI of the created EDL definition resource
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
          description: Bad Request
        '401':
