components:
  requestBodies:
    GcpResourceControllerRequestModel:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GcpResourceControllerRequestModel'
      description: The content of the credentials object is the Service Account Key for your Google Cloud service account
      required: true
    GcpCloudAccountRequestModel:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GcpCloudAccountRequestModel'
      description: Cloud Account
      required: true
  schemas:
    RestApiResponseModel:
      type: object
      properties:
        response:
          type: array
          description: Response
          items:
            $ref: '#/components/schemas/GcpNodeModel'
        nextPageToken:
          type: string
          description: Next page token
      description: Model for RestApiResponse
    GcpCloudAccountRequestModel:
      type: object
      required:
      - cloudAccount
      - credentials
      - defaultAccountGroupId
      properties:
        cloudAccount:
          $ref: '#/components/schemas/GcpCloudAccountRequestModelCloudAccount'
        credentials:
          $ref: '#/components/schemas/Credentials'
        compressionEnabled:
          type: boolean
          description: 'Enable or disable compressed network flow log generation.


            Default value: **false**'
        dataflowEnabledProject:
          type: string
          description: 'Project ID where the Dataflow API is enabled .


            Required if `compressionEnabled` is set to **true** and if the `accountType` is **organization**.


            Optional if the `accountType` is **account** or **masterServiceAccount**'
        flowLogStorageBucket:
          type: string
          description: Cloud Storage Bucket name that is used store the flow logs.
        accountGroupCreationMode:
          type: string
          description: 'Default value: **MANUAL**


            **MANUAL**: Account will be mapped to the account group mentioned in `defaultAccountGroupId`.


            **AUTO**: Automatically creates account groups for each top-level folder in the hierarchy.


            **RECURSIVE**: Automatically creates account groups for the folders that are nested within the GCP organization hierarchy.


            Applicable only if the `accountType` is **organization**.'
          enum:
          - MANUAL
          - AUTO
          - RECURSIVE
        defaultAccountGroupId:
          type: string
          description: 'Applicable only


            * If `accountType` is **organization** and `accountGroupCreationMode` is **MANUAL**.


            * If `accountType` is **masterServiceAccount**.'
        hierarchySelection:
          type: array
          description: "Applicable only if `accountType` is **organization**. \n\nInclude/Exclude a list of GCP folders, GCP projects under the organization."
          items:
            $ref: '#/components/schemas/GcpHierarchySelectionModel'
        organizationName:
          type: string
          description: GCP Organization name
        features:
          type: array
          description: Features to be enabled and/ or disabled. To get a list of all the supported features, see **[Fetch Supported Features endpoint](/prisma-cloud/api/cspm/fetch-supported-features)**
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Feature'
      description: Model containing the request for GCP Standalone, Organization, Master Service Account and Workspace Domain
    Credentials:
      type: object
      properties:
        token_uri:
          type: string
        private_key_id:
          type: string
        client_x509_cert_url:
          type: string
        project_id:
          type: string
        auth_uri:
          type: string
        auth_provider_x509_cert_url:
          type: string
        client_email:
          type: string
        private_key:
          type: string
        type:
          type: string
        client_id:
          type: string
      description: The content of the credentials object is the Service Account Key for your Google Cloud service account
    HierarchySelection:
      type: object
      properties:
        resourceId:
          type: string
          example: root
          description: "To get the list of resource IDs and its details, Refer List Children of Parent. \n\n **aws**: [List Children of Parent (AWS)](/prisma-cloud/api/cspm/get-list-of-children-under-parent-aws/) \n\n **gcp**: [List Children of Parent (GCP)](/prisma-cloud/api/cspm/get-list-of-children-under-parent/) \n\n**azure**: [List Children of Parent (Azure)](/prisma-cloud/api/cspm/list-children-under-parent/)"
        displayName:
