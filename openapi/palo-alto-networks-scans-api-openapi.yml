    Scan:
      type: object
      properties:
        scan_id:
          type: string
          description: Unique identifier of the scan.
          example: '588456'
        target_id:
          type: string
          description: ID of the scan target being assessed.
          example: '410241'
        target_name:
          type: string
          description: Display name of the scan target.
          example: Production Agent 95
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - cancelled
          description: Current status of the scan.
          example: running
        attack_categories:
          type: array
          items:
            type: string
          description: Attack categories included in this scan.
          example:
          - example-attack_categories_item
        progress:
          type: number
          format: float
          description: Scan completion progress from 0.0 to 1.0.
          minimum: 0.0
          maximum: 1.0
          example: 0.36
        total_attacks:
          type: integer
          description: Total number of attack probes to be executed.
          example: 275
        completed_attacks:
          type: integer
          description: Number of attack probes completed so far.
          example: 880
        vulnerabilities_found:
          type: integer
          description: Number of vulnerabilities discovered so far.
          example: 746
        error_message:
          type: string
          description: Error description if the scan failed.
          example: example-error_message
        started_at:
          type: string
          format: date-time
          description: Timestamp when the scan started.
          example: '2025-08-08T22:13:06Z'
        completed_at:
          type: string
          format: date-time
          description: Timestamp when the scan completed.
          example: '2024-11-03T18:50:01Z'
    CIScan:
      type: object
      properties:
        entityInfo:
          type: object
          properties:
            _id:
              type: string
              example: '112406'
            type:
              type: string
              enum:
              - ciImage
              - ciServerless
              - ciIaC
              example: ciImage
            hostname:
              type: string
              example: host-d7ec
            scanTime:
              type: string
              format: date-time
              example: '2026-01-03T15:52:28Z'
          example:
            _id: '302929'
            type: ciIaC
            hostname: host-6942
            scanTime: '2026-01-25T05:11:50Z'
        pass:
          type: boolean
          description: Whether the scan passed the configured policy thresholds.
          example: true
        vulnerabilitiesCount:
          type: integer
          example: 27
        complianceIssuesCount:
          type: integer
          example: 398
        vulnerabilityDistribution:
          type: object
          properties:
            critical:
              type: integer
              example: 508
            high:
              type: integer
              example: 66
            medium:
              type: integer
              example: 709
            low:
              type: integer
              example: 859
          example:
            critical: 112
            high: 224
            medium: 858
            low: 591
    ScanStatus:
      type: object
      properties:
        scan_id:
          type: string
          description: Unique scan identifier.
          example: '905307'
        repositoryId:
          type: string
          description: Repository that was scanned.
          example: '225862'
        branch:
          type: string
          description: Branch that was scanned.
          example: example-branch
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          description: Current scan status.
          example: failed
        startTime:
          type: string
          format: date-time
          description: Scan start timestamp.
          example: '2025-06-09T14:49:57Z'
        endTime:
          type: string
          format: date-time
          description: Scan completion timestamp.
          example: '2026-10-02T12:40:08Z'
        scanTypes:
          type: array
          items:
            type: string
            enum:
            - iac
            - sca
            - secrets
            - cicd
          description: Types of scans included in this run.
          example:
          - sca
          - iac
        summary:
          type: object
          description: High-level scan result summary. Available after completion.
          properties:
            filesScanned:
              type: integer
              example: 387
            resourcesScanned:
              type: integer
              example: 861
            errorsBySeverity:
              type: object
              properties:
                critical:
                  type: integer
                  example: 932
                high:
                  type: integer
                  example: 868
                medium:
                  type: integer
                  example: 675
                low:
                  type: integer
                  example: 245
                info:
                  type: integer
                  example: 509
              example:
                critical: 138
                high: 977
                medium: 550
                low: 371
                info: 383
          example:
            filesScanned: 87
            resourcesScanned: 381
            errorsBySeverity:
              critical: 274
              high: 812
              medium: 73
              low: 85
              info: 478
    ErrorResponse_2:
      type: object
      properties:
        status:
          type: integer
