      type: object
      required:
      - target_id
      - attack_categories
      properties:
        target_id:
          type: string
          description: ID of the scan target to assess.
          example: '645262'
        attack_categories:
          type: array
          items:
            type: string
          minItems: 1
          description: Attack category identifiers to include in the scan. Use GET /v1/attack-categories to retrieve available category IDs.
          example:
          - example-attack_categories_item
          - example-attack_categories_item
        custom_prompts:
          type: array
          items:
            type: string
          description: Optional custom adversarial prompts to include alongside the built-in attack library. Useful for testing application-specific threat scenarios.
          maxItems: 100
          example:
          - example-custom_prompts_item
          - example-custom_prompts_item
        max_attacks_per_category:
          type: integer
          description: Maximum number of attack probes per category. Limits scan duration for large attack libraries. If omitted, all available attacks for each category are executed.
          minimum: 1
          maximum: 1000
          example: 740
    ScanReport:
      type: object
      properties:
        scan_id:
          type: string
          description: Unique identifier of the scan.
          example: '428692'
        target_id:
          type: string
          description: ID of the assessed target.
          example: '819001'
        target_name:
          type: string
          description: Display name of the assessed target.
