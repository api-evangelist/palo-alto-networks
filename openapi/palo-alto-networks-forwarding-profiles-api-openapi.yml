  schemas:
    forwarding-rule-basic:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
          pattern: ^[0-9a-zA-Z._-]+$
          description: alphanumeric string [ 0-9a-zA-Z._-]
        enabled:
          type: boolean
          default: true
          description: Enable forwarding rule
        user_locations:
          type: string
          maxLength: 64
          default: Any
        destinations:
          type: string
          maxLength: 64
          default: Any
        connectivity:
          type: string
          maxLength: 64
          default: direct
      required:
      - name
    forwarding-profile:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The UUID of the forwarding profile
        name:
          type: string
          maxLength: 64
          pattern: ^[0-9a-zA-Z._-]+$
          description: alphanumeric string [ 0-9a-zA-Z._-]
        description:
          type: string
          maxLength: 1023
        definition_method:
          type: string
          enum:
          - rules
          - pac-file
          default: rules
          description: Enable forwarding rule
        type:
          type: object
          oneOf:
          - $ref: '#/components/schemas/forwarding-profile-pac-file'
          - $ref: '#/components/schemas/forwarding-profile-global-protect-proxy'
          - $ref: '#/components/schemas/forwarding-profile-ztna-agent'
      required:
      - name
    block-rule-basic:
      type: object
      properties:
        enable:
          type: boolean
          description: Enable block rule
        allow_tcp:
          type: object
          properties:
            enable_locations:
              type: boolean
              description: Enable locations for allow-tcp
            locations:
              type: array
              items:
                type: string
                maxLength: 64
        allow_udp:
          type: object
          properties:
            enable_locations:
              type: boolean
              description: Enable locations for allow-udp
            enable_destinations:
              type: boolean
              description: Enable destinations for allow-udp
            locations:
              type: array
              items:
                type: string
                maxLength: 64
            destinations:
              type: string
              maxLength: 64
    block-rule-ztna:
      type: object
      properties:
        block_all_other_unmatched_outbound_connections:
          type: boolean
          default: false
          description: Block all other unmatched outbound connections
        block_outbound_lan_access_when_connected_to_tunnel:
          type: boolean
          default: false
          description: Block outbound LAN access when connected to tunnel
        block_inbound_access_when_connected_to_tunnel:
          type: boolean
          default: false
          description: Block inbound access when connected to tunnel
        block_non_tcp_non_udp_based_traffic_when_connected_to_tunnel:
          type: boolean
          default: false
          description: Block Non-TCP Non UDP based traffic when connected to tunnel
        allow_icmp_for_troubleshooting:
          type: boolean
          default: false
          description: Allow ICMP for troubleshooting
        enforcer_fqdn_dns_resolution_via_dns_servers:
          type: boolean
          default: true
          description: Enforce FQDN DNS resolution via tunnel DNS servers
        resolve_all_fqdns_using_dns_servers_assigned_by_the_tunnel:
          type: boolean
          default: true
          description: Resolve All FQDNs using DNS servers assigned by the tunnel (Windows Only)
    forwarding-profile-global-protect-proxy:
      type: object
      properties:
        global_protect_proxy:
          type: object
          properties:
            pac_upload:
              type: boolean
              default: false
              description: User upload PAC file
            forwarding_rules:
              type: array
              items:
                $ref: '#/components/schemas/forwarding-rule-basic'
            block_rule:
              $ref: '#/components/schemas/block-rule-basic'
    generic_error:
      type: object
      properties:
        _errors:
          $ref: '#/components/schemas/error_detail_cause_infos'
        _request_id:
          type: string
      x-examples: {}
    error_detail_cause_infos:
      type: array
      items:
        $ref: '#/components/schemas/error_detail_cause_info'
      x-examples: {}
    forwarding-profile-ztna-agent:
      type: object
      properties:
        ztna_agent:
          type: object
          properties:
            pac_upload:
              type: boolean
              default: false
              description: User upload PAC file
            forwarding_rules:
              type: array
              items:
                $ref: '#/components/schemas/forwarding-rule-ztna'
            block_rule:
              $ref: '#/components/schemas/block-rule-ztna'
    error_detail_cause_info:
      type: object
      title: Cause Info
      properties:
        code:
          type: string
        message:
          type: string
        details:
          oneOf:
          - type: string
          - type: object
        help:
          type: string
    forwarding-profile-pac-file:
      type: object
      properties:
        pac_file:
          type: object
          properties:
            pac_upload:
              type: boolean
              default: false
              description: User upload PAC file
            forwarding_rules:
              type: array
              items:
                $ref: '#/components/schemas/forwarding-rule-basic'
            block_rule:
              $ref: '#/components/schemas/block-rule-basic'
    forwarding-rule-ztna:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
          pattern: ^[0-9a-zA-Z._-]+$
          description: alphanumeric string [ 0-9a-zA-Z._-]
        traffic_type:
          type: string
          enum:
          - dns
          - dns-and-network-traffic
          - network-traffic
          default: dns
        enabled:
          type: boolean
          default: true
          description: Enable forwarding rule
        user_locations:
          type: string
          maxLength: 64
          default: Any
        source_applications:
          type: string
          default: Any
        destinations:
          type: string
          maxLength: 64
          default: Any
        connectivity:
          type: string
          maxLength: 64
          default: direct
      required:
      - name
  responses:
    access_errors:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_unauthorized:
              $ref: '#/components/examples/json_403_panui_auth_unauthorized'
    not_found:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_present:
              $ref: '#/components/examples/json_404_panui_mgmt_object_not_present'
    conflict_errors:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_object_not_unique'
            name_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_name_not_unique'
            reference_not_zero:
              $ref: '#/components/examples/json_409_panui_mgmt_reference_not_zero'
    bad_request_errors_basic:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            output_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_output_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
    default_errors:
      description: General Errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            version_not_supported:
              $ref: '#/components/examples/json_501_panui_restapi_version_not_supported'
            method_not_allowed:
              $ref: '#/components/examples/json_501_panui_restapi_method_not_supported'
            action_not_supported:
              $ref: '#/components/examples/json_405_panui_restapi_action_not_supported'
            bad_xpath:
              $ref: '#/components/examples/json_400_panui_mgmt_bad_xpath'
            invalid_command:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_command'
            malformed_command:
              $ref: '#/components/examples/json_400_panui_mgmt_malformed_command'
            session_timeout:
              $ref: '#/components/examples/json_504_panui_mgmt_session_timeout'
    auth_errors:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_not_authenticated:
              $ref: '#/components/examples/json_401_panui_auth_not_authenticated'
            invalid_credential:
              $ref: '#/components/examples/json_401_panui_auth_invalid_credential'
            key_too_long:
              $ref: '#/components/examples/json_401_panui_auth_key_too_long'
            key_expired:
              $ref: '#/components/examples/json_401_panui_auth_key_expired'
            need_password_change:
              $ref: '#/components/examples/json_401_panui_auth_need_password_change'
    bad_request_errors_basic_with_body:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            output_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_output_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
            missing_body:
              $ref: '#/components/examples/json_400_panui_restapi_missing_body'
            invalid_object:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_object'
    http_ok:
      description: OK
  parameters:
    name:
      name: name
      in: query
      description: The name of the configuration resource
      required: false
      schema:
        type: string
    uuid:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: The UUID of the resource
    offset:
      name: offset
      in: query
      description: The offset into the list of results returned
      required: false
      schema:
        type: integer
        default: 0
    limit:
      name: limit
      in: query
      description: The maximum number of results per page
      required: false
      schema:
        type: integer
        default: 200
    folder-mobileusers-required:
      name: folder
      in: query
      description: 'The folder in which the resource is defined

        '
      schema:
        enum:
        - Mobile Users
  securitySchemes:
    scmOAuth:
      type: oauth2
      description: "Strata Cloud Manager APIs authenticate client requests using the \nOAuth 2.0 Client Credentials flow.  Please use the `client_id`, \n`client_secret` values associated with an IAM service account along \nwith a scope value of `tsg_id:XXXXXXXXXX`, where `XXXXXXXXXX` is the \nTenant Service Group (TSG) ID.  The resulting JWT access token should \nbe attached to all API calls as a `Bearer` token in the `Authorization` \nheader (ex. `Authorization: Bearer tokenstring`).\n"
      flows:
        clientCredentials:
          tokenUrl: https://auth.apps.paloaltonetworks.com/oauth2/access_token
          scopes: {}
    scmToken:
      type: http
      description: "Strata Cloud Manager APIs authenticate client requests using the \nOAuth 2.0 Client Credentials flow.  Please use the `client_id`, \n`client_secret` values associated with an IAM service account along \nwith a scope value of `tsg_id:XXXXXXXXXX`, where `XXXXXXXXXX` is the \nTenant Service Group (TSG) ID.  The resulting JWT access token should \nbe attached to all API calls as a `Bearer` token in the `Authorization` \nheader (ex. `Authorization: Bearer tokenstring`).\n"
      scheme: bearer
      bearerFormat: JWT
x-internal: false
