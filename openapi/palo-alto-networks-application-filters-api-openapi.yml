  schemas:
    error_detail_cause_infos:
      type: array
      items:
        $ref: '#/components/schemas/error_detail_cause_info'
      x-examples: {}
    application-filters:
      type: object
      required:
      - name
      properties:
        id:
          type: string
          description: UUID of the resource
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          description: Alphanumeric string [ 0-9a-zA-Z._-]
          maxLength: 31
        category:
          type: array
          items:
            type: string
            maxLength: 128
            x-panMemberOf:
            - location: shared
              schema: content-preview/application-type/category
              subPath: name
        subcategory:
          type: array
          items:
            type: string
            maxLength: 128
            x-panMemberOf:
            - location: shared
              schema: content-preview/application-type/category/entry/subcategory
              subPath: name
        technology:
          type: array
          items:
            type: string
            maxLength: 128
            x-panMemberOf:
            - location: shared
              schema: content-preview/application-type/technology
              subPath: name
        evasive:
          type: boolean
          description: only True is a valid value
        excessive_bandwidth_use:
          type: boolean
          description: only True is a valid value
        used_by_malware:
          type: boolean
          description: only True is a valid value
        transfers_files:
          type: boolean
          description: only True is a valid value
        has_known_vulnerabilities:
          type: boolean
          description: only True is a valid value
        tunnels_other_apps:
          type: boolean
          description: only True is a valid value
        prone_to_misuse:
          type: boolean
          description: only True is a valid value
        pervasive:
          type: boolean
          description: only True is a valid value
        is_saas:
          type: boolean
          description: only True is a valid value
        new_appid:
          type: boolean
          description: only True is a valid value
        risk:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5
        saas_certifications:
          type: array
          items:
            type: string
            maxLength: 32
        saas_risk:
          type: array
          items:
            type: string
            maxLength: 32
        tagging:
          type: object
          oneOf:
          - type: object
            title: no_tag
            properties:
              no_tag:
                type: boolean
          - type: object
            title: tag
            properties:
              tag:
                type: array
                items:
                  type: string
                  maxLength: 127
                  x-panMemberOf:
                  - location: shared
                    schema: tag
                    subPath: name
        exclude:
          type: array
          items:
            type: string
            maxLength: 63
            x-panMemberOf:
            - location: shared
              schema: application
              subPath: name
            - location: shared
              schema: content-preview/application
              subPath: name
      oneOf:
      - type: object
        title: folder
        properties:
          folder:
            type: string
            pattern: ^[a-zA-Z\d\-_\. ]+$
            maxLength: 64
            description: The folder in which the resource is defined
            example: My Folder
        required:
        - folder
      - type: object
        title: snippet
        properties:
          snippet:
            type: string
            pattern: ^[a-zA-Z\d\-_\. ]+$
            maxLength: 64
            description: The snippet in which the resource is defined
            example: My Snippet
        required:
        - snippet
      - type: object
        title: device
        properties:
          device:
            type: string
            pattern: ^[a-zA-Z\d\-_\. ]+$
            maxLength: 64
            description: The device in which the resource is defined
            example: My Device
        required:
        - device
    generic_error:
      type: object
      properties:
        _errors:
          $ref: '#/components/schemas/error_detail_cause_infos'
        _request_id:
          type: string
      x-examples: {}
    error_detail_cause_info:
      type: object
      title: Cause Info
      properties:
        code:
          type: string
        message:
          type: string
        details:
          oneOf:
          - type: string
          - type: object
        help:
          type: string
    objects-application-filters:
      properties:
        category:
          items:
            maxLength: 128
            type: string
            x-panMemberOf:
            - location: shared
              schema: content-preview/application-type/category
              subPath: name
          type: array
        evasive:
          description: only True is a valid value
          type: boolean
        excessive_bandwidth_use:
          description: only True is a valid value
          type: boolean
        exclude:
          items:
            maxLength: 63
            type: string
            x-panMemberOf:
            - location: shared
              schema: application
              subPath: name
            - location: shared
              schema: content-preview/application
              subPath: name
          type: array
        has_known_vulnerabilities:
          description: only True is a valid value
          type: boolean
        id:
          description: uuid of the resource
          example: abcd-1234
          readOnly: true
          type: string
        is_saas:
          description: only True is a valid value
          type: boolean
        name:
          description: Alphanumeric string [ 0-9a-zA-Z._-]
          maxLength: 31
          type: string
        new_appid:
          description: only True is a valid value
          type: boolean
        pervasive:
          description: only True is a valid value
          type: boolean
        prone_to_misuse:
          description: only True is a valid value
          type: boolean
        risk:
          items:
            maximum: 5
            minimum: 1
            type: integer
          type: array
        saas_certifications:
          items:
            maxLength: 32
            type: string
          type: array
        saas_risk:
          items:
            maxLength: 32
            type: string
          type: array
        subcategory:
          items:
            maxLength: 128
            type: string
            x-panMemberOf:
            - location: shared
              schema: content-preview/application-type/category/entry/subcategory
              subPath: name
          type: array
        tagging:
          oneOf:
          - properties:
              no_tag:
                type: boolean
            title: no_tag
          - properties:
              tag:
                items:
                  maxLength: 127
                  type: string
                  x-panMemberOf:
                  - location: shared
                    schema: tag
                    subPath: name
                type: array
            title: tag
          type: object
        technology:
          items:
            maxLength: 128
            type: string
            x-panMemberOf:
            - location: shared
              schema: content-preview/application-type/technology
              subPath: name
          type: array
        transfers_files:
          description: only True is a valid value
          type: boolean
