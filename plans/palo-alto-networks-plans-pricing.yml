specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Palo Alto Networks
providerId: palo-alto-networks
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
notes: No public pricing — Palo Alto Networks sells PAN-OS, Prisma Cloud, Prisma SASE, Cortex
  XDR/XSOAR/XSIAM, and cloud-delivered security services through enterprise contracts. The
  pan.dev developer portal publishes APIs and SDKs but no rate cards. API access is bundled
  with the underlying product subscription.
tags:
  - Cybersecurity
  - Network Security
  - Cloud Security
  - SASE
  - SOAR
  - XDR
description: Palo Alto Networks API access is bundled into the parent product subscription
  (PAN-OS, Prisma Cloud, Prisma SASE, Cortex platform). There is no standalone API price
  list; pricing is enterprise-negotiated based on firewall count, protected workloads, seats,
  or data volume per product.
sources:
  - https://pan.dev/
plans:
  - id: palo-alto-networks-enterprise
    name: Enterprise (Per Product)
    type: enterprise
    description: Palo Alto Networks platform subscription. Pricing varies by product (firewalls,
      Prisma Cloud workloads, Cortex agents, SASE seats); APIs are included in the relevant
      product subscription. Contact sales.
    entries:
      - label: Product Subscription
        name: product_subscription
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: PAN-OS REST and XML APIs
      - name: Prisma Cloud APIs
      - name: Prisma SASE APIs
      - name: Cortex XDR / XSOAR / XSIAM APIs
      - name: Cloud-Delivered Security Services
maintainers:
