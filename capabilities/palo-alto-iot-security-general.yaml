naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks IoT Security API
  description: 'Palo Alto Networks IoT Security API. 1 operations. Lead operation: Palo Alto Networks List Device Tags. Self-contained
    Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-iot-security-general
    baseUri: https://{customer}.iot.paloaltonetworks.com/pub/v4.0
    description: Palo Alto Networks IoT Security API business capability. Self-contained, no shared references.
    resources:
    - name: device-tag-list
      path: /device/tag/list
      operations:
      - name: listdevicetags
        method: GET
        description: Palo Alto Networks List Device Tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: customerid
          in: query
          type: string
          description: Customer tenant identifier.
          required: true
        - name: offset
          in: query
          type: integer
          description: Pagination offset for results.
        - name: pagelength
          in: query
          type: integer
          description: Number of tags to return per page.
    authentication:
      type: apikey
      key: X-Key-Id
      value: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: palo-alto-iot-security-general-rest
    port: 8080
    description: REST adapter for Palo Alto Networks IoT Security API. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/device/tag/list
      name: device-tag-list
      description: REST surface for device-tag-list.
      operations:
      - method: GET
        name: listdevicetags
        description: Palo Alto Networks List Device Tags
        call: palo-alto-iot-security-general.listdevicetags
        with:
          customerid: rest.customerid
          offset: rest.offset
          pagelength: rest.pagelength
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-iot-security-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks IoT Security API. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-device
      description: Palo Alto Networks List Device Tags
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-iot-security-general.listdevicetags
      with:
        customerid: tools.customerid
        offset: tools.offset
        pagelength: tools.pagelength
      outputParameters:
      - type: object
        mapping: $.
