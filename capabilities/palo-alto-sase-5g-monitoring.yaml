naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks SASE 5G Managed Services API — Monitoring
  description: 'Palo Alto Networks SASE 5G Managed Services API — Monitoring. 1 operations. Lead operation: Palo Alto Networks
    Get 5G Security Metrics. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Monitoring
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-sase-5g-monitoring
    baseUri: https://api.sase.paloaltonetworks.com/5g/v1
    description: Palo Alto Networks SASE 5G Managed Services API — Monitoring business capability. Self-contained, no shared
      references.
    resources:
    - name: monitoring-metrics
      path: /monitoring/metrics
      operations:
      - name: get5gsecuritymetrics
        method: GET
        description: Palo Alto Networks Get 5G Security Metrics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: slice_id
          in: query
          type: string
          description: Filter metrics by network slice.
        - name: start_time
          in: query
          type: string
          description: Start of the metrics period (ISO 8601).
        - name: end_time
          in: query
          type: string
          description: End of the metrics period (ISO 8601).
        - name: interval
          in: query
          type: string
          description: Metrics aggregation interval.
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-sase-5g-monitoring-rest
    port: 8080
    description: REST adapter for Palo Alto Networks SASE 5G Managed Services API — Monitoring. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/monitoring/metrics
      name: monitoring-metrics
      description: REST surface for monitoring-metrics.
      operations:
      - method: GET
        name: get5gsecuritymetrics
        description: Palo Alto Networks Get 5G Security Metrics
        call: palo-alto-sase-5g-monitoring.get5gsecuritymetrics
        with:
          slice_id: rest.slice_id
          start_time: rest.start_time
          end_time: rest.end_time
          interval: rest.interval
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-sase-5g-monitoring-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks SASE 5G Managed Services API — Monitoring. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-5g
      description: Palo Alto Networks Get 5G Security Metrics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-sase-5g-monitoring.get5gsecuritymetrics
      with:
        slice_id: tools.slice_id
        start_time: tools.start_time
        end_time: tools.end_time
        interval: tools.interval
      outputParameters:
      - type: object
        mapping: $.
