    namespace: palo-alto-cortex-xpanse-ipranges-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Cortex Xpanse REST API — IPRanges. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/ip-range/get-owned-ip-ranges
      name: ip-range-get-owned-ip-ranges
      description: REST surface for ip_range-get_owned_ip_ranges.
      operations:
      - method: POST
        name: getownedipranges
        description: Palo Alto Networks Get Owned IP Ranges
        call: palo-alto-cortex-xpanse-ipranges.getownedipranges
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-cortex-xpanse-ipranges-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Cortex Xpanse REST API — IPRanges. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-owned
      description: Palo Alto Networks Get Owned IP Ranges
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: palo-alto-cortex-xpanse-ipranges.getownedipranges
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
