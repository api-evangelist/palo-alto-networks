  - type: http
    namespace: palo-alto-cortex-xpanse-ipranges
    baseUri: https://api-{fqdn}/public_api/v1
    description: Palo Alto Networks Cortex Xpanse REST API — IPRanges business capability. Self-contained, no shared references.
    resources:
    - name: ip_range-get_owned_ip_ranges
      path: /ip_range/get_owned_ip_ranges
      operations:
      - name: getownedipranges
        method: POST
        description: Palo Alto Networks Get Owned IP Ranges
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: x-xdr-hmac-v2
      value: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
      placement: header
  exposes:
