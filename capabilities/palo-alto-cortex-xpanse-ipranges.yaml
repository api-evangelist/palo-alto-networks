naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Cortex Xpanse REST API — IPRanges
  description: 'Palo Alto Networks Cortex Xpanse REST API — IPRanges. 1 operations. Lead operation: Palo Alto Networks Get
    Owned IP Ranges. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - IPRanges
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
