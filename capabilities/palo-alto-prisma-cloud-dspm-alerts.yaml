naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma Cloud DSPM API — Alerts
  description: 'Palo Alto Networks Prisma Cloud DSPM API — Alerts. 1 operations. Lead operation: Palo Alto Networks List Data
    Security Alerts. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Alerts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-prisma-cloud-dspm-alerts
    baseUri: https://api.prismacloud.io
    description: Palo Alto Networks Prisma Cloud DSPM API — Alerts business capability. Self-contained, no shared references.
    resources:
    - name: dspm-api-v1-alerts
      path: /dspm/api/v1/alerts
      operations:
      - name: listdatasecurityalerts
        method: GET
        description: Palo Alto Networks List Data Security Alerts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: offset
          in: query
          type: integer
          description: Number of records to skip for pagination.
        - name: limit
          in: query
          type: integer
          description: Maximum number of records to return.
        - name: severity
          in: query
          type: string
          description: Filter alerts by severity level.
        - name: status
          in: query
          type: string
          description: Filter by alert status.
        - name: cloudProvider
          in: query
          type: string
          description: Filter by cloud provider.
        - name: start_time
          in: query
          type: string
          description: Start of time range filter (ISO 8601 format).
        - name: end_time
          in: query
          type: string
          description: End of time range filter (ISO 8601 format).
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-prisma-cloud-dspm-alerts-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma Cloud DSPM API — Alerts. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/dspm/api/v1/alerts
      name: dspm-api-v1-alerts
      description: REST surface for dspm-api-v1-alerts.
      operations:
      - method: GET
        name: listdatasecurityalerts
        description: Palo Alto Networks List Data Security Alerts
        call: palo-alto-prisma-cloud-dspm-alerts.listdatasecurityalerts
        with:
          offset: rest.offset
          limit: rest.limit
          severity: rest.severity
          status: rest.status
          cloudProvider: rest.cloudProvider
          start_time: rest.start_time
          end_time: rest.end_time
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-prisma-cloud-dspm-alerts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Prisma Cloud DSPM API — Alerts. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-data
      description: Palo Alto Networks List Data Security Alerts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-cloud-dspm-alerts.listdatasecurityalerts
      with:
        offset: tools.offset
        limit: tools.limit
        severity: tools.severity
        status: tools.status
        cloudProvider: tools.cloudProvider
        start_time: tools.start_time
        end_time: tools.end_time
      outputParameters:
      - type: object
        mapping: $.
