    description: Palo Alto Networks Prisma Cloud Code Security API — Scans business capability. Self-contained, no shared
      references.
    resources:
    - name: scans
      path: /scans
      operations:
      - name: triggerscan
        method: POST
        description: Palo Alto Networks Trigger a Scan
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: scans-integrations
      path: /scans/integrations
      operations:
      - name: listscanintegrations
        method: GET
        description: Palo Alto Networks List CI/CD Scan Integrations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: offset
          in: query
          type: integer
          description: Number of records to skip for pagination.
        - name: limit
          in: query
          type: integer
          description: Maximum number of records to return.
