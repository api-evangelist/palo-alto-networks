        mapping: $.
    - name: palo-alto-networks-get-scan
      description: Palo Alto Networks Get Scan Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-cloud-code-security-scans.getscanstatus
      with:
        scan_id: tools.scan_id
      outputParameters:
      - type: object
        mapping: $.
