    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Prisma Cloud Code Security API — Scans. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-trigger-scan
      description: Palo Alto Networks Trigger a Scan
      hints:
