  exposes:
  - type: rest
    namespace: palo-alto-prisma-cloud-code-security-scans-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma Cloud Code Security API — Scans. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/scans
      name: scans
      description: REST surface for scans.
      operations:
      - method: POST
        name: triggerscan
        description: Palo Alto Networks Trigger a Scan
        call: palo-alto-prisma-cloud-code-security-scans.triggerscan
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/scans/integrations
