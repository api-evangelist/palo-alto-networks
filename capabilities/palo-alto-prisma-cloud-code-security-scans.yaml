naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma Cloud Code Security API — Scans
  description: 'Palo Alto Networks Prisma Cloud Code Security API — Scans. 3 operations. Lead operation: Palo Alto Networks
