naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Strata Cloud Manager API — Configuration
  description: 'Palo Alto Networks Strata Cloud Manager API — Configuration. 1 operations. Lead operation: Palo Alto Networks
    Push Candidate Configuration. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Configuration
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-strata-cloud-manager-configuration
    baseUri: https://api.strata.paloaltonetworks.com
    description: Palo Alto Networks Strata Cloud Manager API — Configuration business capability. Self-contained, no shared
      references.
    resources:
    - name: sse-config-v1-config-versions-candidate:push
      path: /sse/config/v1/config-versions/candidate:push
      operations:
      - name: pushcandidateconfig
        method: POST
        description: Palo Alto Networks Push Candidate Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-strata-cloud-manager-configuration-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Strata Cloud Manager API — Configuration. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sse/config/v1/config-versions/candidate-push
      name: sse-config-v1-config-versions-candidate-push
      description: REST surface for sse-config-v1-config-versions-candidate:push.
      operations:
      - method: POST
        name: pushcandidateconfig
        description: Palo Alto Networks Push Candidate Configuration
        call: palo-alto-strata-cloud-manager-configuration.pushcandidateconfig
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-strata-cloud-manager-configuration-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Strata Cloud Manager API — Configuration. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-push-candidate
      description: Palo Alto Networks Push Candidate Configuration
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-strata-cloud-manager-configuration.pushcandidateconfig
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
