naftiko: 1.0.0-alpha2
info:
  label: SASE 5G Monitor Service API — Configured UE Mappings
  description: 'SASE 5G Monitor Service API — Configured UE Mappings. 1 operations. Lead operation: Palo Alto Networks Verify
    Configured Mappings. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Configured UE Mappings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-sase-5g-monitor-configured-ue-mappings
    baseUri: https://stratacloudmanager.paloaltonetworks.com
    description: SASE 5G Monitor Service API — Configured UE Mappings business capability. Self-contained, no shared references.
    resources:
    - name: mt-monitor-5g-mapping-configuredUEs
      path: /mt/monitor/5g/mapping/configuredUEs
      operations:
      - name: getmtmonitor5gmappingconfiguredues
        method: GET
        description: Palo Alto Networks Verify Configured Mappings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: palo-alto-sase-5g-monitor-configured-ue-mappings-rest
    port: 8080
    description: REST adapter for SASE 5G Monitor Service API — Configured UE Mappings. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/mt/monitor/5g/mapping/configuredues
      name: mt-monitor-5g-mapping-configuredues
      description: REST surface for mt-monitor-5g-mapping-configuredUEs.
      operations:
      - method: GET
        name: getmtmonitor5gmappingconfiguredues
        description: Palo Alto Networks Verify Configured Mappings
        call: palo-alto-sase-5g-monitor-configured-ue-mappings.getmtmonitor5gmappingconfiguredues
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-sase-5g-monitor-configured-ue-mappings-mcp
    port: 9090
    transport: http
    description: MCP adapter for SASE 5G Monitor Service API — Configured UE Mappings. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-verify-configured
      description: Palo Alto Networks Verify Configured Mappings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-sase-5g-monitor-configured-ue-mappings.getmtmonitor5gmappingconfiguredues
      outputParameters:
      - type: object
        mapping: $.
