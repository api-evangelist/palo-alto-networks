naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks SASE Subscription Service API — Subscriptions
  description: 'Palo Alto Networks SASE Subscription Service API — Subscriptions. 4 operations. Lead operation: Palo Alto
    Networks List Subscriptions for TSG. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Subscriptions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-sase-subscription-subscriptions
    baseUri: https://api.sase.paloaltonetworks.com/subscription/v1
    description: Palo Alto Networks SASE Subscription Service API — Subscriptions business capability. Self-contained, no
      shared references.
    resources:
    - name: subscriptions
      path: /subscriptions
      operations:
      - name: listsubscriptions
        method: GET
        description: Palo Alto Networks List Subscriptions for TSG
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tsg_id
          in: query
          type: string
          description: Tenant Service Group ID for which to list subscriptions.
          required: true
        - name: product
          in: query
          type: string
          description: Filter subscriptions by product name.
        - name: status
          in: query
          type: string
          description: Filter subscriptions by status.
    - name: subscriptions-subscription_id
      path: /subscriptions/{subscription_id}
      operations:
      - name: getsubscription
        method: GET
        description: Palo Alto Networks Get Subscription Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: subscription_id
          in: path
          type: string
          description: Unique identifier of the subscription.
          required: true
    - name: subscriptions-subscription_id-allocation
      path: /subscriptions/{subscription_id}/allocation
      operations:
      - name: allocatelicenses
        method: PUT
        description: Palo Alto Networks Allocate Licenses
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: subscription_id
          in: path
          type: string
          description: Unique identifier of the subscription to allocate from.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: subscriptions-subscription_id-entitlements
      path: /subscriptions/{subscription_id}/entitlements
      operations:
      - name: getsubscriptionentitlements
        method: GET
        description: Palo Alto Networks Get Subscription Entitlement Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: subscription_id
          in: path
          type: string
          description: Unique identifier of the subscription.
          required: true
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-sase-subscription-subscriptions-rest
    port: 8080
    description: REST adapter for Palo Alto Networks SASE Subscription Service API — Subscriptions. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/subscriptions
      name: subscriptions
      description: REST surface for subscriptions.
      operations:
      - method: GET
        name: listsubscriptions
        description: Palo Alto Networks List Subscriptions for TSG
        call: palo-alto-sase-subscription-subscriptions.listsubscriptions
        with:
          tsg_id: rest.tsg_id
          product: rest.product
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/subscriptions/{subscription-id}
      name: subscriptions-subscription-id
      description: REST surface for subscriptions-subscription_id.
      operations:
      - method: GET
        name: getsubscription
        description: Palo Alto Networks Get Subscription Details
        call: palo-alto-sase-subscription-subscriptions.getsubscription
        with:
          subscription_id: rest.subscription_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/subscriptions/{subscription-id}/allocation
      name: subscriptions-subscription-id-allocation
      description: REST surface for subscriptions-subscription_id-allocation.
      operations:
      - method: PUT
        name: allocatelicenses
        description: Palo Alto Networks Allocate Licenses
        call: palo-alto-sase-subscription-subscriptions.allocatelicenses
        with:
          subscription_id: rest.subscription_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/subscriptions/{subscription-id}/entitlements
      name: subscriptions-subscription-id-entitlements
      description: REST surface for subscriptions-subscription_id-entitlements.
      operations:
      - method: GET
        name: getsubscriptionentitlements
        description: Palo Alto Networks Get Subscription Entitlement Details
        call: palo-alto-sase-subscription-subscriptions.getsubscriptionentitlements
        with:
          subscription_id: rest.subscription_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-sase-subscription-subscriptions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks SASE Subscription Service API — Subscriptions. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-subscriptions
      description: Palo Alto Networks List Subscriptions for TSG
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-sase-subscription-subscriptions.listsubscriptions
      with:
        tsg_id: tools.tsg_id
        product: tools.product
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-get-subscription
      description: Palo Alto Networks Get Subscription Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-sase-subscription-subscriptions.getsubscription
      with:
        subscription_id: tools.subscription_id
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-allocate-licenses
      description: Palo Alto Networks Allocate Licenses
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: palo-alto-sase-subscription-subscriptions.allocatelicenses
      with:
        subscription_id: tools.subscription_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-get-subscription-2
      description: Palo Alto Networks Get Subscription Entitlement Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-sase-subscription-subscriptions.getsubscriptionentitlements
      with:
        subscription_id: tools.subscription_id
      outputParameters:
      - type: object
        mapping: $.
