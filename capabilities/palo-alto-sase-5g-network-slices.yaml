    baseUri: https://api.sase.paloaltonetworks.com/5g/v1
    description: Palo Alto Networks SASE 5G Managed Services API — Network Slices business capability. Self-contained, no
      shared references.
    resources:
    - name: network-slices
      path: /network-slices
      operations:
      - name: listnetworkslices
        method: GET
        description: Palo Alto Networks List 5G Network Slices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter slices by status.
        - name: slice_type
          in: query
          type: string
          description: Filter by slice type (SST values).
        - name: offset
          in: query
          type: integer
          description: Number of results to skip for pagination.
        - name: limit
          in: query
          type: integer
          description: Maximum number of network slices to return.
      - name: createnetworkslice
        method: POST
        description: Palo Alto Networks Create 5G Network Slice
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: network-slices-slice_id
      path: /network-slices/{slice_id}
      operations:
      - name: getnetworkslice
        method: GET
        description: Palo Alto Networks Get 5G Network Slice
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: slice_id
          in: path
          type: string
          description: Unique identifier of the network slice.
          required: true
      - name: updatenetworkslice
        method: PUT
        description: Palo Alto Networks Update 5G Network Slice
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: slice_id
          in: path
          type: string
          description: Unique identifier of the network slice to update.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletenetworkslice
        method: DELETE
        description: Palo Alto Networks Delete 5G Network Slice
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: slice_id
          in: path
          type: string
          description: Unique identifier of the network slice to delete.
          required: true
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-sase-5g-network-slices-rest
    port: 8080
    description: REST adapter for Palo Alto Networks SASE 5G Managed Services API — Network Slices. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/network-slices
      name: network-slices
      description: REST surface for network-slices.
      operations:
      - method: GET
        name: listnetworkslices
        description: Palo Alto Networks List 5G Network Slices
        call: palo-alto-sase-5g-network-slices.listnetworkslices
        with:
          status: rest.status
          slice_type: rest.slice_type
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createnetworkslice
        description: Palo Alto Networks Create 5G Network Slice
        call: palo-alto-sase-5g-network-slices.createnetworkslice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/network-slices/{slice-id}
      name: network-slices-slice-id
      description: REST surface for network-slices-slice_id.
      operations:
      - method: GET
        name: getnetworkslice
        description: Palo Alto Networks Get 5G Network Slice
        call: palo-alto-sase-5g-network-slices.getnetworkslice
        with:
          slice_id: rest.slice_id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatenetworkslice
        description: Palo Alto Networks Update 5G Network Slice
        call: palo-alto-sase-5g-network-slices.updatenetworkslice
        with:
          slice_id: rest.slice_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletenetworkslice
        description: Palo Alto Networks Delete 5G Network Slice
        call: palo-alto-sase-5g-network-slices.deletenetworkslice
        with:
          slice_id: rest.slice_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-sase-5g-network-slices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks SASE 5G Managed Services API — Network Slices. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-5g
      description: Palo Alto Networks List 5G Network Slices
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-sase-5g-network-slices.listnetworkslices
      with:
        status: tools.status
        slice_type: tools.slice_type
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
