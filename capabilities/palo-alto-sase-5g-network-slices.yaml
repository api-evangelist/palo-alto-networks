      - type: object
        mapping: $.
    - name: palo-alto-networks-update-5g
      description: Palo Alto Networks Update 5G Network Slice
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: palo-alto-sase-5g-network-slices.updatenetworkslice
      with:
        slice_id: tools.slice_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-delete-5g
