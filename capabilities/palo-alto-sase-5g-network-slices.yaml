naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks SASE 5G Managed Services API — Network Slices
  description: 'Palo Alto Networks SASE 5G Managed Services API — Network Slices. 5 operations. Lead operation: Palo Alto
    Networks List 5G Network Slices. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Network Slices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
