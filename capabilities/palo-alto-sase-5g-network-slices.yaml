        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-sase-5g-network-slices.createnetworkslice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-get-5g
      description: Palo Alto Networks Get 5G Network Slice
