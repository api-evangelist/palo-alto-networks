naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Cloud NGFW for AWS REST API — FQDNLists
  description: 'Palo Alto Networks Cloud NGFW for AWS REST API — FQDNLists. 2 operations. Lead operation: Palo Alto Networks
    List FQDN Lists. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - FQDNLists
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-cloud-ngfw-fqdnlists
    baseUri: https://api.{region}.aws.cloudngfw.paloaltonetworks.com/v1
    description: Palo Alto Networks Cloud NGFW for AWS REST API — FQDNLists business capability. Self-contained, no shared
      references.
    resources:
    - name: config-rulestacks-rulestack-fqdnlists
      path: /config/rulestacks/{rulestack}/fqdnlists
      operations:
      - name: listfqdnlists
        method: GET
        description: Palo Alto Networks List FQDN Lists
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: maxresults
          in: query
          type: integer
        - name: nexttoken
          in: query
          type: string
      - name: createfqdnlist
        method: POST
        description: Palo Alto Networks Create FQDN List
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: palo-alto-cloud-ngfw-fqdnlists-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Cloud NGFW for AWS REST API — FQDNLists. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/config/rulestacks/{rulestack}/fqdnlists
      name: config-rulestacks-rulestack-fqdnlists
      description: REST surface for config-rulestacks-rulestack-fqdnlists.
      operations:
      - method: GET
        name: listfqdnlists
        description: Palo Alto Networks List FQDN Lists
        call: palo-alto-cloud-ngfw-fqdnlists.listfqdnlists
        with:
          maxresults: rest.maxresults
          nexttoken: rest.nexttoken
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createfqdnlist
        description: Palo Alto Networks Create FQDN List
        call: palo-alto-cloud-ngfw-fqdnlists.createfqdnlist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-cloud-ngfw-fqdnlists-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Cloud NGFW for AWS REST API — FQDNLists. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-fqdn
      description: Palo Alto Networks List FQDN Lists
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-cloud-ngfw-fqdnlists.listfqdnlists
      with:
        maxresults: tools.maxresults
        nexttoken: tools.nexttoken
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-create-fqdn
      description: Palo Alto Networks Create FQDN List
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-cloud-ngfw-fqdnlists.createfqdnlist
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
