naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks ZTNA Connector API — Licenses
  description: 'Palo Alto Networks ZTNA Connector API — Licenses. 1 operations. Lead operation: Palo Alto Networks Get ZTNA
    License Information. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Licenses
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-ztna-connector-licenses
    baseUri: https://api.sase.paloaltonetworks.com/ztna
    description: Palo Alto Networks ZTNA Connector API — Licenses business capability. Self-contained, no shared references.
    resources:
    - name: v2-licenses
      path: /v2/licenses
      operations:
      - name: getztnalicenses
        method: GET
        description: Palo Alto Networks Get ZTNA License Information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-ztna-connector-licenses-rest
    port: 8080
    description: REST adapter for Palo Alto Networks ZTNA Connector API — Licenses. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v2/licenses
      name: v2-licenses
      description: REST surface for v2-licenses.
      operations:
      - method: GET
        name: getztnalicenses
        description: Palo Alto Networks Get ZTNA License Information
        call: palo-alto-ztna-connector-licenses.getztnalicenses
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-ztna-connector-licenses-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks ZTNA Connector API — Licenses. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-ztna
      description: Palo Alto Networks Get ZTNA License Information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-ztna-connector-licenses.getztnalicenses
      outputParameters:
      - type: object
        mapping: $.
