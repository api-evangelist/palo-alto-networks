    resources:
    - path: /v1/mt/monitor/5g/mapping/unknownues
      name: mt-monitor-5g-mapping-unknownues
      description: REST surface for mt-monitor-5g-mapping-unknownUEs.
      operations:
      - method: GET
        name: getmtmonitor5gmappingunknownues
        description: Palo Alto Networks Detect Unconfigured Subscribers
        call: palo-alto-sase-5g-monitor-unknown-ue-mappings.getmtmonitor5gmappingunknownues
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
