    port: 9090
    transport: http
    description: MCP adapter for SASE 5G Monitor Service API — Unknown UE Mappings. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-detect-unconfigured
      description: Palo Alto Networks Detect Unconfigured Subscribers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-sase-5g-monitor-unknown-ue-mappings.getmtmonitor5gmappingunknownues
      outputParameters:
      - type: object
        mapping: $.
