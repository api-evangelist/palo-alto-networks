  description: 'SASE 5G Monitor Service API — Unknown UE Mappings. 1 operations. Lead operation: Palo Alto Networks Detect
    Unconfigured Subscribers. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Unknown UE Mappings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-sase-5g-monitor-unknown-ue-mappings
    baseUri: https://stratacloudmanager.paloaltonetworks.com
    description: SASE 5G Monitor Service API — Unknown UE Mappings business capability. Self-contained, no shared references.
    resources:
    - name: mt-monitor-5g-mapping-unknownUEs
      path: /mt/monitor/5g/mapping/unknownUEs
      operations:
      - name: getmtmonitor5gmappingunknownues
        method: GET
        description: Palo Alto Networks Detect Unconfigured Subscribers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: palo-alto-sase-5g-monitor-unknown-ue-mappings-rest
