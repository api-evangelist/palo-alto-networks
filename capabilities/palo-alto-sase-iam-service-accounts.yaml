    resources:
    - name: service-accounts
      path: /service-accounts
      operations:
      - name: listserviceaccounts
        method: GET
        description: Palo Alto Networks List Service Accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tsg_id
          in: query
          type: string
          description: Filter service accounts by Tenant Service Group ID.
        - name: offset
          in: query
          type: integer
          description: Number of results to skip for pagination.
        - name: limit
          in: query
          type: integer
          description: Maximum number of service accounts to return.
      - name: createserviceaccount
        method: POST
        description: Palo Alto Networks Create Service Account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: service-accounts-id
      path: /service-accounts/{id}
      operations:
      - name: getserviceaccount
        method: GET
        description: Palo Alto Networks Get Service Account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Unique identifier of the service account.
          required: true
      - name: updateserviceaccount
        method: PUT
        description: Palo Alto Networks Update Service Account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Unique identifier of the service account to update.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteserviceaccount
        method: DELETE
        description: Palo Alto Networks Delete Service Account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Unique identifier of the service account to delete.
          required: true
