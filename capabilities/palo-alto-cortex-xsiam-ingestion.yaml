naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Cortex XSIAM REST API — Ingestion
  description: 'Palo Alto Networks Cortex XSIAM REST API — Ingestion. 1 operations. Lead operation: Palo Alto Networks Configure
    Data Source. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Ingestion
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-cortex-xsiam-ingestion
    baseUri: https://api-{fqdn}/public_api/v1
    description: Palo Alto Networks Cortex XSIAM REST API — Ingestion business capability. Self-contained, no shared references.
    resources:
    - name: ingestion-datasources
      path: /ingestion/datasources
      operations:
      - name: configuredatasource
        method: POST
        description: Palo Alto Networks Configure Data Source
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: x-xdr-hmac-v2
      value: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: palo-alto-cortex-xsiam-ingestion-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Cortex XSIAM REST API — Ingestion. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/ingestion/datasources
      name: ingestion-datasources
      description: REST surface for ingestion-datasources.
      operations:
      - method: POST
        name: configuredatasource
        description: Palo Alto Networks Configure Data Source
        call: palo-alto-cortex-xsiam-ingestion.configuredatasource
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-cortex-xsiam-ingestion-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Cortex XSIAM REST API — Ingestion. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-configure-data
      description: Palo Alto Networks Configure Data Source
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-cortex-xsiam-ingestion.configuredatasource
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
