naftiko: 1.0.0-alpha2
info:
  label: SASE 5G Monitor Service API — Active Mappings
  description: 'SASE 5G Monitor Service API — Active Mappings. 1 operations. Lead operation: Palo Alto Networks Check Active
    Mappings. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Active Mappings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-sase-5g-monitor-active-mappings
    baseUri: https://stratacloudmanager.paloaltonetworks.com
    description: SASE 5G Monitor Service API — Active Mappings business capability. Self-contained, no shared references.
    resources:
    - name: mt-monitor-5g-mapping-activeUEs
      path: /mt/monitor/5g/mapping/activeUEs
      operations:
      - name: getmtmonitor5gmappingactiveues
        method: GET
        description: Palo Alto Networks Check Active Mappings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: palo-alto-sase-5g-monitor-active-mappings-rest
    port: 8080
    description: REST adapter for SASE 5G Monitor Service API — Active Mappings. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/mt/monitor/5g/mapping/activeues
      name: mt-monitor-5g-mapping-activeues
      description: REST surface for mt-monitor-5g-mapping-activeUEs.
      operations:
      - method: GET
        name: getmtmonitor5gmappingactiveues
        description: Palo Alto Networks Check Active Mappings
        call: palo-alto-sase-5g-monitor-active-mappings.getmtmonitor5gmappingactiveues
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-sase-5g-monitor-active-mappings-mcp
    port: 9090
    transport: http
    description: MCP adapter for SASE 5G Monitor Service API — Active Mappings. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: palo-alto-networks-check-active
      description: Palo Alto Networks Check Active Mappings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-sase-5g-monitor-active-mappings.getmtmonitor5gmappingactiveues
      outputParameters:
      - type: object
        mapping: $.
