naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Monitoring and Observability
  description: Unified monitoring and observability capability for tracking digital experience, aggregating security data,
    managing log forwarding, and running best practice assessments across Autonomous DEM, SASE Aggregate Monitoring, Strata
    Logging Service, and AIOps BPA APIs.
  tags:
  - Palo Alto Networks
  - Monitoring
  - Observability
  - Logging
  - Digital Experience
  - Best Practice Assessment
  - Notifications
  created: '2026-04-16'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    PALO_ALTO_OAUTH_TOKEN: PALO_ALTO_OAUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: autonomous-dem
    baseUri: https://api.sase.paloaltonetworks.com
    description: Palo Alto Networks Autonomous DEM API for monitoring digital experience across applications and agents.
    authentication:
      type: bearer
      token: '{{PALO_ALTO_OAUTH_TOKEN}}'
    resources:
    - name: application-scores
      path: /mt/monitor/adem/v1/applications/scores
      description: Application experience scores.
      operations:
      - name: get-application-scores
        method: GET
        description: Get application experience scores.
        inputParameters:
        - name: start_time
          in: query
          type: string
          required: false
          description: Start time for the query range.
        - name: end_time
          in: query
          type: string
          required: false
          description: End time for the query range.
        - name: offset
          in: query
          type: integer
          required: false
          description: Pagination offset.
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of results to return.
        outputRawFormat: json
        outputParameters:
        - name: scores
          type: array
          value: $.scores
    - name: agent-scores
      path: /mt/monitor/adem/v1/agents/scores
      description: Agent and endpoint scores.
      operations:
      - name: get-agent-scores
        method: GET
        description: Get agent and endpoint scores.
        inputParameters:
        - name: start_time
          in: query
          type: string
          required: false
          description: Start time for the query range.
        - name: end_time
          in: query
          type: string
          required: false
          description: End time for the query range.
        - name: offset
          in: query
          type: integer
          required: false
          description: Pagination offset.
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of results to return.
        outputRawFormat: json
        outputParameters:
        - name: scores
          type: array
          value: $.scores
    - name: test-results
      path: /mt/monitor/adem/v1/tests
      description: Synthetic test results.
      operations:
      - name: get-test-results
        method: GET
        description: Get synthetic test results.
        inputParameters:
        - name: test_id
          in: path
          type: string
          required: true
          description: The ID of the test.
        - name: start_time
          in: query
          type: string
          required: false
          description: Start time for the query range.
        - name: end_time
          in: query
          type: string
          required: false
          description: End time for the query range.
        outputRawFormat: json
        outputParameters:
        - name: results
          type: array
          value: $.results
    - name: applications
      path: /mt/monitor/adem/v1/applications
      description: Monitored applications.
      operations:
      - name: list-monitored-applications
        method: GET
        description: List monitored applications.
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
          description: Pagination offset.
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of results to return.
        outputRawFormat: json
        outputParameters:
        - name: applications
          type: array
          value: $.applications
    - name: agents
      path: /mt/monitor/adem/v1/agents
      description: Monitored agents.
      operations:
      - name: list-monitored-agents
        method: GET
        description: List monitored agents.
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
          description: Pagination offset.
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of results to return.
        outputRawFormat: json
        outputParameters:
        - name: agents
          type: array
          value: $.agents
    - name: metrics
      path: /mt/monitor/adem/v1/metrics
      description: Performance metrics.
      operations:
      - name: get-performance-metrics
        method: GET
        description: Get performance metrics.
        inputParameters:
        - name: start_time
          in: query
          type: string
          required: false
          description: Start time for the query range.
        - name: end_time
          in: query
          type: string
          required: false
          description: End time for the query range.
        - name: metric_type
          in: query
          type: string
          required: false
          description: The type of metric to retrieve.
        - name: granularity
          in: query
          type: string
          required: false
          description: The granularity of the metrics.
        outputRawFormat: json
        outputParameters:
        - name: metrics
          type: array
          value: $.metrics
  - type: http
    namespace: sase-aggregate-monitoring
    baseUri: https://api.sase.paloaltonetworks.com/mt/monitor/v1
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_OAUTH_TOKEN}}'
    resources:
    - name: aggregate-queries
      path: /agg/query
      operations:
      - name: query-threat-data
        method: POST
        description: Query aggregated threat monitoring data with filters, time ranges, and grouping.
        path: /threat
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            tsg_id: '{{tools.tsg_id}}'
            filter: '{{tools.filter}}'
            time_range: '{{tools.time_range}}'
            count: '{{tools.count}}'
            histogram: '{{tools.histogram}}'
            group_by: '{{tools.group_by}}'
            sort: '{{tools.sort}}'
      - name: query-url-data
        method: POST
        description: Query aggregated URL monitoring data with filters, time ranges, and grouping.
        path: /url
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            tsg_id: '{{tools.tsg_id}}'
            filter: '{{tools.filter}}'
            time_range: '{{tools.time_range}}'
            count: '{{tools.count}}'
            histogram: '{{tools.histogram}}'
            group_by: '{{tools.group_by}}'
            sort: '{{tools.sort}}'
      - name: query-application-data
        method: POST
        description: Query aggregated application monitoring data with filters, time ranges, and grouping.
        path: /application
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            tsg_id: '{{tools.tsg_id}}'
            filter: '{{tools.filter}}'
            time_range: '{{tools.time_range}}'
            count: '{{tools.count}}'
            histogram: '{{tools.histogram}}'
            group_by: '{{tools.group_by}}'
            sort: '{{tools.sort}}'
      - name: query-bandwidth-data
        method: POST
        description: Query aggregated bandwidth monitoring data with filters, time ranges, and grouping.
        path: /bandwidth
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            tsg_id: '{{tools.tsg_id}}'
            filter: '{{tools.filter}}'
            time_range: '{{tools.time_range}}'
            count: '{{tools.count}}'
            histogram: '{{tools.histogram}}'
            group_by: '{{tools.group_by}}'
            sort: '{{tools.sort}}'
      - name: query-license-data
        method: POST
        description: Query aggregated license monitoring data with filters, time ranges, and grouping.
        path: /license
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            tsg_id: '{{tools.tsg_id}}'
            filter: '{{tools.filter}}'
            time_range: '{{tools.time_range}}'
            count: '{{tools.count}}'
            histogram: '{{tools.histogram}}'
            group_by: '{{tools.group_by}}'
            sort: '{{tools.sort}}'
    - name: tenants
      path: /tenants
      operations:
      - name: list-monitoring-tenants
        method: GET
        description: List all tenants available for monitoring.
        inputParameters:
        - name: tsg_id
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: strata-logging-service
    baseUri: https://api.sase.paloaltonetworks.com/logging-service/v1
    description: Strata Logging Service API for managing log forwarding profiles and their syslog, HTTPS, and email destinations.
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_OAUTH_TOKEN}}'
    resources:
    - name: log-forwarding-profiles
      path: /log-forwarding-profiles
      operations:
      - name: list-log-forwarding-profiles
        method: GET
        description: List all log forwarding profiles.
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-log-forwarding-profile
        method: POST
        description: Create a new log forwarding profile.
        inputParameters:
        - name: name
          in: body
          type: string
          required: true
        - name: log_types
          in: body
          type: object
          required: true
        - name: description
          in: body
          type: string
          required: false
        - name: enabled
          in: body
          type: boolean
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            log_types: '{{tools.log_types}}'
            description: '{{tools.description}}'
            enabled: '{{tools.enabled}}'
    - name: log-forwarding-profile
      path: /log-forwarding-profiles/{profile_id}
      operations:
      - name: get-log-forwarding-profile
        method: GET
        description: Get a specific log forwarding profile by ID.
        inputParameters:
        - name: profile_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-log-forwarding-profile
        method: PUT
        description: Update a specific log forwarding profile by ID.
        inputParameters:
        - name: profile_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data: {}
      - name: delete-log-forwarding-profile
        method: DELETE
        description: Delete a specific log forwarding profile by ID.
        inputParameters:
        - name: profile_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: syslog-destinations
      path: /log-forwarding-profiles/{profile_id}/destinations/syslog
      operations:
      - name: list-syslog-destinations
        method: GET
        description: List syslog destinations for a log forwarding profile.
        inputParameters:
        - name: profile_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-syslog-destination
        method: POST
        description: Create a syslog destination for a log forwarding profile.
        inputParameters:
        - name: profile_id
          in: path
          type: string
          required: true
        - name: name
          in: body
          type: string
          required: true
        - name: server
          in: body
          type: string
          required: true
        - name: port
          in: body
          type: integer
          required: true
        - name: protocol
          in: body
          type: string
          required: true
        - name: format
          in: body
          type: string
          required: true
        - name: facility
          in: body
          type: string
          required: true
        - name: enabled
          in: body
          type: boolean
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            server: '{{tools.server}}'
            port: '{{tools.port}}'
            protocol: '{{tools.protocol}}'
            format: '{{tools.format}}'
            facility: '{{tools.facility}}'
            enabled: '{{tools.enabled}}'
    - name: https-destinations
      path: /log-forwarding-profiles/{profile_id}/destinations/https
      operations:
      - name: list-https-destinations
        method: GET
        description: List HTTPS destinations for a log forwarding profile.
        inputParameters:
        - name: profile_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-https-destination
        method: POST
        description: Create an HTTPS destination for a log forwarding profile.
        inputParameters:
        - name: profile_id
          in: path
          type: string
          required: true
        - name: name
          in: body
          type: string
          required: true
        - name: uri
          in: body
          type: string
          required: true
        - name: http_method
          in: body
          type: string
          required: true
        - name: headers
          in: body
          type: object
          required: false
        - name: tls_verify
          in: body
          type: boolean
          required: false
        - name: enabled
          in: body
          type: boolean
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            uri: '{{tools.uri}}'
            http_method: '{{tools.http_method}}'
            headers: '{{tools.headers}}'
            tls_verify: '{{tools.tls_verify}}'
            enabled: '{{tools.enabled}}'
    - name: email-destinations
      path: /log-forwarding-profiles/{profile_id}/destinations/email
      operations:
      - name: list-email-destinations
        method: GET
        description: List email destinations for a log forwarding profile.
        inputParameters:
        - name: profile_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-email-destination
        method: POST
        description: Create an email destination for a log forwarding profile.
        inputParameters:
        - name: profile_id
          in: path
          type: string
          required: true
        - name: name
          in: body
          type: string
          required: true
        - name: gateway
          in: body
          type: string
          required: true
        - name: from
          in: body
          type: string
          required: true
        - name: to
          in: body
          type: string
          required: true
        - name: and_also_to
          in: body
          type: string
          required: false
        - name: enabled
          in: body
          type: boolean
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            gateway: '{{tools.gateway}}'
            from: '{{tools.from}}'
            to: '{{tools.to}}'
            and_also_to: '{{tools.and_also_to}}'
            enabled: '{{tools.enabled}}'
    - name: log-forwarding-status
      path: /log-forwarding-profiles/{profile_id}/status
      operations:
      - name: get-log-forwarding-status
        method: GET
        description: Get the status of a log forwarding profile.
        inputParameters:
        - name: profile_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: aiops-ngfw-bpa
    baseUri: https://api.sase.paloaltonetworks.com/aiops/bpa
    description: Palo Alto Networks AIOps for NGFW BPA API for submitting and retrieving best practice assessment requests
      and reports.
    authentication:
      type: bearer
      token: '{{PALO_ALTO_OAUTH_TOKEN}}'
    resources:
    - name: requests
      path: /requests
      description: BPA request operations.
      operations:
      - name: submit-bpa-request
        method: POST
        description: Submit a BPA request.
        inputParameters:
        - name: device_serial
          in: body
          type: string
          required: true
          description: The serial number of the device to assess.
        - name: config_type
          in: body
          type: string
          required: true
          description: The configuration type for the BPA request.
        outputRawFormat: json
        outputParameters:
        - name: request_id
          type: string
          value: $.request_id
        - name: status
          type: string
          value: $.status
        body:
          type: json
          data:
            device_serial: '{{tools.device_serial}}'
            config_type: '{{tools.config_type}}'
      - name: get-bpa-request-status
        method: GET
        description: Check the status of a BPA request.
        inputParameters:
        - name: request_id
          in: path
          type: string
          required: true
          description: The ID of the BPA request.
        outputRawFormat: json
        outputParameters:
        - name: request_id
          type: string
          value: $.request_id
        - name: status
          type: string
          value: $.status
    - name: reports
      path: /reports
      description: BPA report operations.
      operations:
      - name: get-bpa-report
        method: GET
        description: Get a BPA report.
        inputParameters:
        - name: report_id
          in: path
          type: string
          required: true
          description: The ID of the BPA report.
        outputRawFormat: json
        outputParameters:
        - name: report
          type: object
          value: $.
      - name: get-bpa-report-checks
        method: GET
        description: Get BPA report check details.
        inputParameters:
        - name: report_id
          in: path
          type: string
          required: true
          description: The ID of the BPA report.
        outputRawFormat: json
        outputParameters:
        - name: checks
          type: array
          value: $.checks
  - type: http
    namespace: sase-multitenant-notifications
    baseUri: https://api.sase.paloaltonetworks.com
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_SASE_ACCESS_TOKEN}}'
    resources:
    - name: notification-profiles
      path: /api/cloud/2.0/agg/notifications/profiles
      operations:
      - name: list-notification-profiles
        method: GET
        description: List notification profiles associated with the current tenant.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-notification-profile
        method: POST
        description: Create a new notification profile with inputs and output channels.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            profileName: '{{tools.profileName}}'
            opState: '{{tools.opState}}'
            description: '{{tools.description}}'
            tenantList: '{{tools.tenantList}}'
            notifTypeDetails: '{{tools.notifTypeDetails}}'
            notifChannels: '{{tools.notifChannels}}'
      - name: get-notification-profile
        method: GET
        description: Get a specific notification profile by ID.
        path: /{notification_profile_id}
        inputParameters:
        - name: notification_profile_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-notification-profile
        method: DELETE
        description: Delete a notification profile by ID.
        path: /{notification_profile_id}
        inputParameters:
        - name: notification_profile_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: notification-profile-opstate
      path: /api/cloud/2.0/agg/notifications/profiles/opstate
      operations:
      - name: update-profile-opstate
        method: PUT
        description: Enable or disable a notification profile.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            profileId: '{{tools.profileId}}'
            opState: '{{tools.opState}}'
    - name: notification-profile-types
      path: /api/cloud/2.0/agg/notifications/profiles/types
      operations:
      - name: get-notification-types
        method: GET
        description: Retrieve valid notification types, categories, and sub-categories.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: notification-webhook-test
      path: /api/cloud/2.0/agg/notifications/profiles/webhook/test
      operations:
      - name: test-webhook-connectivity
        method: POST
        description: Test webhook connectivity from the notification service.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            urls: '{{tools.urls}}'
            auth_type: '{{tools.auth_type}}'
            token: '{{tools.token}}'
    - name: notification-profile-retry
      path: /api/cloud/2.0/agg/notifications/profiles/retryOp
      operations:
      - name: retry-profile-operation
        method: POST
        description: Retry incident profile push to selected child tenants.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            profileId: '{{tools.profileId}}'
            tenantList: '{{tools.tenantList}}'
    - name: notifications
      path: /api/cloud/2.0/agg/notifications/list
      operations:
      - name: list-notifications
        method: POST
        description: List notifications for all child tenants with filtering and sorting.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            filters: '{{tools.filters}}'
            sortByList: '{{tools.sortByList}}'
            page: '{{tools.page}}'
    - name: notification-count
      path: /api/cloud/2.0/agg/notifications/list/count
      operations:
      - name: get-notification-count
        method: POST
        description: Get notification count filtered by state or type.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            filters: '{{tools.filters}}'
            sortByList: '{{tools.sortByList}}'
    - name: notification-state
      path: /api/cloud/2.0/agg/notifications/list/state
      operations:
      - name: set-notification-read-state
        method: POST
        description: Set read state to READ or UNREAD for specified notifications.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            notifIds: '{{tools.notifIds}}'
            readState: '{{tools.readState}}'
      - name: get-notification-read-state
        method: GET
        description: Get read state of a specific notification.
        path: /{notification_id}
        inputParameters:
        - name: notification_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8087
    namespace: monitoring-and-observability-api
    description: Unified REST API for monitoring and observability workflows across Autonomous DEM, SASE Aggregate Monitoring,
      Strata Logging Service, and AIOps BPA.
    resources:
    - path: /v1/dem-application-scores
      name: dem-application-scores
      description: Application experience scores from Autonomous DEM.
      operations:
      - method: GET
        name: get-dem-application-scores
        description: Get application experience scores.
        inputParameters:
        - name: start_time
          in: query
          type: string
          required: false
          description: Start time for the query range.
        - name: end_time
          in: query
          type: string
          required: false
          description: End time for the query range.
        - name: offset
          in: query
          type: integer
          required: false
          description: Pagination offset.
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of results to return.
        call: autonomous-dem.get-application-scores
        with:
          start_time: rest.start_time
          end_time: rest.end_time
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: array
          mapping: $.
    - path: /v1/dem-agent-scores
      name: dem-agent-scores
      description: Agent and endpoint scores from Autonomous DEM.
      operations:
      - method: GET
