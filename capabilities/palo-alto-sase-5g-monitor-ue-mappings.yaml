naftiko: 1.0.0-alpha2
info:
  label: SASE 5G Monitor Service API — UE Mappings
  description: 'SASE 5G Monitor Service API — UE Mappings. 1 operations. Lead operation: Palo Alto Networks Search Subscriber
    Details. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - UE Mappings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-sase-5g-monitor-ue-mappings
    baseUri: https://stratacloudmanager.paloaltonetworks.com
    description: SASE 5G Monitor Service API — UE Mappings business capability. Self-contained, no shared references.
    resources:
    - name: mt-monitor-5g-mapping
      path: /mt/monitor/5g/mapping
      operations:
      - name: postmtmonitor5gmapping
        method: POST
        description: Palo Alto Networks Search Subscriber Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: palo-alto-sase-5g-monitor-ue-mappings-rest
    port: 8080
    description: REST adapter for SASE 5G Monitor Service API — UE Mappings. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/mt/monitor/5g/mapping
      name: mt-monitor-5g-mapping
      description: REST surface for mt-monitor-5g-mapping.
      operations:
      - method: POST
        name: postmtmonitor5gmapping
        description: Palo Alto Networks Search Subscriber Details
        call: palo-alto-sase-5g-monitor-ue-mappings.postmtmonitor5gmapping
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-sase-5g-monitor-ue-mappings-mcp
    port: 9090
    transport: http
    description: MCP adapter for SASE 5G Monitor Service API — UE Mappings. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: palo-alto-networks-search-subscriber
      description: Palo Alto Networks Search Subscriber Details
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: palo-alto-sase-5g-monitor-ue-mappings.postmtmonitor5gmapping
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
