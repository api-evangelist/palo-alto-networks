naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Threat Vault API — ReleaseNotes
  description: 'Palo Alto Networks Threat Vault API — ReleaseNotes. 1 operations. Lead operation: Palo Alto Networks Get Content
    Release Notes. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - ReleaseNotes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-threat-vault-releasenotes
    baseUri: https://api.threatvault.paloaltonetworks.com/service/v1
    description: Palo Alto Networks Threat Vault API — ReleaseNotes business capability. Self-contained, no shared references.
    resources:
    - name: release-notes
      path: /release-notes
      operations:
      - name: getreleasenotes
        method: GET
        description: Palo Alto Networks Get Content Release Notes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: Content release type.
          required: true
        - name: version
          in: query
          type: string
          description: Specific content version to retrieve notes for (e.g., 8000-7000).
        - name: offset
          in: query
          type: integer
        - name: limit
          in: query
          type: integer
    authentication:
      type: apikey
      key: X-API-KEY
      value: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: palo-alto-threat-vault-releasenotes-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Threat Vault API — ReleaseNotes. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/release-notes
      name: release-notes
      description: REST surface for release-notes.
      operations:
      - method: GET
        name: getreleasenotes
        description: Palo Alto Networks Get Content Release Notes
        call: palo-alto-threat-vault-releasenotes.getreleasenotes
        with:
          type: rest.type
          version: rest.version
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-threat-vault-releasenotes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Threat Vault API — ReleaseNotes. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-content
      description: Palo Alto Networks Get Content Release Notes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-threat-vault-releasenotes.getreleasenotes
      with:
        type: tools.type
        version: tools.version
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
