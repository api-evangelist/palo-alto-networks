naftiko: 1.0.0-alpha2
info:
  label: 'Prisma Cloud: Managed Security Service Provider (MSSP) — MSSP Managed Tenant Lifecycle Endpoints'
  description: 'Prisma Cloud: Managed Security Service Provider (MSSP) — MSSP Managed Tenant Lifecycle Endpoints. 6 operations.
    Lead operation: Palo Alto Networks Get the Managed Tenants for an MSSP. Self-contained Naftiko capability covering one
    Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - MSSP Managed Tenant Lifecycle Endpoints
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-prisma-cloud-mssp-mssp-managed-tenant-lifecycle-endpoints
    baseUri: https://mssp-api.prismacloud.io
    description: 'Prisma Cloud: Managed Security Service Provider (MSSP) — MSSP Managed Tenant Lifecycle Endpoints business
      capability. Self-contained, no shared references.'
    resources:
    - name: api-v1-mssp-mssp-id-managed-tenant
      path: /api/v1/mssp/{mssp-id}/managed-tenant
      operations:
      - name: getmanagedtenants
        method: GET
        description: Palo Alto Networks Get the Managed Tenants for an MSSP
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: mssp-id
          in: path
          type: string
          description: the mssp the managed tenants belong to
          required: true
        - name: tenant_group
          in: query
          type: array
          description: the tenant groups the managed tenants belong to, accepts multiple. Maximum limit of 10
        - name: show_synthetic_tenant
          in: query
          type: boolean
          description: show synthetic tenant, defaults to false
        - name: show_deleted_tenants
          in: query
          type: boolean
          description: show deleted tenants, defaults to false
        - name: next_page_token
          in: query
          type: string
          description: pagination token to continue a previous query
      - name: createmanagedtenant
        method: POST
        description: Palo Alto Networks Create a New Managed Tenant
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: mssp-id
          in: path
          type: string
          description: the id of the MSSP of interest
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v1-mssp-mssp-id-managed-tenant-tenant-id
      path: /api/v1/mssp/{mssp-id}/managed-tenant/{tenant-id}
      operations:
      - name: getmanagedtenantbyid
        method: GET
        description: Palo Alto Networks Get the Details of an Existing Managed Tenant
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: mssp-id
          in: path
          type: string
          description: the mssp the managed tenants belong to
          required: true
        - name: tenant-id
          in: path
          type: string
          description: the prisma id or external tenant id of the managed tenant of interest
          required: true
      - name: softdeletemanagedtenant
        method: DELETE
        description: Palo Alto Networks Delete a Managed Tenant
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: mssp-id
          in: path
          type: string
          description: the mssp the managed tenants belong to
          required: true
        - name: tenant-id
          in: path
          type: string
          description: the prisma id or external tenant if of the managed tenant of interest
          required: true
      - name: updatemanagedtenant
        method: PATCH
        description: Palo Alto Networks Modify an Existing Managed Tenant
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: mssp-id
          in: path
          type: string
          description: the mssp the managed tenants belong to
          required: true
        - name: tenant-id
          in: path
          type: string
          description: the prisma id or external tenant id of the managed tenant of interest
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v1-mssp-mssp-id-managed-tenant-tenant-id-login
      path: /api/v1/mssp/{mssp-id}/managed-tenant/{tenant-id}/login
      operations:
      - name: seamlesslogin
        method: GET
        description: Palo Alto Networks Seamless Login
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: mssp-id
          in: path
          type: string
          description: the mssp the managed tenants belong to
          required: true
        - name: tenant-id
          in: path
          type: string
          description: the prisma id or external tenant if of the managed tenant of interest
          required: true
        - name: landing_page
          in: query
          type: string
          description: The landing page for redirection on prisma tenant
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-prisma-cloud-mssp-mssp-managed-tenant-lifecycle-endpoints-rest
    port: 8080
    description: 'REST adapter for Prisma Cloud: Managed Security Service Provider (MSSP) — MSSP Managed Tenant Lifecycle
      Endpoints. One Spectral-compliant resource per consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/api/v1/mssp/{mssp-id}/managed-tenant
