          tenant-id: rest.tenant-id
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatemanagedtenant
        description: Palo Alto Networks Modify an Existing Managed Tenant
        call: palo-alto-prisma-cloud-mssp-mssp-managed-tenant-lifecycle-endpoints.updatemanagedtenant
        with:
          mssp-id: rest.mssp-id
          tenant-id: rest.tenant-id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/mssp/{mssp-id}/managed-tenant/{tenant-id}/login
      name: api-v1-mssp-mssp-id-managed-tenant-tenant-id-login
      description: REST surface for api-v1-mssp-mssp-id-managed-tenant-tenant-id-login.
      operations:
      - method: GET
        name: seamlesslogin
        description: Palo Alto Networks Seamless Login
        call: palo-alto-prisma-cloud-mssp-mssp-managed-tenant-lifecycle-endpoints.seamlesslogin
        with:
          mssp-id: rest.mssp-id
          tenant-id: rest.tenant-id
          landing_page: rest.landing_page
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-prisma-cloud-mssp-mssp-managed-tenant-lifecycle-endpoints-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Prisma Cloud: Managed Security Service Provider (MSSP) — MSSP Managed Tenant Lifecycle Endpoints.
      One tool per consumed operation, routed inline through this capability''s consumes block.'
    tools:
    - name: palo-alto-networks-get-managed
      description: Palo Alto Networks Get the Managed Tenants for an MSSP
      hints:
