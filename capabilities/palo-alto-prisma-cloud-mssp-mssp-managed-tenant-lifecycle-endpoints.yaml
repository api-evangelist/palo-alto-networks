      description: REST surface for api-v1-mssp-mssp-id-managed-tenant-tenant-id.
      operations:
      - method: GET
        name: getmanagedtenantbyid
        description: Palo Alto Networks Get the Details of an Existing Managed Tenant
        call: palo-alto-prisma-cloud-mssp-mssp-managed-tenant-lifecycle-endpoints.getmanagedtenantbyid
        with:
          mssp-id: rest.mssp-id
          tenant-id: rest.tenant-id
        outputParameters:
        - type: object
