naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Autonomous DEM API — ApplicationScores
  description: 'Palo Alto Networks Autonomous DEM API — ApplicationScores. 1 operations. Lead operation: Palo Alto Networks
    Get Application Experience Scores. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - ApplicationScores
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-autonomous-dem-applicationscores
    baseUri: https://api.sase.paloaltonetworks.com/adem/telemetry/v2
    description: Palo Alto Networks Autonomous DEM API — ApplicationScores business capability. Self-contained, no shared
      references.
    resources:
    - name: mt-monitor-adem-v1-applications-scores
      path: /mt/monitor/adem/v1/applications/scores
      operations:
      - name: getapplicationscores
        method: GET
        description: Palo Alto Networks Get Application Experience Scores
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: start_time
          in: query
          type: string
          description: Start of the time range in ISO 8601 format.
        - name: end_time
          in: query
          type: string
          description: End of the time range in ISO 8601 format.
        - name: time_range
          in: query
          type: string
          description: Relative time range shorthand (e.g., last_1_hour, last_24_hours).
        - name: app_id
          in: query
          type: string
          description: Filter by monitored application identifier.
        - name: user_id
          in: query
          type: string
          description: Filter by user email address or identifier.
        - name: site_name
          in: query
          type: string
          description: Filter by site name.
        - name: offset
          in: query
          type: integer
        - name: limit
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-autonomous-dem-applicationscores-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Autonomous DEM API — ApplicationScores. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/mt/monitor/adem/v1/applications/scores
      name: mt-monitor-adem-v1-applications-scores
      description: REST surface for mt-monitor-adem-v1-applications-scores.
      operations:
      - method: GET
        name: getapplicationscores
        description: Palo Alto Networks Get Application Experience Scores
        call: palo-alto-autonomous-dem-applicationscores.getapplicationscores
        with:
          start_time: rest.start_time
          end_time: rest.end_time
          time_range: rest.time_range
          app_id: rest.app_id
          user_id: rest.user_id
          site_name: rest.site_name
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-autonomous-dem-applicationscores-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Autonomous DEM API — ApplicationScores. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-application
      description: Palo Alto Networks Get Application Experience Scores
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-autonomous-dem-applicationscores.getapplicationscores
      with:
        start_time: tools.start_time
        end_time: tools.end_time
        time_range: tools.time_range
        app_id: tools.app_id
        user_id: tools.user_id
        site_name: tools.site_name
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
