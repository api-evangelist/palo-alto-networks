    resources:
    - path: /v1/log-forwarding-profiles/{profile-id}/destinations/https
      name: log-forwarding-profiles-profile-id-destinations-https
      description: REST surface for log-forwarding-profiles-profile_id-destinations-https.
      operations:
      - method: GET
        name: listhttpsdestinations
        description: Palo Alto Networks List HTTPS Destinations
        call: palo-alto-strata-logging-service-https-destinations.listhttpsdestinations
        with:
          profile_id: rest.profile_id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createhttpsdestination
        description: Palo Alto Networks Create HTTPS Destination
        call: palo-alto-strata-logging-service-https-destinations.createhttpsdestination
        with:
          profile_id: rest.profile_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-strata-logging-service-https-destinations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Strata Logging Service API — HTTPS Destinations. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-https
      description: Palo Alto Networks List HTTPS Destinations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-strata-logging-service-https-destinations.listhttpsdestinations
      with:
        profile_id: tools.profile_id
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-create-https
      description: Palo Alto Networks Create HTTPS Destination
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-strata-logging-service-https-destinations.createhttpsdestination
      with:
        profile_id: tools.profile_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
