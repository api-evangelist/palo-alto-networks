naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Strata Logging Service API — HTTPS Destinations
  description: 'Palo Alto Networks Strata Logging Service API — HTTPS Destinations. 2 operations. Lead operation: Palo Alto
    Networks List HTTPS Destinations. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - HTTPS Destinations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
