    description: Palo Alto Networks Strata Logging Service API — HTTPS Destinations business capability. Self-contained, no
      shared references.
    resources:
    - name: log-forwarding-profiles-profile_id-destinations-https
      path: /log-forwarding-profiles/{profile_id}/destinations/https
      operations:
      - name: listhttpsdestinations
        method: GET
        description: Palo Alto Networks List HTTPS Destinations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: profile_id
          in: path
          type: string
          description: Unique identifier of the log forwarding profile.
          required: true
      - name: createhttpsdestination
        method: POST
        description: Palo Alto Networks Create HTTPS Destination
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: profile_id
          in: path
          type: string
          description: Unique identifier of the log forwarding profile.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-strata-logging-service-https-destinations-rest
    port: 8080
