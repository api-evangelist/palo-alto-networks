naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma Access Browser Management API — Users
  description: 'Palo Alto Networks Prisma Access Browser Management API — Users. 2 operations. Lead operation: Palo Alto Networks
    List Browser Users. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-prisma-access-browser-users
    baseUri: https://api.sase.paloaltonetworks.com/browser-mgmt
    description: Palo Alto Networks Prisma Access Browser Management API — Users business capability. Self-contained, no shared
      references.
    resources:
    - name: v1-users
      path: /v1/users
      operations:
      - name: listbrowserusers
        method: GET
        description: Palo Alto Networks List Browser Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: policy_id
          in: query
          type: string
          description: Filter users by assigned browser policy.
        - name: offset
          in: query
          type: integer
          description: Number of results to skip for pagination.
        - name: limit
          in: query
          type: integer
          description: Maximum number of users to return.
    - name: v1-users-user_id-sessions
      path: /v1/users/{user_id}/sessions
      operations:
      - name: getusersessions
        method: GET
        description: Palo Alto Networks Get User Sessions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user_id
          in: path
          type: string
          description: Unique identifier of the browser user.
          required: true
        - name: status
          in: query
          type: string
          description: Filter sessions by status.
        - name: limit
          in: query
          type: integer
          description: Maximum number of sessions to return.
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-prisma-access-browser-users-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma Access Browser Management API — Users. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v1/users
      name: v1-users
      description: REST surface for v1-users.
      operations:
      - method: GET
        name: listbrowserusers
        description: Palo Alto Networks List Browser Users
        call: palo-alto-prisma-access-browser-users.listbrowserusers
        with:
          policy_id: rest.policy_id
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/users/{user-id}/sessions
      name: v1-users-user-id-sessions
      description: REST surface for v1-users-user_id-sessions.
      operations:
      - method: GET
        name: getusersessions
        description: Palo Alto Networks Get User Sessions
        call: palo-alto-prisma-access-browser-users.getusersessions
        with:
          user_id: rest.user_id
          status: rest.status
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-prisma-access-browser-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Prisma Access Browser Management API — Users. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-browser
      description: Palo Alto Networks List Browser Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-access-browser-users.listbrowserusers
      with:
        policy_id: tools.policy_id
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-get-user
      description: Palo Alto Networks Get User Sessions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-access-browser-users.getusersessions
      with:
        user_id: tools.user_id
        status: tools.status
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
