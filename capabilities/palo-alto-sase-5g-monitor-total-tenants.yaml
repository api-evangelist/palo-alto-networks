naftiko: 1.0.0-alpha2
info:
  label: SASE 5G Monitor Service API — Total Tenants
  description: 'SASE 5G Monitor Service API — Total Tenants. 1 operations. Lead operation: Palo Alto Networks Fetch Tenant
    Totals. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Total Tenants
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-sase-5g-monitor-total-tenants
    baseUri: https://stratacloudmanager.paloaltonetworks.com
    description: SASE 5G Monitor Service API — Total Tenants business capability. Self-contained, no shared references.
    resources:
    - name: mt-monitor-5g-tenants
      path: /mt/monitor/5g/tenants
      operations:
      - name: getmtmonitor5gtenants
        method: GET
        description: Palo Alto Networks Fetch Tenant Totals
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: palo-alto-sase-5g-monitor-total-tenants-rest
    port: 8080
    description: REST adapter for SASE 5G Monitor Service API — Total Tenants. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/mt/monitor/5g/tenants
      name: mt-monitor-5g-tenants
      description: REST surface for mt-monitor-5g-tenants.
      operations:
      - method: GET
        name: getmtmonitor5gtenants
        description: Palo Alto Networks Fetch Tenant Totals
        call: palo-alto-sase-5g-monitor-total-tenants.getmtmonitor5gtenants
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-sase-5g-monitor-total-tenants-mcp
    port: 9090
    transport: http
    description: MCP adapter for SASE 5G Monitor Service API — Total Tenants. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: palo-alto-networks-fetch-tenant
      description: Palo Alto Networks Fetch Tenant Totals
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-sase-5g-monitor-total-tenants.getmtmonitor5gtenants
      outputParameters:
      - type: object
        mapping: $.
