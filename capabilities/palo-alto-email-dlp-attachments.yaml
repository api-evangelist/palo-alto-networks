naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Email DLP API — Attachments
  description: 'Palo Alto Networks Email DLP API — Attachments. 1 operations. Lead operation: Palo Alto Networks Get Email
    Incident Attachments. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Attachments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-email-dlp-attachments
    baseUri: https://api.{region}.dlp.paloaltonetworks.com/v1
    description: Palo Alto Networks Email DLP API — Attachments business capability. Self-contained, no shared references.
    resources:
    - name: email-incidents-id-attachments
      path: /email-incidents/{id}/attachments
      operations:
      - name: getemailincidentattachments
        method: GET
        description: Palo Alto Networks Get Email Incident Attachments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Unique incident identifier.
          required: true
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-email-dlp-attachments-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Email DLP API — Attachments. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/email-incidents/{id}/attachments
      name: email-incidents-id-attachments
      description: REST surface for email-incidents-id-attachments.
      operations:
      - method: GET
        name: getemailincidentattachments
        description: Palo Alto Networks Get Email Incident Attachments
        call: palo-alto-email-dlp-attachments.getemailincidentattachments
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-email-dlp-attachments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Email DLP API — Attachments. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-email
      description: Palo Alto Networks Get Email Incident Attachments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-email-dlp-attachments.getemailincidentattachments
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
