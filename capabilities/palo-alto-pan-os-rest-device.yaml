naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks PAN-OS REST API — Device
  description: 'Palo Alto Networks PAN-OS REST API — Device. 1 operations. Lead operation: Palo Alto Networks List Virtual
    Systems. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Device
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-pan-os-rest-device
    baseUri: https://{firewall}/restapi/v10.2
    description: Palo Alto Networks PAN-OS REST API — Device business capability. Self-contained, no shared references.
    resources:
    - name: Device-VirtualSystems
      path: /Device/VirtualSystems
      operations:
      - name: listvirtualsystems
        method: GET
        description: Palo Alto Networks List Virtual Systems
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-PAN-KEY
      value: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: palo-alto-pan-os-rest-device-rest
    port: 8080
    description: REST adapter for Palo Alto Networks PAN-OS REST API — Device. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/device/virtualsystems
      name: device-virtualsystems
      description: REST surface for Device-VirtualSystems.
      operations:
      - method: GET
        name: listvirtualsystems
        description: Palo Alto Networks List Virtual Systems
        call: palo-alto-pan-os-rest-device.listvirtualsystems
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-pan-os-rest-device-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks PAN-OS REST API — Device. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-virtual
      description: Palo Alto Networks List Virtual Systems
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-pan-os-rest-device.listvirtualsystems
      outputParameters:
      - type: object
        mapping: $.
