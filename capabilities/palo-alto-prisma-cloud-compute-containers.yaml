naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma Cloud Compute API — Containers
  description: 'Palo Alto Networks Prisma Cloud Compute API — Containers. 1 operations. Lead operation: Palo Alto Networks
    List Running Containers. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Containers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-prisma-cloud-compute-containers
    baseUri: https://{console}/api/v1
    description: Palo Alto Networks Prisma Cloud Compute API — Containers business capability. Self-contained, no shared references.
    resources:
    - name: containers
      path: /containers
      operations:
      - name: getcontainers
        method: GET
        description: Palo Alto Networks List Running Containers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: offset
          in: query
          type: integer
          description: Number of records to skip for pagination.
        - name: limit
          in: query
          type: integer
          description: Maximum number of records to return.
        - name: search
          in: query
          type: string
          description: Search term to filter containers by name or image.
        - name: collections
          in: query
          type: string
          description: Filter by collection name.
        - name: clusters
          in: query
          type: string
          description: Filter by cluster name.
        - name: hostname
          in: query
          type: string
          description: Filter by host where the container is running.
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-prisma-cloud-compute-containers-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma Cloud Compute API — Containers. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/containers
      name: containers
      description: REST surface for containers.
      operations:
      - method: GET
        name: getcontainers
        description: Palo Alto Networks List Running Containers
        call: palo-alto-prisma-cloud-compute-containers.getcontainers
        with:
          offset: rest.offset
          limit: rest.limit
          search: rest.search
          collections: rest.collections
          clusters: rest.clusters
          hostname: rest.hostname
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-prisma-cloud-compute-containers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Prisma Cloud Compute API — Containers. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-running
      description: Palo Alto Networks List Running Containers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-cloud-compute-containers.getcontainers
      with:
        offset: tools.offset
        limit: tools.limit
        search: tools.search
        collections: tools.collections
        clusters: tools.clusters
        hostname: tools.hostname
      outputParameters:
      - type: object
        mapping: $.
