        idempotent: true
      call: palo-alto-cloud-ngfw-firewalls.updatefirewall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-delete-cloud
      description: Palo Alto Networks Delete Cloud NGFW Firewall
      hints:
