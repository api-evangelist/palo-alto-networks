        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-cloud-ngfw-firewalls.getfirewall
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-update-cloud
      description: Palo Alto Networks Update Cloud NGFW Firewall
      hints:
        readOnly: false
