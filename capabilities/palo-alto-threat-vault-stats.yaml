naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Threat Vault API — Stats
  description: 'Palo Alto Networks Threat Vault API — Stats. 1 operations. Lead operation: Palo Alto Networks Get API Usage
    Statistics. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Stats
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-threat-vault-stats
    baseUri: https://api.threatvault.paloaltonetworks.com/service/v1
    description: Palo Alto Networks Threat Vault API — Stats business capability. Self-contained, no shared references.
    resources:
    - name: stats
      path: /stats
      operations:
      - name: getstats
        method: GET
        description: Palo Alto Networks Get API Usage Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-API-KEY
      value: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: palo-alto-threat-vault-stats-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Threat Vault API — Stats. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/stats
      name: stats
      description: REST surface for stats.
      operations:
      - method: GET
        name: getstats
        description: Palo Alto Networks Get API Usage Statistics
        call: palo-alto-threat-vault-stats.getstats
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-threat-vault-stats-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Threat Vault API — Stats. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-api
      description: Palo Alto Networks Get API Usage Statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-threat-vault-stats.getstats
      outputParameters:
      - type: object
        mapping: $.
