naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks AI Security
  description: Unified AI security capability for scanning AI model inputs/outputs for threats and red-teaming AI applications
    for vulnerabilities across Prisma AIRS and AI Red Teaming APIs.
  tags:
  - Palo Alto Networks
  - AI Security
  - AI Red Teaming
  - LLM Security
  - Prompt Injection
  created: '2026-04-16'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    PRISMA_AIRS_TOKEN: PRISMA_AIRS_TOKEN
    PALO_ALTO_OAUTH_TOKEN: PALO_ALTO_OAUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: prisma-airs
    baseUri: https://security.api.aisecurity.paloaltonetworks.com
    description: Prisma AIRS API for submitting AI security scans and managing AI profiles.
    authentication:
      type: apikey
      name: x-pan-token
      in: header
      value: '{{env.PRISMA_AIRS_TOKEN}}'
    resources:
    - name: scan-sync
      path: /v1/scan/sync/request
      operations:
      - name: submit-scan-sync
        method: POST
        description: Submit a synchronous scan request.
        inputParameters:
        - name: ai_profile
          in: body
          type: string
          required: true
        - name: contents
          in: body
          type: object
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            ai_profile: '{{tools.ai_profile}}'
            contents: '{{tools.contents}}'
    - name: scan-async
      path: /v1/scan/async/request
      operations:
      - name: submit-scan-async
        method: POST
        description: Submit an asynchronous scan request.
        inputParameters:
        - name: ai_profile
          in: body
          type: string
          required: true
        - name: contents
          in: body
          type: object
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            ai_profile: '{{tools.ai_profile}}'
            contents: '{{tools.contents}}'
    - name: async-scan-results
      path: /v1/scan/async/results/{scan_id}
      operations:
      - name: get-async-scan-results
        method: GET
        description: Get results of an asynchronous scan.
        inputParameters:
        - name: scan_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: ai-profiles
      path: /v1/profile
      operations:
      - name: list-ai-profiles
        method: GET
        description: List all AI profiles with pagination.
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: ai-profile
      path: /v1/profile/{profile_name}
      operations:
      - name: get-ai-profile
        method: GET
        description: Get a specific AI profile by name.
        inputParameters:
        - name: profile_name
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: prisma-airs-red-teaming
    baseUri: https://api.sase.paloaltonetworks.com/ai-red-teaming
    description: Prisma AIRS AI Red Teaming API for managing scan targets, running vulnerability scans, and reviewing results.
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_OAUTH_TOKEN}}'
    resources:
    - name: scan-targets
      path: /v1/targets
      operations:
      - name: create-scan-target
        method: POST
        description: Create a new scan target.
        inputParameters:
        - name: name
          in: body
          type: string
          required: true
        - name: type
          in: body
          type: string
          required: true
        - name: endpoint_url
          in: body
          type: string
          required: true
        - name: description
          in: body
          type: string
          required: false
        - name: model
          in: body
          type: string
          required: false
        - name: auth_config
          in: body
          type: object
          required: false
        - name: system_prompt
          in: body
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            type: '{{tools.type}}'
            endpoint_url: '{{tools.endpoint_url}}'
            description: '{{tools.description}}'
            model: '{{tools.model}}'
            auth_config: '{{tools.auth_config}}'
            system_prompt: '{{tools.system_prompt}}'
      - name: list-scan-targets
        method: GET
        description: List all scan targets with optional type filter.
        inputParameters:
        - name: type
          in: query
          type: string
          required: false
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: scan-target
      path: /v1/targets/{target_id}
      operations:
      - name: get-scan-target
        method: GET
        description: Get a specific scan target by ID.
        inputParameters:
        - name: target_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-scan-target
        method: DELETE
        description: Delete a specific scan target by ID.
        inputParameters:
        - name: target_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: scans
      path: /v1/scans
      operations:
      - name: start-vulnerability-scan
        method: POST
        description: Start a new vulnerability scan against a target.
        inputParameters:
        - name: target_id
          in: body
          type: string
          required: true
        - name: attack_categories
          in: body
          type: object
          required: false
        - name: custom_prompts
          in: body
          type: object
          required: false
        - name: max_attacks_per_category
          in: body
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            target_id: '{{tools.target_id}}'
            attack_categories: '{{tools.attack_categories}}'
            custom_prompts: '{{tools.custom_prompts}}'
            max_attacks_per_category: '{{tools.max_attacks_per_category}}'
    - name: scan-status
      path: /v1/scans/{scan_id}
      operations:
      - name: get-scan-status
        method: GET
        description: Get the status of a vulnerability scan.
        inputParameters:
        - name: scan_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: scan-results
      path: /v1/scans/{scan_id}/results
      operations:
      - name: get-scan-results
        method: GET
        description: Get results of a vulnerability scan with optional filters.
        inputParameters:
        - name: scan_id
          in: path
          type: string
          required: true
        - name: category
          in: query
          type: string
          required: false
        - name: severity
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: attack-categories
      path: /v1/attack-categories
      operations:
      - name: list-attack-categories
        method: GET
        description: List all available attack categories.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8088
    namespace: ai-security-api
    description: Unified REST API for AI security scanning and red teaming.
    resources:
    - path: /v1/ai-scans/sync
      name: ai-scan-sync
      description: Submit a synchronous AI security scan.
      operations:
      - method: POST
        name: submit-sync-scan
        description: Submit a synchronous scan of AI model inputs/outputs for threats.
        inputParameters:
        - name: ai_profile
          in: body
          type: string
          required: true
        - name: contents
          in: body
          type: object
          required: true
        call: prisma-airs.submit-scan-sync
        with:
          ai_profile: rest.ai_profile
          contents: rest.contents
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/ai-scans/async
      name: ai-scan-async
      description: Submit an asynchronous AI security scan.
      operations:
      - method: POST
        name: submit-async-scan
        description: Submit an asynchronous scan of AI model inputs/outputs for threats.
        inputParameters:
        - name: ai_profile
          in: body
          type: string
          required: true
        - name: contents
          in: body
          type: object
          required: true
        call: prisma-airs.submit-scan-async
        with:
          ai_profile: rest.ai_profile
          contents: rest.contents
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/ai-scans/async/{scan_id}/results
      name: ai-scan-async-results
      description: Get results of an asynchronous AI security scan.
      operations:
      - method: GET
        name: get-async-scan-results
        description: Get the results of a previously submitted asynchronous scan.
        inputParameters:
        - name: scan_id
          in: path
          type: string
          required: true
        call: prisma-airs.get-async-scan-results
        with:
          scan_id: rest.scan_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/ai-profiles
      name: ai-profiles
      description: List AI security profiles.
      operations:
      - method: GET
        name: list-ai-profiles
        description: List all AI security profiles with pagination.
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        call: prisma-airs.list-ai-profiles
        with:
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/ai-profiles/{profile_name}
      name: ai-profile
      description: Get a specific AI security profile.
      operations:
      - method: GET
        name: get-ai-profile
        description: Get a specific AI security profile by name.
        inputParameters:
        - name: profile_name
          in: path
          type: string
          required: true
        call: prisma-airs.get-ai-profile
        with:
          profile_name: rest.profile_name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/red-team-targets
      name: red-team-targets
      description: Manage AI red teaming scan targets.
      operations:
      - method: POST
        name: create-red-team-target
        description: Create a new red team scan target.
        inputParameters:
        - name: name
          in: body
          type: string
          required: true
        - name: type
          in: body
          type: string
          required: true
        - name: endpoint_url
          in: body
          type: string
          required: true
        - name: description
          in: body
          type: string
          required: false
        - name: model
          in: body
          type: string
          required: false
        - name: auth_config
          in: body
          type: object
          required: false
        - name: system_prompt
          in: body
          type: string
          required: false
        call: prisma-airs-red-teaming.create-scan-target
        with:
          name: rest.name
          type: rest.type
          endpoint_url: rest.endpoint_url
          description: rest.description
          model: rest.model
          auth_config: rest.auth_config
          system_prompt: rest.system_prompt
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: list-red-team-targets
        description: List all red team scan targets.
        inputParameters:
        - name: type
          in: query
          type: string
          required: false
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        call: prisma-airs-red-teaming.list-scan-targets
        with:
          type: rest.type
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/red-team-targets/{target_id}
      name: red-team-target
      description: Get or delete a specific red team scan target.
      operations:
      - method: GET
        name: get-red-team-target
        description: Get a specific red team scan target by ID.
        inputParameters:
        - name: target_id
          in: path
          type: string
          required: true
        call: prisma-airs-red-teaming.get-scan-target
        with:
          target_id: rest.target_id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-red-team-target
        description: Delete a specific red team scan target by ID.
        inputParameters:
        - name: target_id
          in: path
          type: string
          required: true
        call: prisma-airs-red-teaming.delete-scan-target
        with:
          target_id: rest.target_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/red-team-scans
      name: red-team-scans
      description: Start AI red team vulnerability scans.
      operations:
      - method: POST
        name: start-red-team-scan
        description: Start a new red team vulnerability scan against a target.
        inputParameters:
        - name: target_id
          in: body
          type: string
          required: true
        - name: attack_categories
          in: body
          type: object
          required: false
        - name: custom_prompts
          in: body
          type: object
          required: false
        - name: max_attacks_per_category
          in: body
          type: integer
          required: false
        call: prisma-airs-red-teaming.start-vulnerability-scan
        with:
          target_id: rest.target_id
          attack_categories: rest.attack_categories
          custom_prompts: rest.custom_prompts
          max_attacks_per_category: rest.max_attacks_per_category
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/red-team-scans/{scan_id}
      name: red-team-scan-status
      description: Get the status of a red team vulnerability scan.
      operations:
      - method: GET
        name: get-red-team-scan-status
        description: Get the status of a red team vulnerability scan.
        inputParameters:
        - name: scan_id
          in: path
          type: string
          required: true
        call: prisma-airs-red-teaming.get-scan-status
        with:
          scan_id: rest.scan_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/red-team-scans/{scan_id}/results
      name: red-team-scan-results
      description: Get results of a red team vulnerability scan.
      operations:
      - method: GET
        name: get-red-team-scan-results
        description: Get results of a red team vulnerability scan with optional filters.
        inputParameters:
        - name: scan_id
          in: path
          type: string
          required: true
        - name: category
          in: query
          type: string
          required: false
        - name: severity
          in: query
          type: string
          required: false
        call: prisma-airs-red-teaming.get-scan-results
        with:
          scan_id: rest.scan_id
          category: rest.category
          severity: rest.severity
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/attack-categories
      name: attack-categories
      description: List available attack categories for red teaming.
      operations:
      - method: GET
        name: list-attack-categories
        description: List all available attack categories for red team scans.
        call: prisma-airs-red-teaming.list-attack-categories
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9098
    namespace: ai-security-mcp
    transport: http
    description: MCP server for AI-assisted AI security scanning and red teaming.
    tools:
    - name: submit-sync-scan
      description: Submit a synchronous AI security scan of model inputs/outputs for threats like prompt injection, data leakage,
        and malicious content.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
        openWorld: true
      inputParameters:
      - name: ai_profile
        type: string
        required: true
      - name: contents
        type: object
        required: true
      call: prisma-airs.submit-scan-sync
      with:
        ai_profile: tools.ai_profile
        contents: tools.contents
      outputParameters:
      - type: object
        mapping: $.
    - name: submit-async-scan
      description: Submit an asynchronous AI security scan of model inputs/outputs for threats.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
        openWorld: true
      inputParameters:
      - name: ai_profile
        type: string
        required: true
      - name: contents
        type: object
        required: true
      call: prisma-airs.submit-scan-async
      with:
        ai_profile: tools.ai_profile
        contents: tools.contents
      outputParameters:
      - type: object
        mapping: $.
    - name: get-async-scan-results
      description: Get results of a previously submitted asynchronous AI security scan.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
        openWorld: true
      inputParameters:
      - name: scan_id
        type: string
        required: true
      call: prisma-airs.get-async-scan-results
      with:
        scan_id: tools.scan_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-ai-profiles
      description: List all AI security profiles with pagination.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
        openWorld: true
      inputParameters:
      - name: offset
        type: integer
        required: false
      - name: limit
        type: integer
        required: false
      call: prisma-airs.list-ai-profiles
      with:
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: get-ai-profile
      description: Get a specific AI security profile by name.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
        openWorld: true
      inputParameters:
      - name: profile_name
        type: string
        required: true
      call: prisma-airs.get-ai-profile
      with:
        profile_name: tools.profile_name
      outputParameters:
      - type: object
        mapping: $.
    - name: create-red-team-target
      description: Create a new red team scan target for AI application vulnerability testing.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
        openWorld: true
      inputParameters:
      - name: name
        type: string
        required: true
      - name: type
        type: string
        required: true
      - name: endpoint_url
        type: string
        required: true
      - name: description
        type: string
        required: false
      - name: model
        type: string
        required: false
      - name: auth_config
        type: object
        required: false
      - name: system_prompt
        type: string
        required: false
      call: prisma-airs-red-teaming.create-scan-target
      with:
        name: tools.name
        type: tools.type
        endpoint_url: tools.endpoint_url
        description: tools.description
        model: tools.model
        auth_config: tools.auth_config
        system_prompt: tools.system_prompt
      outputParameters:
      - type: object
        mapping: $.
    - name: list-red-team-targets
      description: List all red team scan targets with optional type filter.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
        openWorld: true
      inputParameters:
      - name: type
        type: string
        required: false
      - name: offset
        type: integer
        required: false
      - name: limit
        type: integer
        required: false
      call: prisma-airs-red-teaming.list-scan-targets
      with:
        type: tools.type
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: get-red-team-target
      description: Get a specific red team scan target by ID.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
        openWorld: true
      inputParameters:
      - name: target_id
        type: string
        required: true
      call: prisma-airs-red-teaming.get-scan-target
      with:
        target_id: tools.target_id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-red-team-target
      description: Delete a specific red team scan target by ID.
      hints:
        readOnly: false
        destructive: true
        idempotent: true
        openWorld: true
      inputParameters:
      - name: target_id
        type: string
        required: true
      call: prisma-airs-red-teaming.delete-scan-target
      with:
        target_id: tools.target_id
      outputParameters:
      - type: object
        mapping: $.
    - name: start-red-team-scan
      description: Start a new red team vulnerability scan against a target AI application.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
        openWorld: true
      inputParameters:
      - name: target_id
        type: string
        required: true
      - name: attack_categories
        type: object
        required: false
      - name: custom_prompts
        type: object
        required: false
      - name: max_attacks_per_category
        type: integer
        required: false
      call: prisma-airs-red-teaming.start-vulnerability-scan
      with:
        target_id: tools.target_id
        attack_categories: tools.attack_categories
        custom_prompts: tools.custom_prompts
        max_attacks_per_category: tools.max_attacks_per_category
      outputParameters:
      - type: object
        mapping: $.
    - name: get-red-team-scan-status
      description: Get the status of a red team vulnerability scan.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
        openWorld: true
      inputParameters:
      - name: scan_id
        type: string
        required: true
      call: prisma-airs-red-teaming.get-scan-status
      with:
        scan_id: tools.scan_id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-red-team-scan-results
      description: Get results of a red team vulnerability scan with optional category and severity filters.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
        openWorld: true
      inputParameters:
      - name: scan_id
        type: string
        required: true
      - name: category
        type: string
        required: false
      - name: severity
        type: string
        required: false
      call: prisma-airs-red-teaming.get-scan-results
      with:
        scan_id: tools.scan_id
        category: tools.category
        severity: tools.severity
      outputParameters:
      - type: object
        mapping: $.
    - name: list-attack-categories
      description: List all available attack categories for red team vulnerability scans.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
        openWorld: true
      call: prisma-airs-red-teaming.list-attack-categories
      outputParameters:
      - type: object
        mapping: $.
