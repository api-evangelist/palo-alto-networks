naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks SaaS Security Posture Management API — Integrations
  description: 'Palo Alto Networks SaaS Security Posture Management API — Integrations. 2 operations. Lead operation: Palo
    Alto Networks List Jira Integrations. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Integrations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-sspm-integrations
    baseUri: https://api.sase.paloaltonetworks.com/sspm
    description: Palo Alto Networks SaaS Security Posture Management API — Integrations business capability. Self-contained,
      no shared references.
    resources:
    - name: v1-jira-integrations
      path: /v1/jira-integrations
      operations:
      - name: listjiraintegrations
        method: GET
        description: Palo Alto Networks List Jira Integrations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createjiraintegration
        method: POST
        description: Palo Alto Networks Create Jira Integration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-sspm-integrations-rest
    port: 8080
    description: REST adapter for Palo Alto Networks SaaS Security Posture Management API — Integrations. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v1/jira-integrations
      name: v1-jira-integrations
      description: REST surface for v1-jira-integrations.
      operations:
      - method: GET
        name: listjiraintegrations
        description: Palo Alto Networks List Jira Integrations
        call: palo-alto-sspm-integrations.listjiraintegrations
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createjiraintegration
        description: Palo Alto Networks Create Jira Integration
        call: palo-alto-sspm-integrations.createjiraintegration
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-sspm-integrations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks SaaS Security Posture Management API — Integrations. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-jira
      description: Palo Alto Networks List Jira Integrations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-sspm-integrations.listjiraintegrations
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-create-jira
      description: Palo Alto Networks Create Jira Integration
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-sspm-integrations.createjiraintegration
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
