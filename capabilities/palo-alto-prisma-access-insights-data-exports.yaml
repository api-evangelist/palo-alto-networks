naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma Access Insights API — Data Exports
  description: 'Palo Alto Networks Prisma Access Insights API — Data Exports. 2 operations. Lead operation: Palo Alto Networks
    Get Export Job Status. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Data Exports
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-prisma-access-insights-data-exports
    baseUri: https://api.sase.paloaltonetworks.com
    description: Palo Alto Networks Prisma Access Insights API — Data Exports business capability. Self-contained, no shared
      references.
    resources:
    - name: insights-v3.0-resource-export-job_id-status
      path: /insights/v3.0/resource/export/{job_id}/status
      operations:
      - name: getexportjobstatus
        method: GET
        description: Palo Alto Networks Get Export Job Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: job_id
          in: path
          type: string
          description: Export job identifier returned when the export was submitted
          required: true
    - name: insights-v3.0-resource-export-resource_name
      path: /insights/v3.0/resource/export/{resource_name}
      operations:
      - name: exportdataresource
        method: POST
        description: Palo Alto Networks Export Data Resource Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-prisma-access-insights-data-exports-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma Access Insights API — Data Exports. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/insights/v3-0/resource/export/{job-id}/status
      name: insights-v3-0-resource-export-job-id-status
      description: REST surface for insights-v3.0-resource-export-job_id-status.
      operations:
      - method: GET
        name: getexportjobstatus
        description: Palo Alto Networks Get Export Job Status
        call: palo-alto-prisma-access-insights-data-exports.getexportjobstatus
        with:
          job_id: rest.job_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/insights/v3-0/resource/export/{resource-name}
      name: insights-v3-0-resource-export-resource-name
      description: REST surface for insights-v3.0-resource-export-resource_name.
      operations:
      - method: POST
        name: exportdataresource
        description: Palo Alto Networks Export Data Resource Results
        call: palo-alto-prisma-access-insights-data-exports.exportdataresource
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-prisma-access-insights-data-exports-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Prisma Access Insights API — Data Exports. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-export
      description: Palo Alto Networks Get Export Job Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-access-insights-data-exports.getexportjobstatus
      with:
        job_id: tools.job_id
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-export-data
      description: Palo Alto Networks Export Data Resource Results
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-prisma-access-insights-data-exports.exportdataresource
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
