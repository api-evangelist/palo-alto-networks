naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks AIOps for NGFW BPA API — BPA Reports
  description: 'Palo Alto Networks AIOps for NGFW BPA API — BPA Reports. 2 operations. Lead operation: Palo Alto Networks
    Get BPA Report. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - BPA Reports
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
