naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Enterprise DLP API — DataPatterns
  description: 'Palo Alto Networks Enterprise DLP API — DataPatterns. 2 operations. Lead operation: Palo Alto Networks List
    Data Patterns. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - DataPatterns
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-dlp-datapatterns
    baseUri: https://api.dlp.paloaltonetworks.com/v4
    description: Palo Alto Networks Enterprise DLP API — DataPatterns business capability. Self-contained, no shared references.
    resources:
    - name: data-patterns
      path: /data-patterns
      operations:
      - name: listdatapatterns
        method: GET
        description: Palo Alto Networks List Data Patterns
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: offset
          in: query
          type: integer
          description: Pagination offset.
        - name: limit
          in: query
          type: integer
          description: Maximum number of patterns to return.
    - name: data-patterns-id
      path: /data-patterns/{id}
      operations:
      - name: getdatapattern
        method: GET
        description: Palo Alto Networks Get Data Pattern Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Unique data pattern identifier.
          required: true
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-dlp-datapatterns-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Enterprise DLP API — DataPatterns. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/data-patterns
      name: data-patterns
      description: REST surface for data-patterns.
      operations:
      - method: GET
        name: listdatapatterns
        description: Palo Alto Networks List Data Patterns
        call: palo-alto-dlp-datapatterns.listdatapatterns
        with:
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data-patterns/{id}
      name: data-patterns-id
      description: REST surface for data-patterns-id.
      operations:
      - method: GET
        name: getdatapattern
        description: Palo Alto Networks Get Data Pattern Details
        call: palo-alto-dlp-datapatterns.getdatapattern
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-dlp-datapatterns-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Enterprise DLP API — DataPatterns. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-data
      description: Palo Alto Networks List Data Patterns
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-dlp-datapatterns.listdatapatterns
      with:
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-get-data
      description: Palo Alto Networks Get Data Pattern Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-dlp-datapatterns.getdatapattern
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
