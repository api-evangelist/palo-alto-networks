  description: 'Palo Alto Networks Cortex XDR REST API — Scripts. 2 operations. Lead operation: Palo Alto Networks Get Script
    Execution Results. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Scripts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
