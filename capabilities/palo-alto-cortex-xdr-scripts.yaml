    resources:
    - name: scripts-get_script_execution_results
      path: /scripts/get_script_execution_results
      operations:
      - name: getscriptexecutionresults
        method: POST
        description: Palo Alto Networks Get Script Execution Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: scripts-run_script
      path: /scripts/run_script
      operations:
      - name: runscript
        method: POST
        description: Palo Alto Networks Execute Script on Endpoints
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
