    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Cortex XDR REST API — Scripts. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-script
      description: Palo Alto Networks Get Script Execution Results
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: palo-alto-cortex-xdr-scripts.getscriptexecutionresults
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-execute-script
      description: Palo Alto Networks Execute Script on Endpoints
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-cortex-xdr-scripts.runscript
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
