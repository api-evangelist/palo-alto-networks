    namespace: palo-alto-cortex-xdr-scripts-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Cortex XDR REST API — Scripts. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/scripts/get-script-execution-results
      name: scripts-get-script-execution-results
      description: REST surface for scripts-get_script_execution_results.
      operations:
      - method: POST
        name: getscriptexecutionresults
        description: Palo Alto Networks Get Script Execution Results
        call: palo-alto-cortex-xdr-scripts.getscriptexecutionresults
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/scripts/run-script
      name: scripts-run-script
      description: REST surface for scripts-run_script.
      operations:
      - method: POST
        name: runscript
        description: Palo Alto Networks Execute Script on Endpoints
        call: palo-alto-cortex-xdr-scripts.runscript
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
