naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma AIRS AI Red Teaming API — Scans
  description: 'Palo Alto Networks Prisma AIRS AI Red Teaming API — Scans. 3 operations. Lead operation: Palo Alto Networks
    Start Vulnerability Scan. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Scans
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-prisma-airs-ai-red-teaming-scans
    baseUri: https://api.sase.paloaltonetworks.com/ai-red-teaming
    description: Palo Alto Networks Prisma AIRS AI Red Teaming API — Scans business capability. Self-contained, no shared
      references.
    resources:
    - name: v1-scans
      path: /v1/scans
      operations:
      - name: startvulnerabilityscan
        method: POST
        description: Palo Alto Networks Start Vulnerability Scan
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-scans-scan_id
      path: /v1/scans/{scan_id}
      operations:
      - name: getscanstatus
        method: GET
        description: Palo Alto Networks Get Scan Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: scan_id
          in: path
          type: string
          description: Unique identifier of the vulnerability scan.
          required: true
    - name: v1-scans-scan_id-results
      path: /v1/scans/{scan_id}/results
      operations:
      - name: getscanresults
        method: GET
        description: Palo Alto Networks Get Scan Results and Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: scan_id
          in: path
          type: string
          description: Unique identifier of the completed scan.
          required: true
        - name: category
          in: query
          type: string
          description: Filter results by attack category.
        - name: severity
          in: query
          type: string
          description: Filter findings by severity level.
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-prisma-airs-ai-red-teaming-scans-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma AIRS AI Red Teaming API — Scans. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v1/scans
      name: v1-scans
      description: REST surface for v1-scans.
      operations:
      - method: POST
        name: startvulnerabilityscan
        description: Palo Alto Networks Start Vulnerability Scan
        call: palo-alto-prisma-airs-ai-red-teaming-scans.startvulnerabilityscan
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/scans/{scan-id}
      name: v1-scans-scan-id
      description: REST surface for v1-scans-scan_id.
      operations:
      - method: GET
        name: getscanstatus
        description: Palo Alto Networks Get Scan Status
        call: palo-alto-prisma-airs-ai-red-teaming-scans.getscanstatus
        with:
          scan_id: rest.scan_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/scans/{scan-id}/results
      name: v1-scans-scan-id-results
      description: REST surface for v1-scans-scan_id-results.
      operations:
      - method: GET
        name: getscanresults
        description: Palo Alto Networks Get Scan Results and Report
        call: palo-alto-prisma-airs-ai-red-teaming-scans.getscanresults
        with:
          scan_id: rest.scan_id
          category: rest.category
          severity: rest.severity
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-prisma-airs-ai-red-teaming-scans-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Prisma AIRS AI Red Teaming API — Scans. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-start-vulnerability
      description: Palo Alto Networks Start Vulnerability Scan
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-prisma-airs-ai-red-teaming-scans.startvulnerabilityscan
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-get-scan
      description: Palo Alto Networks Get Scan Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-airs-ai-red-teaming-scans.getscanstatus
      with:
        scan_id: tools.scan_id
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-get-scan-2
      description: Palo Alto Networks Get Scan Results and Report
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-airs-ai-red-teaming-scans.getscanresults
      with:
        scan_id: tools.scan_id
        category: tools.category
        severity: tools.severity
      outputParameters:
      - type: object
        mapping: $.
