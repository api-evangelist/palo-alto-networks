naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Cortex XSOAR REST API — Playbooks
  description: 'Palo Alto Networks Cortex XSOAR REST API — Playbooks. 2 operations. Lead operation: Palo Alto Networks List
    Playbooks. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Playbooks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-cortex-xsoar-playbooks
    baseUri: https://{xsoar-server}
    description: Palo Alto Networks Cortex XSOAR REST API — Playbooks business capability. Self-contained, no shared references.
    resources:
    - name: playbook
      path: /playbook
      operations:
      - name: listplaybooks
        method: GET
        description: Palo Alto Networks List Playbooks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query
          in: query
          type: string
          description: Filter playbooks by name or keyword.
    - name: playbook-run
      path: /playbook/run
      operations:
      - name: runplaybook
        method: POST
        description: Palo Alto Networks Run Playbook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: palo-alto-cortex-xsoar-playbooks-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Cortex XSOAR REST API — Playbooks. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/playbook
      name: playbook
      description: REST surface for playbook.
      operations:
      - method: GET
        name: listplaybooks
        description: Palo Alto Networks List Playbooks
        call: palo-alto-cortex-xsoar-playbooks.listplaybooks
        with:
          query: rest.query
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/playbook/run
      name: playbook-run
      description: REST surface for playbook-run.
      operations:
      - method: POST
        name: runplaybook
        description: Palo Alto Networks Run Playbook
        call: palo-alto-cortex-xsoar-playbooks.runplaybook
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-cortex-xsoar-playbooks-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Cortex XSOAR REST API — Playbooks. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-playbooks
      description: Palo Alto Networks List Playbooks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-cortex-xsoar-playbooks.listplaybooks
      with:
        query: tools.query
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-run-playbook
      description: Palo Alto Networks Run Playbook
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-cortex-xsoar-playbooks.runplaybook
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
