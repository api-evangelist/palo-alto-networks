naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma AIRS API — Profiles
  description: 'Palo Alto Networks Prisma AIRS API — Profiles. 2 operations. Lead operation: Palo Alto Networks List AI Security
    Profiles. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Profiles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-prisma-airs-profiles
    baseUri: https://security.api.aisecurity.paloaltonetworks.com
    description: Palo Alto Networks Prisma AIRS API — Profiles business capability. Self-contained, no shared references.
    resources:
    - name: v1-profile
      path: /v1/profile
      operations:
      - name: listaiprofiles
        method: GET
        description: Palo Alto Networks List AI Security Profiles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: offset
          in: query
          type: integer
          description: Pagination offset for the result set.
        - name: limit
          in: query
          type: integer
          description: Maximum number of profiles to return per page.
    - name: v1-profile-profile_name
      path: /v1/profile/{profile_name}
      operations:
      - name: getaiprofile
        method: GET
        description: Palo Alto Networks Get AI Security Profile Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: profile_name
          in: path
          type: string
          description: Name of the AI security profile to retrieve.
          required: true
    authentication:
      type: apikey
      key: x-pan-token
      value: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: palo-alto-prisma-airs-profiles-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma AIRS API — Profiles. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v1/profile
      name: v1-profile
      description: REST surface for v1-profile.
      operations:
      - method: GET
        name: listaiprofiles
        description: Palo Alto Networks List AI Security Profiles
        call: palo-alto-prisma-airs-profiles.listaiprofiles
        with:
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/profile/{profile-name}
      name: v1-profile-profile-name
      description: REST surface for v1-profile-profile_name.
      operations:
      - method: GET
        name: getaiprofile
        description: Palo Alto Networks Get AI Security Profile Details
        call: palo-alto-prisma-airs-profiles.getaiprofile
        with:
          profile_name: rest.profile_name
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-prisma-airs-profiles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Prisma AIRS API — Profiles. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-ai
      description: Palo Alto Networks List AI Security Profiles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-airs-profiles.listaiprofiles
      with:
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-get-ai
      description: Palo Alto Networks Get AI Security Profile Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-airs-profiles.getaiprofile
      with:
        profile_name: tools.profile_name
      outputParameters:
      - type: object
        mapping: $.
