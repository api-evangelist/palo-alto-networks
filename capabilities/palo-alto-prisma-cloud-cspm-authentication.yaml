naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma Cloud CSPM API — Authentication
  description: 'Palo Alto Networks Prisma Cloud CSPM API — Authentication. 1 operations. Lead operation: Palo Alto Networks
    Authenticate and Get JWT Token. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-prisma-cloud-cspm-authentication
    baseUri: https://api.prismacloud.io
    description: Palo Alto Networks Prisma Cloud CSPM API — Authentication business capability. Self-contained, no shared
      references.
    resources:
    - name: login
      path: /login
      operations:
      - name: login
        method: POST
        description: Palo Alto Networks Authenticate and Get JWT Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-prisma-cloud-cspm-authentication-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma Cloud CSPM API — Authentication. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/login
      name: login
      description: REST surface for login.
      operations:
      - method: POST
        name: login
        description: Palo Alto Networks Authenticate and Get JWT Token
        call: palo-alto-prisma-cloud-cspm-authentication.login
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-prisma-cloud-cspm-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Prisma Cloud CSPM API — Authentication. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-authenticate-and
      description: Palo Alto Networks Authenticate and Get JWT Token
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: palo-alto-prisma-cloud-cspm-authentication.login
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
