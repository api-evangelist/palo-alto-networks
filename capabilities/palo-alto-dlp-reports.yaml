naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Enterprise DLP API — Reports
  description: 'Palo Alto Networks Enterprise DLP API — Reports. 1 operations. Lead operation: Palo Alto Networks Get Incident
    Summary Report. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Reports
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-dlp-reports
    baseUri: https://api.dlp.paloaltonetworks.com/v4
    description: Palo Alto Networks Enterprise DLP API — Reports business capability. Self-contained, no shared references.
    resources:
    - name: reports-summary
      path: /reports/summary
      operations:
      - name: getreportsummary
        method: GET
        description: Palo Alto Networks Get Incident Summary Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: start_time
          in: query
          type: string
          description: Start of reporting period (ISO 8601 format).
          required: true
        - name: end_time
          in: query
          type: string
          description: End of reporting period (ISO 8601 format).
          required: true
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-dlp-reports-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Enterprise DLP API — Reports. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/reports/summary
      name: reports-summary
      description: REST surface for reports-summary.
      operations:
      - method: GET
        name: getreportsummary
        description: Palo Alto Networks Get Incident Summary Report
        call: palo-alto-dlp-reports.getreportsummary
        with:
          start_time: rest.start_time
          end_time: rest.end_time
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-dlp-reports-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Enterprise DLP API — Reports. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-incident
      description: Palo Alto Networks Get Incident Summary Report
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-dlp-reports.getreportsummary
      with:
        start_time: tools.start_time
        end_time: tools.end_time
      outputParameters:
      - type: object
        mapping: $.
