        method: GET
        description: Palo Alto Networks List FQDN-based Access Rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createfqdnrule
        method: POST
        description: Palo Alto Networks Create FQDN-based Access Rule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
