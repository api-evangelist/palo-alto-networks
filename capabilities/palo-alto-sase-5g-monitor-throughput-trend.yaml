naftiko: 1.0.0-alpha2
info:
  label: SASE 5G Monitor Service API — Throughput Trend
  description: 'SASE 5G Monitor Service API — Throughput Trend. 1 operations. Lead operation: Palo Alto Networks Analyze Throughput
    Performance. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Throughput Trend
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-sase-5g-monitor-throughput-trend
    baseUri: https://stratacloudmanager.paloaltonetworks.com
    description: SASE 5G Monitor Service API — Throughput Trend business capability. Self-contained, no shared references.
    resources:
    - name: mt-monitor-5g-interconnect-throughput
      path: /mt/monitor/5g/interconnect/throughput
      operations:
      - name: postmtmonitor5ginterconnectthroughput
        method: POST
        description: Palo Alto Networks Analyze Throughput Performance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: palo-alto-sase-5g-monitor-throughput-trend-rest
    port: 8080
    description: REST adapter for SASE 5G Monitor Service API — Throughput Trend. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/mt/monitor/5g/interconnect/throughput
      name: mt-monitor-5g-interconnect-throughput
      description: REST surface for mt-monitor-5g-interconnect-throughput.
      operations:
      - method: POST
        name: postmtmonitor5ginterconnectthroughput
        description: Palo Alto Networks Analyze Throughput Performance
        call: palo-alto-sase-5g-monitor-throughput-trend.postmtmonitor5ginterconnectthroughput
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-sase-5g-monitor-throughput-trend-mcp
    port: 9090
    transport: http
    description: MCP adapter for SASE 5G Monitor Service API — Throughput Trend. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: palo-alto-networks-analyze-throughput
      description: Palo Alto Networks Analyze Throughput Performance
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-sase-5g-monitor-throughput-trend.postmtmonitor5ginterconnectthroughput
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
