naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Cloud Security Posture
  description: Unified cloud security posture capability for managing alerts, policies, compliance, code security scanning,
    and data security posture across Prisma Cloud CSPM, Code Security, and DSPM.
  tags:
  - Palo Alto Networks
  - Cloud Security
  - CSPM
  - Compliance
  - Data Security
  - MSSP
  created: '2026-04-16'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    PRISMA_CLOUD_USERNAME: PRISMA_CLOUD_USERNAME
    PRISMA_CLOUD_PASSWORD: PRISMA_CLOUD_PASSWORD
    PRISMA_CLOUD_JWT_TOKEN: PRISMA_CLOUD_JWT_TOKEN
    PRISMA_CLOUD_TOKEN: PRISMA_CLOUD_TOKEN
capability:
  consumes:
  - type: http
    namespace: prisma-cloud-cspm
    baseUri: https://api.prismacloud.io
    authentication:
      type: bearer
      token: '{{env.PRISMA_CLOUD_JWT_TOKEN}}'
    resources:
    - name: login
      path: /login
      operations:
      - name: login
        method: POST
        description: Authenticate to Prisma Cloud and retrieve a JWT token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            username: '{{tools.username}}'
            password: '{{tools.password}}'
            customerName: '{{tools.customer_name}}'
    - name: alerts
      path: /alert
      operations:
      - name: get-alerts
        method: GET
        description: Retrieve a list of alerts based on filters
        inputParameters:
        - name: timeType
          in: query
          type: string
          required: false
        - name: timeAmount
          in: query
          type: integer
          required: false
        - name: timeUnit
          in: query
          type: string
          required: false
        - name: startTime
          in: query
          type: string
          required: false
        - name: endTime
          in: query
          type: string
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        - name: offset
          in: query
          type: integer
          required: false
        - name: severity
          in: query
          type: string
          required: false
        - name: policy.id
          in: query
          type: string
          required: false
        - name: detailed
          in: query
          type: boolean
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: alert-by-id
      path: /alert/{id}
      operations:
      - name: get-alert
        method: GET
        description: Retrieve details for a specific alert
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: alert-dismiss
      path: /alert/dismiss
      operations:
      - name: dismiss-alerts
        method: POST
        description: Dismiss one or more alerts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            alerts: '{{tools.alerts}}'
            dismissalNote: '{{tools.dismissal_note}}'
            dismissalTimeRange: '{{tools.dismissal_time_range}}'
            filter: '{{tools.filter}}'
    - name: alert-reopen
      path: /alert/reopen
      operations:
      - name: reopen-alerts
        method: POST
        description: Reopen one or more previously dismissed alerts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            alerts: '{{tools.alerts}}'
    - name: policies
      path: /policy
      operations:
      - name: list-policies
        method: GET
        description: Retrieve a list of all policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-policy
        method: POST
        description: Create a new security policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            policyType: '{{tools.policy_type}}'
            severity: '{{tools.severity}}'
            rule: '{{tools.rule}}'
            description: '{{tools.description}}'
            recommendation: '{{tools.recommendation}}'
            cloudType: '{{tools.cloud_type}}'
            enabled: '{{tools.enabled}}'
    - name: policy-by-id
      path: /policy/{policyId}
      operations:
      - name: get-policy
        method: GET
        description: Retrieve details for a specific policy
        inputParameters:
        - name: policyId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-policy
        method: PUT
        description: Update an existing security policy
        inputParameters:
        - name: policyId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            policyType: '{{tools.policy_type}}'
            severity: '{{tools.severity}}'
            rule: '{{tools.rule}}'
            description: '{{tools.description}}'
            recommendation: '{{tools.recommendation}}'
            cloudType: '{{tools.cloud_type}}'
            enabled: '{{tools.enabled}}'
    - name: cloud-accounts
      path: /cloud
      operations:
      - name: list-cloud-accounts
        method: GET
        description: Retrieve a list of all onboarded cloud accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: cloud-account-by-type
      path: /cloud/{cloudType}
      operations:
      - name: add-cloud-account
        method: POST
        description: Onboard a new cloud account
        inputParameters:
        - name: cloudType
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            accountId: '{{tools.account_id}}'
            name: '{{tools.name}}'
            enabled: '{{tools.enabled}}'
            groupIds: '{{tools.group_ids}}'
    - name: cloud-account-by-type-and-id
      path: /cloud/{cloudType}/{id}
      operations:
      - name: remove-cloud-account
        method: DELETE
        description: Remove an onboarded cloud account
        inputParameters:
        - name: cloudType
          in: path
          type: string
          required: true
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: search-asset
      path: /search/asset
      operations:
      - name: search-asset
        method: POST
        description: Search for cloud assets using RQL queries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            query: '{{tools.query}}'
            timeRange: '{{tools.time_range}}'
            limit: '{{tools.limit}}'
            withResourceJson: '{{tools.with_resource_json}}'
    - name: search-config
      path: /search/config
      operations:
      - name: search-config
        method: POST
        description: Search for cloud configuration data using RQL queries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            query: '{{tools.query}}'
            timeRange: '{{tools.time_range}}'
            limit: '{{tools.limit}}'
            withResourceJson: '{{tools.with_resource_json}}'
    - name: compliance-standards
      path: /compliance
      operations:
      - name: list-compliance-standards
        method: GET
        description: Retrieve a list of all compliance standards
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: reports
      path: /report
      operations:
      - name: list-reports
        method: GET
        description: Retrieve a list of all reports
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: prisma-cloud-code-security
    baseUri: https://api.prismacloud.io/bridgecrew
    description: Prisma Cloud Code Security API for managing repositories, scans, suppressions, errors, and fix suggestions.
    authentication:
      type: apikey
      name: x-redlock-auth
      in: header
      value: '{{env.PRISMA_CLOUD_TOKEN}}'
    resources:
    - name: repositories
      path: /repositories
      operations:
      - name: list-repositories
        method: GET
        description: List all repositories with pagination and filtering.
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        - name: search
          in: query
          type: string
          required: false
        - name: sourceType
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: add-repository
        method: POST
        description: Add a new repository.
        inputParameters:
        - name: id
          in: body
          type: string
          required: true
        - name: sourceType
          in: body
          type: string
          required: true
        - name: owner
          in: body
          type: string
          required: true
        - name: name
          in: body
          type: string
          required: true
        - name: defaultBranch
          in: body
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            id: '{{tools.id}}'
            sourceType: '{{tools.sourceType}}'
            owner: '{{tools.owner}}'
            name: '{{tools.name}}'
            defaultBranch: '{{tools.defaultBranch}}'
      - name: remove-repository
        method: DELETE
        description: Remove a repository.
        inputParameters:
        - name: id
          in: body
          type: string
          required: true
        - name: sourceType
          in: body
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            id: '{{tools.id}}'
            sourceType: '{{tools.sourceType}}'
    - name: scan-integrations
      path: /scans/integrations
      operations:
      - name: list-scan-integrations
        method: GET
        description: List all scan integrations with pagination.
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: scans
      path: /scans
      operations:
      - name: trigger-scan
        method: POST
        description: Trigger a new scan for a repository.
        inputParameters:
        - name: repositoryId
          in: body
          type: string
          required: true
        - name: branch
          in: body
          type: string
          required: true
        - name: scanTypes
          in: body
          type: object
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            repositoryId: '{{tools.repositoryId}}'
            branch: '{{tools.branch}}'
            scanTypes: '{{tools.scanTypes}}'
    - name: scan-status
      path: /scans/{scan_id}
      operations:
      - name: get-scan-status
        method: GET
        description: Get the status of a scan.
        inputParameters:
        - name: scan_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: suppressions
      path: /suppressions
      operations:
      - name: list-suppressions
        method: GET
        description: List all suppressions with pagination and filtering.
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        - name: policyId
          in: query
          type: string
          required: false
        - name: suppressionType
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-suppression
        method: POST
        description: Create a new suppression.
        inputParameters:
        - name: policyId
          in: body
          type: string
          required: true
        - name: suppressionType
          in: body
          type: string
          required: true
        - name: justification
          in: body
          type: string
          required: true
        - name: expirationDate
          in: body
          type: string
          required: false
        - name: resources
          in: body
          type: object
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            policyId: '{{tools.policyId}}'
            suppressionType: '{{tools.suppressionType}}'
            justification: '{{tools.justification}}'
            expirationDate: '{{tools.expirationDate}}'
            resources: '{{tools.resources}}'
    - name: suppression
      path: /suppressions/{suppression_id}
      operations:
      - name: delete-suppression
        method: DELETE
        description: Delete a specific suppression by ID.
        inputParameters:
        - name: suppression_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: errors-by-branch
      path: /errors/branch
      operations:
      - name: get-errors-by-branch
        method: GET
        description: Get errors for a specific repository branch.
        inputParameters:
        - name: repositoryId
          in: query
          type: string
          required: true
        - name: branch
          in: query
          type: string
          required: true
        - name: severity
          in: query
          type: string
          required: false
        - name: errorType
          in: query
          type: string
          required: false
        - name: status
          in: query
          type: string
          required: false
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: fix-suggestions
      path: /fixes/pull_request
      operations:
      - name: get-fix-suggestions-for-pr
        method: GET
        description: Get fix suggestions for a pull request.
        inputParameters:
        - name: repositoryId
          in: query
          type: string
          required: true
        - name: branch
          in: query
          type: string
          required: true
        - name: filePath
          in: query
          type: string
          required: false
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: prisma-cloud-dspm
    baseUri: https://api.prismacloud.io
    authentication:
      type: bearer
      token: '{{env.PRISMA_CLOUD_JWT_TOKEN}}'
    resources:
    - name: data-assets
      path: /dspm/api/v1/data-assets
      operations:
      - name: list-data-assets
        method: GET
        description: Retrieve a list of discovered data assets
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        - name: dataStoreId
          in: query
          type: string
          required: false
        - name: classificationLabel
          in: query
          type: string
          required: false
        - name: sensitivityLevel
          in: query
          type: string
          required: false
        - name: search
          in: query
          type: string
          required: false
        - name: sortBy
          in: query
          type: string
          required: false
        - name: sortOrder
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: data-asset-by-id
      path: /dspm/api/v1/data-assets/{id}
      operations:
      - name: get-data-asset
        method: GET
        description: Retrieve details for a specific data asset
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: risks
      path: /dspm/api/v1/risks
      operations:
      - name: list-risks
        method: GET
        description: Retrieve a list of data security risks
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        - name: riskLevel
          in: query
          type: string
          required: false
        - name: status
          in: query
          type: string
          required: false
        - name: cloudProvider
          in: query
          type: string
          required: false
        - name: search
          in: query
          type: string
          required: false
        - name: sortBy
          in: query
          type: string
          required: false
        - name: sortOrder
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: risk-by-id
      path: /dspm/api/v1/risks/{id}
      operations:
      - name: get-risk
        method: GET
        description: Retrieve details for a specific risk
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: risk-status
      path: /dspm/api/v1/risks/{id}/status
      operations:
      - name: update-risk-status
        method: PUT
        description: Update the status of a specific risk
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            status: '{{tools.status}}'
            comment: '{{tools.comment}}'
    - name: data-stores
      path: /dspm/api/v1/data-stores
      operations:
      - name: list-data-stores
        method: GET
        description: Retrieve a list of data stores
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        - name: cloudProvider
          in: query
          type: string
          required: false
        - name: region
          in: query
          type: string
          required: false
        - name: serviceType
          in: query
          type: string
          required: false
        - name: riskLevel
          in: query
          type: string
          required: false
        - name: hasSensitiveData
          in: query
          type: boolean
          required: false
        - name: search
          in: query
          type: string
          required: false
        - name: sortBy
          in: query
          type: string
          required: false
        - name: sortOrder
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: classifications
      path: /dspm/api/v1/classifications
      operations:
      - name: list-classifications
        method: GET
        description: Retrieve a list of data classifications
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        - name: category
          in: query
          type: string
          required: false
        - name: isBuiltIn
          in: query
          type: boolean
          required: false
        - name: search
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: dspm-policies
      path: /dspm/api/v1/policies
      operations:
      - name: list-dspm-policies
        method: GET
        description: Retrieve a list of DSPM policies
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        - name: enabled
          in: query
          type: boolean
          required: false
        - name: search
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: data-security-alerts
      path: /dspm/api/v1/alerts
      operations:
      - name: list-data-security-alerts
        method: GET
        description: Retrieve a list of data security alerts
        inputParameters:
        - name: offset
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        - name: severity
          in: query
          type: string
          required: false
        - name: status
          in: query
          type: string
          required: false
        - name: cloudProvider
          in: query
          type: string
          required: false
        - name: start_time
          in: query
          type: string
          required: false
        - name: end_time
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: prisma-cloud-mssp
    baseUri: https://api.prismacloud.io
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_PRISMA_CLOUD_TOKEN}}'
    resources:
    - name: login
      path: /api/v1/login
      operations:
      - name: login
        method: POST
        description: Login with username and password.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            username: '{{tools.username}}'
            password: '{{tools.password}}'
    - name: mssp-account
      path: /api/v1/mssp/{mssp_id}
      operations:
      - name: get-mssp
        method: GET
        description: Get the details of an existing MSSP account.
        inputParameters:
        - name: mssp_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: mssp-tos
      path: /api/v1/mssp/{mssp_id}/tos
      operations:
      - name: accept-terms-of-service
        method: POST
        description: Accept terms of service for an MSSP.
        inputParameters:
        - name: mssp_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: mssp-token-refresh
      path: /api/v1/mssp/{mssp_id}/token-refresh
      operations:
      - name: refresh-token
        method: GET
        description: Refresh user JWT token.
        inputParameters:
        - name: mssp_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: mssp-operations
      path: /api/v1/mssp/{mssp_id}/operation
      operations:
      - name: list-operations
        method: GET
        description: Get the operation list for an MSSP.
        inputParameters:
        - name: mssp_id
          in: path
          type: string
          required: true
        - name: status
          in: query
          type: string
          required: false
        - name: show_retried
          in: query
          type: boolean
          required: false
        - name: nextPageToken
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: mssp-operation-retry
      path: /api/v1/mssp/{mssp_id}/operation/{request_id}/retry
      operations:
      - name: retry-operation
        method: POST
        description: Retry a failed MSSP operation.
        inputParameters:
        - name: mssp_id
          in: path
          type: string
          required: true
        - name: request_id
          in: path
          type: string
          required: true
        outputRawFormat: json
