naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Cortex XSOAR REST API — Integrations
  description: 'Palo Alto Networks Cortex XSOAR REST API — Integrations. 2 operations. Lead operation: Palo Alto Networks
    Search Integrations. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Integrations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-cortex-xsoar-integrations
    baseUri: https://{xsoar-server}
    description: Palo Alto Networks Cortex XSOAR REST API — Integrations business capability. Self-contained, no shared references.
    resources:
    - name: integration-search
      path: /integration/search
      operations:
      - name: searchintegrations
        method: GET
        description: Palo Alto Networks Search Integrations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query
          in: query
          type: string
          description: Search query to filter integrations by name or category.
        - name: page
          in: query
          type: integer
        - name: size
          in: query
          type: integer
    - name: settings-integration-search
      path: /settings/integration/search
      operations:
      - name: searchintegrationinstances
        method: POST
        description: Palo Alto Networks Search Integration Instances
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: palo-alto-cortex-xsoar-integrations-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Cortex XSOAR REST API — Integrations. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/integration/search
      name: integration-search
      description: REST surface for integration-search.
      operations:
      - method: GET
        name: searchintegrations
        description: Palo Alto Networks Search Integrations
        call: palo-alto-cortex-xsoar-integrations.searchintegrations
        with:
          query: rest.query
          page: rest.page
          size: rest.size
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/settings/integration/search
      name: settings-integration-search
      description: REST surface for settings-integration-search.
      operations:
      - method: POST
        name: searchintegrationinstances
        description: Palo Alto Networks Search Integration Instances
        call: palo-alto-cortex-xsoar-integrations.searchintegrationinstances
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-cortex-xsoar-integrations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Cortex XSOAR REST API — Integrations. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-search-integrations
      description: Palo Alto Networks Search Integrations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-cortex-xsoar-integrations.searchintegrations
      with:
        query: tools.query
        page: tools.page
        size: tools.size
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-search-integration
      description: Palo Alto Networks Search Integration Instances
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: palo-alto-cortex-xsoar-integrations.searchintegrationinstances
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
