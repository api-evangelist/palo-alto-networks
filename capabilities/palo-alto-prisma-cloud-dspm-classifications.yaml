naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma Cloud DSPM API — Classifications
  description: 'Palo Alto Networks Prisma Cloud DSPM API — Classifications. 1 operations. Lead operation: Palo Alto Networks
    List Data Classification Results. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Classifications
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-prisma-cloud-dspm-classifications
    baseUri: https://api.prismacloud.io
    description: Palo Alto Networks Prisma Cloud DSPM API — Classifications business capability. Self-contained, no shared
      references.
    resources:
    - name: dspm-api-v1-classifications
      path: /dspm/api/v1/classifications
      operations:
      - name: listclassifications
        method: GET
        description: Palo Alto Networks List Data Classification Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: offset
          in: query
          type: integer
          description: Number of records to skip for pagination.
        - name: limit
          in: query
          type: integer
          description: Maximum number of records to return.
        - name: category
          in: query
          type: string
          description: Filter by classification category.
        - name: isBuiltIn
          in: query
          type: boolean
          description: Filter by built-in vs custom classifications.
        - name: search
          in: query
          type: string
          description: Search term to filter by classification name.
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-prisma-cloud-dspm-classifications-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma Cloud DSPM API — Classifications. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/dspm/api/v1/classifications
      name: dspm-api-v1-classifications
      description: REST surface for dspm-api-v1-classifications.
      operations:
      - method: GET
        name: listclassifications
        description: Palo Alto Networks List Data Classification Results
        call: palo-alto-prisma-cloud-dspm-classifications.listclassifications
        with:
          offset: rest.offset
          limit: rest.limit
          category: rest.category
          isBuiltIn: rest.isBuiltIn
          search: rest.search
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-prisma-cloud-dspm-classifications-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Prisma Cloud DSPM API — Classifications. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-data
      description: Palo Alto Networks List Data Classification Results
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-cloud-dspm-classifications.listclassifications
      with:
        offset: tools.offset
        limit: tools.limit
        category: tools.category
        isBuiltIn: tools.isBuiltIn
        search: tools.search
      outputParameters:
      - type: object
        mapping: $.
