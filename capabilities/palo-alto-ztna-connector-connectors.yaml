        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: connector_id
          in: path
          type: string
          description: Unique identifier of the connector.
          required: true
      - name: updateconnector
        method: PUT
        description: Palo Alto Networks Update ZTNA Connector
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
