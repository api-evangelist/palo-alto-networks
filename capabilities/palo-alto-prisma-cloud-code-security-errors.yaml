naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma Cloud Code Security API — Errors
  description: 'Palo Alto Networks Prisma Cloud Code Security API — Errors. 1 operations. Lead operation: Palo Alto Networks
    Get Errors by Branch. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Errors
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-prisma-cloud-code-security-errors
    baseUri: https://api.prismacloud.io/code/api/v1
    description: Palo Alto Networks Prisma Cloud Code Security API — Errors business capability. Self-contained, no shared
      references.
    resources:
    - name: errors-branch
      path: /errors/branch
      operations:
      - name: geterrorsbybranch
        method: GET
        description: Palo Alto Networks Get Errors by Branch
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: repositoryId
          in: query
          type: string
          description: Repository identifier to retrieve errors for.
          required: true
        - name: branch
          in: query
          type: string
          description: Branch name to retrieve errors for. Defaults to the default branch.
        - name: severity
          in: query
          type: string
          description: Filter errors by severity level.
        - name: errorType
          in: query
          type: string
          description: Filter by error category.
        - name: status
          in: query
          type: string
          description: Filter by error status.
        - name: offset
          in: query
          type: integer
          description: Number of records to skip for pagination.
        - name: limit
          in: query
          type: integer
          description: Maximum number of records to return.
    authentication:
      type: apikey
      key: x-redlock-auth
      value: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: palo-alto-prisma-cloud-code-security-errors-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma Cloud Code Security API — Errors. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/errors/branch
      name: errors-branch
      description: REST surface for errors-branch.
      operations:
      - method: GET
        name: geterrorsbybranch
        description: Palo Alto Networks Get Errors by Branch
        call: palo-alto-prisma-cloud-code-security-errors.geterrorsbybranch
        with:
          repositoryId: rest.repositoryId
          branch: rest.branch
          severity: rest.severity
          errorType: rest.errorType
          status: rest.status
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-prisma-cloud-code-security-errors-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Prisma Cloud Code Security API — Errors. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-errors
      description: Palo Alto Networks Get Errors by Branch
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-cloud-code-security-errors.geterrorsbybranch
      with:
        repositoryId: tools.repositoryId
        branch: tools.branch
        severity: tools.severity
        errorType: tools.errorType
        status: tools.status
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
