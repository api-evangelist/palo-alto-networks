        method: POST
        description: Palo Alto Networks Get PCAP File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: get-report
      path: /get/report
      operations:
      - name: getreport
        method: POST
        description: Palo Alto Networks Get Analysis Report
        outputRawFormat: json
