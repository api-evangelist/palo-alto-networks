        inputParameters:
        - name: folder
          in: query
          type: string
          required: false
        - name: snippet
          in: query
          type: string
          required: false
        - name: device
          in: query
          type: string
          required: false
        - name: name
          in: body
          type: string
          required: true
        - name: static
          in: body
          type: object
          required: false
        - name: dynamic
          in: body
          type: object
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
