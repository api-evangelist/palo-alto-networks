naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Network Security Configuration
  description: Unified network security configuration capability for managing firewall objects, security rules, NAT rules,
    and cloud NGFW rule stacks across PAN-OS, Strata Cloud Manager, and Cloud NGFW.
  tags:
  - Palo Alto Networks
  - Network Security
  - Firewall
  - Security Rules
  - Configuration
  created: '2026-04-16'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    PAN_OS_API_KEY: PAN_OS_API_KEY
    PAN_OS_FIREWALL: PAN_OS_FIREWALL
    STRATA_CLOUD_MANAGER_TOKEN: STRATA_CLOUD_MANAGER_TOKEN
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
capability:
  consumes:
  - type: http
    namespace: pan-os-api
    baseUri: https://{firewall}/restapi/v10.2
    description: PAN-OS REST API for managing firewall objects including addresses, address groups, and services.
    authentication:
      type: apikey
      in: header
      name: X-PAN-KEY
      value: '{{PAN_OS_API_KEY}}'
    resources:
    - name: addresses
      path: /Objects/Addresses
      description: Manage firewall address objects.
      operations:
      - name: list-addresses
        method: GET
        description: List address objects.
        inputParameters:
        - name: location
          in: query
          type: string
          required: false
          description: Configuration location (e.g., vsys, panorama).
        - name: vsys
          in: query
          type: string
          required: false
          description: Virtual system name.
        - name: name
          in: query
          type: string
          required: false
          description: Filter by address object name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-address
        method: POST
        description: Create a new address object.
        inputParameters:
        - name: location
          in: query
          type: string
          required: true
          description: Configuration location.
        - name: vsys
          in: query
          type: string
          required: false
          description: Virtual system name.
        - name: name
          in: query
          type: string
          required: true
          description: Name of the address object.
        - name: entry
          in: body
          type: object
          required: true
          description: Address entry with ip-netmask, ip-range, or fqdn.
        body:
          type: json
          data:
            entry: '{{tools.entry}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-address
        method: PUT
        description: Update an existing address object.
        inputParameters:
        - name: location
          in: query
          type: string
          required: true
          description: Configuration location.
        - name: vsys
          in: query
          type: string
          required: false
          description: Virtual system name.
        - name: name
          in: query
          type: string
          required: true
          description: Name of the address object to update.
        - name: entry
          in: body
          type: object
          required: true
          description: Updated address entry.
        body:
          type: json
          data:
            entry: '{{tools.entry}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-address
        method: DELETE
        description: Delete an address object.
        inputParameters:
        - name: location
          in: query
          type: string
          required: true
          description: Configuration location.
        - name: vsys
          in: query
          type: string
          required: false
          description: Virtual system name.
        - name: name
          in: query
          type: string
          required: true
          description: Name of the address object to delete.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: address-groups
      path: /Objects/AddressGroups
      description: Manage firewall address group objects.
      operations:
      - name: list-address-groups
        method: GET
        description: List address group objects.
        inputParameters:
        - name: location
          in: query
          type: string
          required: false
          description: Configuration location.
        - name: vsys
          in: query
          type: string
          required: false
          description: Virtual system name.
        - name: name
          in: query
          type: string
          required: false
          description: Filter by address group name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-address-group
        method: POST
        description: Create a new address group.
        inputParameters:
        - name: location
          in: query
          type: string
          required: true
          description: Configuration location.
        - name: vsys
          in: query
          type: string
          required: false
          description: Virtual system name.
        - name: name
          in: query
          type: string
          required: true
          description: Name of the address group.
        - name: entry
          in: body
          type: object
          required: true
          description: Address group entry.
        body:
          type: json
          data:
            entry: '{{tools.entry}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-address-group
        method: PUT
        description: Update an existing address group.
        inputParameters:
        - name: location
          in: query
          type: string
          required: true
          description: Configuration location.
        - name: vsys
          in: query
          type: string
          required: false
          description: Virtual system name.
        - name: name
          in: query
          type: string
          required: true
          description: Name of the address group to update.
        - name: entry
          in: body
          type: object
          required: true
          description: Updated address group entry.
        body:
          type: json
          data:
            entry: '{{tools.entry}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-address-group
        method: DELETE
        description: Delete an address group.
        inputParameters:
        - name: location
          in: query
          type: string
          required: true
          description: Configuration location.
        - name: vsys
          in: query
          type: string
          required: false
          description: Virtual system name.
        - name: name
          in: query
          type: string
          required: true
          description: Name of the address group to delete.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: services
      path: /Objects/Services
      description: Manage firewall service objects.
      operations:
      - name: list-services
        method: GET
        description: List service objects.
        inputParameters:
        - name: location
          in: query
          type: string
          required: false
          description: Configuration location.
        - name: vsys
          in: query
          type: string
          required: false
          description: Virtual system name.
        - name: name
          in: query
          type: string
          required: false
          description: Filter by service name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-service
        method: POST
        description: Create a new service object.
        inputParameters:
        - name: location
          in: query
          type: string
          required: true
          description: Configuration location.
        - name: vsys
          in: query
          type: string
          required: false
          description: Virtual system name.
        - name: name
          in: query
          type: string
          required: true
          description: Name of the service object.
        - name: entry
          in: body
          type: object
          required: true
          description: Service entry with protocol configuration.
        body:
          type: json
          data:
            entry: '{{tools.entry}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-service
        method: PUT
        description: Update an existing service object.
        inputParameters:
        - name: location
          in: query
          type: string
          required: true
          description: Configuration location.
        - name: vsys
          in: query
          type: string
          required: false
          description: Virtual system name.
        - name: name
          in: query
          type: string
          required: true
          description: Name of the service object to update.
        - name: entry
          in: body
          type: object
          required: true
          description: Updated service entry.
        body:
          type: json
          data:
            entry: '{{tools.entry}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-service
        method: DELETE
        description: Delete a service object.
        inputParameters:
        - name: location
          in: query
          type: string
          required: true
          description: Configuration location.
        - name: vsys
          in: query
          type: string
          required: false
          description: Virtual system name.
        - name: name
          in: query
          type: string
          required: true
          description: Name of the service object to delete.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
