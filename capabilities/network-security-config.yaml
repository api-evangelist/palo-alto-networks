          type: string
          required: false
        - name: device
          in: query
          type: string
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        - name: offset
          in: query
          type: integer
          required: false
        - name: name
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-address
        method: POST
        description: Create a new address object.
        inputParameters:
        - name: folder
          in: query
          type: string
          required: false
        - name: snippet
          in: query
          type: string
          required: false
        - name: device
          in: query
          type: string
          required: false
        - name: name
          in: body
          type: string
          required: true
        - name: ip_netmask
          in: body
          type: string
          required: false
        - name: ip_range
          in: body
          type: string
          required: false
        - name: ip_wildcard
          in: body
          type: string
          required: false
        - name: fqdn
          in: body
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            ip_netmask: '{{tools.ip_netmask}}'
            ip_range: '{{tools.ip_range}}'
            ip_wildcard: '{{tools.ip_wildcard}}'
            fqdn: '{{tools.fqdn}}'
    - name: address
