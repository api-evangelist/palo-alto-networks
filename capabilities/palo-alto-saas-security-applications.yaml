    description: Palo Alto Networks SaaS Security API — Applications business capability. Self-contained, no shared references.
    resources:
    - name: api-applications
      path: /api/applications
      operations:
      - name: listapplications
        method: GET
        description: Palo Alto Networks List Connected SaaS Applications
        outputRawFormat: json
