naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma Access Configuration API — Configuration
  description: 'Palo Alto Networks Prisma Access Configuration API — Configuration. 2 operations. Lead operation: Palo Alto
    Networks Push Candidate Configuration. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Configuration
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-prisma-access-configuration
    baseUri: https://api.sase.paloaltonetworks.com/sse/config/v1
    description: Palo Alto Networks Prisma Access Configuration API — Configuration business capability. Self-contained, no
      shared references.
    resources:
    - name: config-versions-candidate:push
      path: /config-versions/candidate:push
      operations:
      - name: pushcandidateconfig
        method: POST
        description: Palo Alto Networks Push Candidate Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: jobs-id
      path: /jobs/{id}
      operations:
      - name: getjobstatus
        method: GET
        description: Palo Alto Networks Get Job Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Job identifier returned by an asynchronous operation.
          required: true
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-prisma-access-configuration-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma Access Configuration API — Configuration. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/config-versions/candidate-push
      name: config-versions-candidate-push
      description: REST surface for config-versions-candidate:push.
      operations:
      - method: POST
        name: pushcandidateconfig
        description: Palo Alto Networks Push Candidate Configuration
        call: palo-alto-prisma-access-configuration.pushcandidateconfig
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobs/{id}
      name: jobs-id
      description: REST surface for jobs-id.
      operations:
      - method: GET
        name: getjobstatus
        description: Palo Alto Networks Get Job Status
        call: palo-alto-prisma-access-configuration.getjobstatus
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-prisma-access-configuration-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Prisma Access Configuration API — Configuration. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-push-candidate
      description: Palo Alto Networks Push Candidate Configuration
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-prisma-access-configuration.pushcandidateconfig
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-get-job
      description: Palo Alto Networks Get Job Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-access-configuration.getjobstatus
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
