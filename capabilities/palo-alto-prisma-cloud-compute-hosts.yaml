naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma Cloud Compute API — Hosts
  description: 'Palo Alto Networks Prisma Cloud Compute API — Hosts. 1 operations. Lead operation: Palo Alto Networks List
    Host Scan Results. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Hosts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-prisma-cloud-compute-hosts
    baseUri: https://{console}/api/v1
    description: Palo Alto Networks Prisma Cloud Compute API — Hosts business capability. Self-contained, no shared references.
    resources:
    - name: hosts
      path: /hosts
      operations:
      - name: gethosts
        method: GET
        description: Palo Alto Networks List Host Scan Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: offset
          in: query
          type: integer
          description: Number of records to skip for pagination.
        - name: limit
          in: query
          type: integer
          description: Maximum number of records to return.
        - name: search
          in: query
          type: string
          description: Search term to filter hosts by hostname.
        - name: sort
          in: query
          type: string
          description: Field to sort results by.
        - name: reverse
          in: query
          type: boolean
          description: Sort in reverse order.
        - name: collections
          in: query
          type: string
          description: Filter by collection name.
        - name: clusters
          in: query
          type: string
          description: Filter by cluster name.
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-prisma-cloud-compute-hosts-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma Cloud Compute API — Hosts. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/hosts
      name: hosts
      description: REST surface for hosts.
      operations:
      - method: GET
        name: gethosts
        description: Palo Alto Networks List Host Scan Results
        call: palo-alto-prisma-cloud-compute-hosts.gethosts
        with:
          offset: rest.offset
          limit: rest.limit
          search: rest.search
          sort: rest.sort
          reverse: rest.reverse
          collections: rest.collections
          clusters: rest.clusters
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-prisma-cloud-compute-hosts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Prisma Cloud Compute API — Hosts. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-host
      description: Palo Alto Networks List Host Scan Results
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-cloud-compute-hosts.gethosts
      with:
        offset: tools.offset
        limit: tools.limit
        search: tools.search
        sort: tools.sort
        reverse: tools.reverse
        collections: tools.collections
        clusters: tools.clusters
      outputParameters:
      - type: object
        mapping: $.
