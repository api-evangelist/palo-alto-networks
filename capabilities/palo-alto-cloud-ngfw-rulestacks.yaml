      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: palo-alto-cloud-ngfw-rulestacks.deleterulestack
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-commit-rule
      description: Palo Alto Networks Commit Rule Stack
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-cloud-ngfw-rulestacks.commitrulestack
      outputParameters:
      - type: object
        mapping: $.
