naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Cortex Xpanse REST API
  description: 'Palo Alto Networks Cortex Xpanse REST API. 1 operations. Lead operation: Palo Alto Networks Get Exposed Services.
    Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-cortex-xpanse-general
    baseUri: https://api-{fqdn}/public_api/v1
    description: Palo Alto Networks Cortex Xpanse REST API business capability. Self-contained, no shared references.
    resources:
    - name: services-get_services
      path: /services/get_services
      operations:
      - name: getservices
        method: POST
        description: Palo Alto Networks Get Exposed Services
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: x-xdr-hmac-v2
      value: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: palo-alto-cortex-xpanse-general-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Cortex Xpanse REST API. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/services/get-services
      name: services-get-services
      description: REST surface for services-get_services.
      operations:
      - method: POST
        name: getservices
        description: Palo Alto Networks Get Exposed Services
        call: palo-alto-cortex-xpanse-general.getservices
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-cortex-xpanse-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Cortex Xpanse REST API. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-exposed
      description: Palo Alto Networks Get Exposed Services
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: palo-alto-cortex-xpanse-general.getservices
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
