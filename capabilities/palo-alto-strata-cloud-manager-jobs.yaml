naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Strata Cloud Manager API — Jobs
  description: 'Palo Alto Networks Strata Cloud Manager API — Jobs. 1 operations. Lead operation: Palo Alto Networks Get Job
    Status. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Jobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-strata-cloud-manager-jobs
    baseUri: https://api.strata.paloaltonetworks.com
    description: Palo Alto Networks Strata Cloud Manager API — Jobs business capability. Self-contained, no shared references.
    resources:
    - name: sse-config-v1-jobs-id
      path: /sse/config/v1/jobs/{id}
      operations:
      - name: getjob
        method: GET
        description: Palo Alto Networks Get Job Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Job ID returned by an asynchronous operation.
          required: true
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-strata-cloud-manager-jobs-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Strata Cloud Manager API — Jobs. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sse/config/v1/jobs/{id}
      name: sse-config-v1-jobs-id
      description: REST surface for sse-config-v1-jobs-id.
      operations:
      - method: GET
        name: getjob
        description: Palo Alto Networks Get Job Status
        call: palo-alto-strata-cloud-manager-jobs.getjob
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-strata-cloud-manager-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Strata Cloud Manager API — Jobs. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-job
      description: Palo Alto Networks Get Job Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-strata-cloud-manager-jobs.getjob
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
