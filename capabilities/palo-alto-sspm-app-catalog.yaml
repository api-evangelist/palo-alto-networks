naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks SaaS Security Posture Management API — App Catalog
  description: 'Palo Alto Networks SaaS Security Posture Management API — App Catalog. 1 operations. Lead operation: Palo
    Alto Networks List SaaS Application Catalog. Self-contained Naftiko capability covering one Palo Alto Networks business
    surface.'
  tags:
  - Palo Alto Networks
  - App Catalog
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-sspm-app-catalog
    baseUri: https://api.sase.paloaltonetworks.com/sspm
    description: Palo Alto Networks SaaS Security Posture Management API — App Catalog business capability. Self-contained,
      no shared references.
    resources:
    - name: v1-app-catalog
      path: /v1/app-catalog
      operations:
      - name: listappcatalog
        method: GET
        description: Palo Alto Networks List SaaS Application Catalog
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: category
          in: query
          type: string
          description: Filter by application category.
        - name: offset
          in: query
          type: integer
          description: Number of results to skip for pagination.
        - name: limit
          in: query
          type: integer
          description: Maximum number of catalog entries to return.
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-sspm-app-catalog-rest
    port: 8080
    description: REST adapter for Palo Alto Networks SaaS Security Posture Management API — App Catalog. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v1/app-catalog
      name: v1-app-catalog
      description: REST surface for v1-app-catalog.
      operations:
      - method: GET
        name: listappcatalog
        description: Palo Alto Networks List SaaS Application Catalog
        call: palo-alto-sspm-app-catalog.listappcatalog
        with:
          category: rest.category
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-sspm-app-catalog-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks SaaS Security Posture Management API — App Catalog. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-saas
      description: Palo Alto Networks List SaaS Application Catalog
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-sspm-app-catalog.listappcatalog
      with:
        category: tools.category
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
