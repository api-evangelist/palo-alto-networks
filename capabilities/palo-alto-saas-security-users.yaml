naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks SaaS Security API — Users
  description: 'Palo Alto Networks SaaS Security API — Users. 2 operations. Lead operation: Palo Alto Networks Get User Activity.
    Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-saas-security-users
    baseUri: https://api.aperture.paloaltonetworks.com
    description: Palo Alto Networks SaaS Security API — Users business capability. Self-contained, no shared references.
    resources:
    - name: api-user-id-activities
      path: /api/user/{id}/activities
      operations:
      - name: getuseractivities
        method: GET
        description: Palo Alto Networks Get User Activity
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Unique identifier of the user.
          required: true
        - name: start_date
          in: query
          type: string
          description: Filter activities on or after this date (ISO 8601).
        - name: end_date
          in: query
          type: string
          description: Filter activities on or before this date (ISO 8601).
        - name: app_id
          in: query
          type: string
          description: Filter activities by SaaS application.
        - name: limit
          in: query
          type: integer
          description: Maximum number of activity records to return.
    - name: api-users
      path: /api/users
      operations:
      - name: listusers
        method: GET
        description: Palo Alto Networks List Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: app_id
          in: query
          type: string
          description: Filter users by SaaS application.
        - name: offset
          in: query
          type: integer
          description: Number of results to skip for pagination.
        - name: limit
          in: query
          type: integer
          description: Maximum number of users to return.
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-saas-security-users-rest
    port: 8080
    description: REST adapter for Palo Alto Networks SaaS Security API — Users. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/user/{id}/activities
      name: api-user-id-activities
      description: REST surface for api-user-id-activities.
      operations:
      - method: GET
        name: getuseractivities
        description: Palo Alto Networks Get User Activity
        call: palo-alto-saas-security-users.getuseractivities
        with:
          id: rest.id
          start_date: rest.start_date
          end_date: rest.end_date
          app_id: rest.app_id
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/users
      name: api-users
      description: REST surface for api-users.
      operations:
      - method: GET
        name: listusers
        description: Palo Alto Networks List Users
        call: palo-alto-saas-security-users.listusers
        with:
          app_id: rest.app_id
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-saas-security-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks SaaS Security API — Users. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-user
      description: Palo Alto Networks Get User Activity
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-saas-security-users.getuseractivities
      with:
        id: tools.id
        start_date: tools.start_date
        end_date: tools.end_date
        app_id: tools.app_id
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-list-users
      description: Palo Alto Networks List Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-saas-security-users.listusers
      with:
        app_id: tools.app_id
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
