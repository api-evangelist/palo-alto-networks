    description: REST adapter for Palo Alto Networks WildFire API — Submit. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/submit/file
      name: submit-file
      description: REST surface for submit-file.
      operations:
      - method: POST
        name: submitfile
        description: Palo Alto Networks Submit File for Analysis
        call: palo-alto-wildfire-submit.submitfile
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/submit/link
      name: submit-link
      description: REST surface for submit-link.
      operations:
      - method: POST
        name: submitlink
        description: Palo Alto Networks Submit Link for Analysis
        call: palo-alto-wildfire-submit.submitlink
        with:
