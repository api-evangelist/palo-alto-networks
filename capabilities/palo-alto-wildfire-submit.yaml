    resources:
    - name: submit-file
      path: /submit/file
      operations:
      - name: submitfile
        method: POST
        description: Palo Alto Networks Submit File for Analysis
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: submit-link
      path: /submit/link
      operations:
      - name: submitlink
        method: POST
        description: Palo Alto Networks Submit Link for Analysis
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
