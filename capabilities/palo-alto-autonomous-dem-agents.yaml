naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Autonomous DEM API — Agents
  description: 'Palo Alto Networks Autonomous DEM API — Agents. 1 operations. Lead operation: Palo Alto Networks List Monitored
    Agents. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Agents
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-autonomous-dem-agents
    baseUri: https://api.sase.paloaltonetworks.com/adem/telemetry/v2
    description: Palo Alto Networks Autonomous DEM API — Agents business capability. Self-contained, no shared references.
    resources:
    - name: mt-monitor-adem-v1-agents
      path: /mt/monitor/adem/v1/agents
      operations:
      - name: listmonitoredagents
        method: GET
        description: Palo Alto Networks List Monitored Agents
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user_id
          in: query
          type: string
          description: Filter agents by user email or identifier.
        - name: site_name
          in: query
          type: string
          description: Filter agents by site name.
        - name: offset
          in: query
          type: integer
        - name: limit
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-autonomous-dem-agents-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Autonomous DEM API — Agents. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/mt/monitor/adem/v1/agents
      name: mt-monitor-adem-v1-agents
      description: REST surface for mt-monitor-adem-v1-agents.
      operations:
      - method: GET
        name: listmonitoredagents
        description: Palo Alto Networks List Monitored Agents
        call: palo-alto-autonomous-dem-agents.listmonitoredagents
        with:
          user_id: rest.user_id
          site_name: rest.site_name
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-autonomous-dem-agents-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Autonomous DEM API — Agents. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-monitored
      description: Palo Alto Networks List Monitored Agents
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-autonomous-dem-agents.listmonitoredagents
      with:
        user_id: tools.user_id
        site_name: tools.site_name
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
