naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma AIRS API — Scan
  description: 'Palo Alto Networks Prisma AIRS API — Scan. 3 operations. Lead operation: Palo Alto Networks Submit an Asynchronous
    AI Security Scan. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Scan
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-prisma-airs-scan
    baseUri: https://security.api.aisecurity.paloaltonetworks.com
    description: Palo Alto Networks Prisma AIRS API — Scan business capability. Self-contained, no shared references.
    resources:
    - name: v1-scan-async-request
      path: /v1/scan/async/request
      operations:
      - name: submitscanasync
        method: POST
        description: Palo Alto Networks Submit an Asynchronous AI Security Scan
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-scan-async-results-scan_id
      path: /v1/scan/async/results/{scan_id}
      operations:
      - name: getasyncscanresults
        method: GET
        description: Palo Alto Networks Get Asynchronous Scan Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: scan_id
          in: path
          type: string
          description: Unique scan identifier returned by POST /v1/scan/async/request.
          required: true
    - name: v1-scan-sync-request
      path: /v1/scan/sync/request
      operations:
      - name: submitscansync
        method: POST
        description: Palo Alto Networks Submit a Synchronous AI Security Scan
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: x-pan-token
      value: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: palo-alto-prisma-airs-scan-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma AIRS API — Scan. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v1/scan/async/request
      name: v1-scan-async-request
      description: REST surface for v1-scan-async-request.
      operations:
      - method: POST
        name: submitscanasync
        description: Palo Alto Networks Submit an Asynchronous AI Security Scan
        call: palo-alto-prisma-airs-scan.submitscanasync
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/scan/async/results/{scan-id}
      name: v1-scan-async-results-scan-id
      description: REST surface for v1-scan-async-results-scan_id.
      operations:
      - method: GET
        name: getasyncscanresults
        description: Palo Alto Networks Get Asynchronous Scan Results
        call: palo-alto-prisma-airs-scan.getasyncscanresults
        with:
          scan_id: rest.scan_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/scan/sync/request
      name: v1-scan-sync-request
      description: REST surface for v1-scan-sync-request.
      operations:
      - method: POST
        name: submitscansync
        description: Palo Alto Networks Submit a Synchronous AI Security Scan
        call: palo-alto-prisma-airs-scan.submitscansync
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-prisma-airs-scan-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Prisma AIRS API — Scan. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: palo-alto-networks-submit-asynchronous
      description: Palo Alto Networks Submit an Asynchronous AI Security Scan
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-prisma-airs-scan.submitscanasync
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-get-asynchronous
      description: Palo Alto Networks Get Asynchronous Scan Results
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-prisma-airs-scan.getasyncscanresults
      with:
        scan_id: tools.scan_id
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-submit-synchronous
      description: Palo Alto Networks Submit a Synchronous AI Security Scan
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: palo-alto-prisma-airs-scan.submitscansync
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
