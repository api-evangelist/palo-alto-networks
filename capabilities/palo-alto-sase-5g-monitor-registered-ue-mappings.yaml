naftiko: 1.0.0-alpha2
info:
  label: SASE 5G Monitor Service API — Registered UE Mappings
  description: 'SASE 5G Monitor Service API — Registered UE Mappings. 1 operations. Lead operation: Palo Alto Networks Count
    Registered Devices. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Registered UE Mappings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-sase-5g-monitor-registered-ue-mappings
    baseUri: https://stratacloudmanager.paloaltonetworks.com
    description: SASE 5G Monitor Service API — Registered UE Mappings business capability. Self-contained, no shared references.
    resources:
    - name: mt-monitor-5g-ueIp-registered
      path: /mt/monitor/5g/ueIp/registered
      operations:
      - name: getmtmonitor5gueipregistered
        method: GET
        description: Palo Alto Networks Count Registered Devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: palo-alto-sase-5g-monitor-registered-ue-mappings-rest
    port: 8080
    description: REST adapter for SASE 5G Monitor Service API — Registered UE Mappings. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/mt/monitor/5g/ueip/registered
      name: mt-monitor-5g-ueip-registered
      description: REST surface for mt-monitor-5g-ueIp-registered.
      operations:
      - method: GET
        name: getmtmonitor5gueipregistered
        description: Palo Alto Networks Count Registered Devices
        call: palo-alto-sase-5g-monitor-registered-ue-mappings.getmtmonitor5gueipregistered
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-sase-5g-monitor-registered-ue-mappings-mcp
    port: 9090
    transport: http
    description: MCP adapter for SASE 5G Monitor Service API — Registered UE Mappings. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-count-registered
      description: Palo Alto Networks Count Registered Devices
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-sase-5g-monitor-registered-ue-mappings.getmtmonitor5gueipregistered
      outputParameters:
      - type: object
        mapping: $.
