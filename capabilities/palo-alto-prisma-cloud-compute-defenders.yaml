        destructive: false
        idempotent: true
      call: palo-alto-prisma-cloud-compute-defenders.getdefenders
      with:
        offset: tools.offset
        limit: tools.limit
        search: tools.search
        connected: tools.connected
        type: tools.type
        cluster: tools.cluster
      outputParameters:
      - type: object
