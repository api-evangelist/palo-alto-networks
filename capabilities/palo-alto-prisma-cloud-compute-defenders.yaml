naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Prisma Cloud Compute API — Defenders
  description: 'Palo Alto Networks Prisma Cloud Compute API — Defenders. 2 operations. Lead operation: Palo Alto Networks
    List Defenders. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Defenders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
