  - type: http
    namespace: palo-alto-prisma-cloud-compute-defenders
    baseUri: https://{console}/api/v1
    description: Palo Alto Networks Prisma Cloud Compute API — Defenders business capability. Self-contained, no shared references.
    resources:
    - name: defenders
      path: /defenders
      operations:
      - name: getdefenders
        method: GET
        description: Palo Alto Networks List Defenders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: offset
          in: query
          type: integer
          description: Number of records to skip for pagination.
        - name: limit
          in: query
          type: integer
          description: Maximum number of records to return.
        - name: search
          in: query
          type: string
          description: Search term to filter Defenders by hostname.
        - name: connected
          in: query
          type: boolean
          description: Filter by connection status.
        - name: type
          in: query
          type: string
          description: Filter by Defender type.
        - name: cluster
          in: query
          type: string
          description: Filter by cluster name.
    - name: defenders-summary
      path: /defenders/summary
      operations:
      - name: getdefenderssummary
        method: GET
        description: Palo Alto Networks Get Defender Summary Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-prisma-cloud-compute-defenders-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Prisma Cloud Compute API — Defenders. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/defenders
      name: defenders
      description: REST surface for defenders.
      operations:
      - method: GET
        name: getdefenders
        description: Palo Alto Networks List Defenders
        call: palo-alto-prisma-cloud-compute-defenders.getdefenders
        with:
          offset: rest.offset
          limit: rest.limit
          search: rest.search
          connected: rest.connected
          type: rest.type
          cluster: rest.cluster
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/defenders/summary
      name: defenders-summary
      description: REST surface for defenders-summary.
      operations:
      - method: GET
        name: getdefenderssummary
        description: Palo Alto Networks Get Defender Summary Statistics
        call: palo-alto-prisma-cloud-compute-defenders.getdefenderssummary
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
