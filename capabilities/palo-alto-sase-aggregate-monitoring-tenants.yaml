naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks SASE Aggregate Monitoring API — Tenants
  description: 'Palo Alto Networks SASE Aggregate Monitoring API — Tenants. 1 operations. Lead operation: Palo Alto Networks
    Get Tenant Hierarchy. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Tenants
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-sase-aggregate-monitoring-tenants
    baseUri: https://api.sase.paloaltonetworks.com/mt/monitor/v1
    description: Palo Alto Networks SASE Aggregate Monitoring API — Tenants business capability. Self-contained, no shared
      references.
    resources:
    - name: tenants
      path: /tenants
      operations:
      - name: listmonitoringtenants
        method: GET
        description: Palo Alto Networks Get Tenant Hierarchy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tsg_id
          in: query
          type: string
          description: Root TSG ID from which to return the hierarchy. Defaults to the TSG of the authenticated service account.
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-sase-aggregate-monitoring-tenants-rest
    port: 8080
    description: REST adapter for Palo Alto Networks SASE Aggregate Monitoring API — Tenants. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/tenants
      name: tenants
      description: REST surface for tenants.
      operations:
      - method: GET
        name: listmonitoringtenants
        description: Palo Alto Networks Get Tenant Hierarchy
        call: palo-alto-sase-aggregate-monitoring-tenants.listmonitoringtenants
        with:
          tsg_id: rest.tsg_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-sase-aggregate-monitoring-tenants-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks SASE Aggregate Monitoring API — Tenants. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: palo-alto-networks-get-tenant
      description: Palo Alto Networks Get Tenant Hierarchy
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-sase-aggregate-monitoring-tenants.listmonitoringtenants
      with:
        tsg_id: tools.tsg_id
      outputParameters:
      - type: object
        mapping: $.
