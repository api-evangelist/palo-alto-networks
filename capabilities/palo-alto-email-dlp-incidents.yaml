naftiko: 1.0.0-alpha2
info:
  label: Palo Alto Networks Email DLP API — Incidents
  description: 'Palo Alto Networks Email DLP API — Incidents. 3 operations. Lead operation: Palo Alto Networks List Email
    Incidents. Self-contained Naftiko capability covering one Palo Alto Networks business surface.'
  tags:
  - Palo Alto Networks
  - Incidents
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PALO_ALTO_NETWORKS_API_KEY: PALO_ALTO_NETWORKS_API_KEY
capability:
  consumes:
  - type: http
    namespace: palo-alto-email-dlp-incidents
    baseUri: https://api.{region}.dlp.paloaltonetworks.com/v1
    description: Palo Alto Networks Email DLP API — Incidents business capability. Self-contained, no shared references.
    resources:
    - name: email-incidents
      path: /email-incidents
      operations:
      - name: listemailincidents
        method: GET
        description: Palo Alto Networks List Email Incidents
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: offset
          in: query
          type: integer
          description: Pagination offset.
        - name: limit
          in: query
          type: integer
          description: Maximum number of incidents to return.
        - name: status
          in: query
          type: string
          description: Filter incidents by current status.
        - name: start_time
          in: query
          type: string
          description: Start of time range filter (ISO 8601 format).
        - name: end_time
          in: query
          type: string
          description: End of time range filter (ISO 8601 format).
    - name: email-incidents-id
      path: /email-incidents/{id}
      operations:
      - name: getemailincident
        method: GET
        description: Palo Alto Networks Get Email Incident Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Unique incident identifier.
          required: true
    - name: email-incidents-id-verdict
      path: /email-incidents/{id}/verdict
      operations:
      - name: updateemailincidentverdict
        method: PUT
        description: Palo Alto Networks Update Email Incident Verdict
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Unique incident identifier.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.PALO_ALTO_NETWORKS_API_KEY}}'
  exposes:
  - type: rest
    namespace: palo-alto-email-dlp-incidents-rest
    port: 8080
    description: REST adapter for Palo Alto Networks Email DLP API — Incidents. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/email-incidents
      name: email-incidents
      description: REST surface for email-incidents.
      operations:
      - method: GET
        name: listemailincidents
        description: Palo Alto Networks List Email Incidents
        call: palo-alto-email-dlp-incidents.listemailincidents
        with:
          offset: rest.offset
          limit: rest.limit
          status: rest.status
          start_time: rest.start_time
          end_time: rest.end_time
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/email-incidents/{id}
      name: email-incidents-id
      description: REST surface for email-incidents-id.
      operations:
      - method: GET
        name: getemailincident
        description: Palo Alto Networks Get Email Incident Details
        call: palo-alto-email-dlp-incidents.getemailincident
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/email-incidents/{id}/verdict
      name: email-incidents-id-verdict
      description: REST surface for email-incidents-id-verdict.
      operations:
      - method: PUT
        name: updateemailincidentverdict
        description: Palo Alto Networks Update Email Incident Verdict
        call: palo-alto-email-dlp-incidents.updateemailincidentverdict
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: palo-alto-email-dlp-incidents-mcp
    port: 9090
    transport: http
    description: MCP adapter for Palo Alto Networks Email DLP API — Incidents. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: palo-alto-networks-list-email
      description: Palo Alto Networks List Email Incidents
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-email-dlp-incidents.listemailincidents
      with:
        offset: tools.offset
        limit: tools.limit
        status: tools.status
        start_time: tools.start_time
        end_time: tools.end_time
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-get-email
      description: Palo Alto Networks Get Email Incident Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: palo-alto-email-dlp-incidents.getemailincident
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: palo-alto-networks-update-email
      description: Palo Alto Networks Update Email Incident Verdict
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: palo-alto-email-dlp-incidents.updateemailincidentverdict
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
