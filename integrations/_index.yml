# Palo Alto Networks integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in palo-alto-networks-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: palo-alto-networks-splunk
  label: Forward Cortex XDR incidents into Splunk SIEM
  partner: splunk
  category: SIEM
  use_case: Stream Cortex XDR incidents and alerts into Splunk as HEC events so the SOC can correlate Palo Alto
    detections with the rest of their telemetry.
  source: curated
  status: pending-generation
  arazzo: null
- slug: palo-alto-networks-microsoft-sentinel
  label: Push Prisma Cloud alerts into Microsoft Sentinel
  partner: microsoft-sentinel
  category: SIEM
  use_case: Forward Prisma Cloud CSPM alerts into Microsoft Sentinel as custom-log entries so cloud-posture findings
    appear alongside Azure-native detections.
  source: curated
  status: pending-generation
  arazzo: null
- slug: palo-alto-networks-datadog
  label: Stream Prisma Cloud Compute findings to Datadog
  partner: datadog
  category: Observability
  use_case: Forward Prisma Cloud Compute container vulnerability and runtime findings into Datadog as events and
    logs so DevOps sees them in the same pane as application metrics.
  source: curated
  status: pending-generation
  arazzo: null
- slug: palo-alto-networks-servicenow
  label: Open ServiceNow incidents from Cortex XDR detections
  partner: servicenow
  category: ITSM
  use_case: When a Cortex XDR incident crosses a severity threshold, open a matching ServiceNow Incident with full
    Palo Alto context attached for the SOC change-management workflow.
  source: curated
  status: pending-generation
  arazzo: null
- slug: palo-alto-networks-jira
  label: File Prisma Cloud Code Security findings as Jira tickets
  partner: jira
  category: Incident management
  use_case: For every Prisma Cloud Code Security finding above a configured severity, file a Jira issue in the relevant
    project and link the Prisma scan back to the ticket.
  source: curated
  status: pending-generation
  arazzo: null
- slug: palo-alto-networks-slack
  label: Post Cortex XSOAR investigation alerts to Slack
  partner: slack
  category: ChatOps
  use_case: When Cortex XSOAR opens or updates a high-severity investigation, post a formatted alert (with playbook
    links) to a designated Slack channel.
  source: curated
  status: pending-generation
  arazzo: null
- slug: palo-alto-networks-pagerduty
  label: Page on-call from IoT Security critical alerts
  partner: pagerduty
  category: Incident response
  use_case: When IoT Security raises a critical-severity alert against an OT or medical device, trigger a PagerDuty
    incident routed to the correct on-call escalation policy.
  source: curated
  status: pending-generation
  arazzo: null
- slug: palo-alto-networks-okta
  label: Sync Okta groups into PAN-OS user-id for firewall policy
  partner: okta
  category: Identity
  use_case: Map Okta group membership into PAN-OS user-id tag mappings so firewall security rules and NAT rules
    can be authored against Okta groups instead of static IPs.
  source: curated
  status: pending-generation
  arazzo: null
- slug: palo-alto-networks-aws-guardduty
  label: Enrich Prisma Cloud CSPM findings with AWS GuardDuty
  partner: aws-guardduty
  category: Cloud threat detection
  use_case: For each Prisma Cloud CSPM alert on an AWS resource, pull the matching GuardDuty findings for that resource
    and attach them to the alert so the SOC sees both posture and runtime signals in one place.
  source: curated
  status: pending-partner-spec
  arazzo: null
- slug: palo-alto-networks-github-advanced-security
  label: Mirror Prisma Cloud Code Security findings into GitHub code scanning
  partner: github-advanced-security
  category: DevSecOps
  use_case: Push Prisma Cloud Code Security findings into GitHub's code scanning alerts so developers see Palo Alto
    IaC and SCA findings directly in the GitHub UI.
  source: curated
  status: pending-partner-spec
  arazzo: null
- slug: palo-alto-networks-wiz
  label: De-dupe Wiz and Prisma Cloud CSPM findings
  partner: wiz
  category: CSPM
  use_case: For shared cloud accounts monitored by both Wiz and Prisma Cloud CSPM, correlate findings on the same
    resource and dismiss duplicates in Prisma Cloud where Wiz has the equivalent finding.
  evidence: https://cortex.marketplace.pan.dev/marketplace/details/Wiz/
  type: marketplace
  source: curated
  status: not-a-workflow
  arazzo: null
- slug: palo-alto-networks-snyk
